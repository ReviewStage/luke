<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      connect-src names LiveKit Cloud for Luke's avatar, whose session the
      panel runs. The one live session so far joined
      keyframelabs-n1yiobta.livekit.cloud (the voice service's avatar-started
      log), but the wildcard stays: LiveKit's client fails a refused join over
      to the regional hosts the project's /settings/regions answers, which sit
      on other *.livekit.cloud names no tighter source covers.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://*.googleusercontent.com https://github.com https://avatars.githubusercontent.com; media-src 'self' blob: mediastream:; connect-src https://us.i.posthog.com https://us-assets.i.posthog.com wss://*.livekit.cloud https://*.livekit.cloud; worker-src blob:; object-src 'none'; frame-src luke-page:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luke</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="renderer.js"></script>
  </body>
</html>
