<!doctype html>
<html lang="en" data-luke-profile="web" data-luke-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luke - A better way to plan with agents</title>
    <meta
      name="description"
      content="Luke is an open-source Mac app for planning a feature out loud before a coding agent builds it. He reads your code while you talk and writes the plan down."
    />
    <!-- Matches the page background so mobile browser chrome blends into it. -->
    <meta name="theme-color" content="#fbfbfa" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Luke" />
    <meta property="og:title" content="Luke: a better way to plan with agents" />
    <meta
      property="og:description"
      content="Luke is an open-source Mac app for planning a feature out loud before a coding agent builds it. He reads your code while you talk and writes the plan down."
    />
    <meta property="og:url" content="https://tryluke.dev/" />
    <!-- The 1200x630 card every unfurler reads — Facebook, LinkedIn, Slack,
         Discord, iMessage, WhatsApp, and Telegram all take these Open Graph
         tags. The URL is absolute because scrapers resolve nothing, the
         dimensions let a first share render before the image is fetched, and
         the alt is what screen readers get on platforms that honor it. The
         PNG is cut from packages/brand/assets/social/luke-og-card.svg — see
         packages/brand/README.md. -->
    <meta property="og:image" content="https://tryluke.dev/luke-og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta
      property="og:image:alt"
      content="The LUKE wordmark — a smiling L-face followed by U, K, E — on space black."
    />
    <!-- summary_large_image is what makes X and Discord show the card full
         width instead of as a thumbnail. X documents falling back to the
         Open Graph tags, but its crawler renders no image on that fallback,
         so the card is repeated under the twitter: names it reads. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Luke: a better way to plan with agents" />
    <meta
      name="twitter:description"
      content="Luke is an open-source Mac app for planning a feature out loud before a coding agent builds it. He reads your code while you talk and writes the plan down."
    />
    <meta name="twitter:image" content="https://tryluke.dev/luke-og-card.png" />
    <meta
      name="twitter:image:alt"
      content="The LUKE wordmark — a smiling L-face followed by U, K, E — on space black."
    />

    <!-- Luke's app icon: the L-face on its space-black tile, cut from the
         generated packages/brand/assets/icon/luke-favicon.svg (see
         packages/brand/README.md). The SVG serves browsers that take one, the
         ICO the readers that ask for /favicon.ico by name, and the touch icon
         iOS's home screen and the link previews that show a site's icon.
         Files rather than an inline data address, so every page shares one
         copy and a reader that fetches an icon by URL finds it. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
