<!doctype html>
<html lang="en" data-luke-profile="web" data-luke-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Changelog — Luke</title>
    <meta name="description" content="What changed in each Luke release." />
    <!-- Matches the page background so mobile browser chrome blends into it. -->
    <meta name="theme-color" content="#fbfbfa" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Luke" />
    <meta property="og:title" content="Changelog — Luke" />
    <meta property="og:description" content="What changed in each Luke release." />
    <meta property="og:url" content="https://tryluke.dev/changelog" />
    <!-- The same 1200x630 card the landing page shares — the tag set is
         documented there, in index.html. -->
    <meta property="og:image" content="https://tryluke.dev/luke-og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta
      property="og:image:alt"
      content="The LUKE wordmark — a smiling L-face followed by U, K, E — on space black."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Every release as an item a feed reader follows, linking to its own page. -->
    <link rel="alternate" type="application/rss+xml" title="Luke changelog" href="/changelog/rss.xml" />

    <!-- Luke's app icon, the same icons the landing page carries — the tag set
         is documented there, in index.html. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/changelog.tsx"></script>
  </body>
</html>
