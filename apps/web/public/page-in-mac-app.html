<!doctype html>
<!-- What an agent's page frame shows in the web app until pages have a sandboxed
     origin of their own to be served from: the page opens in the Mac app. The
     web platform (`src/app/web-platform.ts`) frames this for every page. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Open in the Mac app</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        text-align: center;
        color: GrayText;
      }
      p {
        margin: 0;
        padding: 1.5rem;
        max-width: 22rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <p>Pages open in the Mac app for now. Open this task in Luke on your Mac to see it.</p>
  </body>
</html>
