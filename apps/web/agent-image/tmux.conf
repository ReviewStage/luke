# tmux as each Terminal tab's shell runs under it (`packages/service/src/agents/terminal/tmux.ts`):
# kept out of sight, with no status line and no mouse, so the terminal's own selection and
# scrollback work, its output scrolling into that scrollback rather than an alternate screen; the
# newest window's size, so two windows on one shell size it to the last one used; and no shell
# history written to a file the agent could read, since what a developer types is theirs.
set -g status off
set -g mouse off
set -sg escape-time 0
set -g history-limit 50000
set -g window-size latest
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm*:smcup@:rmcup@"
set-environment -g HISTFILE /dev/null
