<!doctype html>
<html lang="en" data-luke-profile="web" data-luke-theme="light" data-luke-density="compact">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover draws the page under a phone's notch and home
         indicator, which the stage keeps off through the safe-area insets
         (packages/panel/src/styles/desktop.css). interactive-widget has
         Android shrink the layout viewport for the keyboard, as iOS's
         visual viewport already does; the stage, measured by the visual
         viewport (use-visual-viewport.ts), reads a keyboard inset of zero
         then, so the two never count the keyboard twice. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="robots" content="noindex" />
    <!-- The light ground, as the landing page names it, so mobile browser chrome blends into it;
         the account's theme, dark included, rewrites it (`public/app-theme.js`). -->
    <meta name="theme-color" content="#fffcfa" />
    <!-- The theme the account last chose here, worn before the first frame; after the meta it tints. -->
    <script src="/app-theme.js"></script>
    <title>Vespin</title>

    <meta
      name="description"
      content="Vespin is an inbox for all your coding agents."
    />

    <!-- What Slack, iMessage, X, and every other unfurler shows for a pasted
         Vespin link, which this page is served at: the site's own card, the
         same for every link. An unfurler fetches the link signed out, so
         whatever these tags say, anyone holding the link reads; they carry
         nothing of the thing it opens, not even the workspace its address
         names, and nothing here is written per link. The tag set is the
         landing page's, documented in index.html, but for og:url, which is
         left out: a static one could only name the site, and a service that
         takes og:url as where its card leads would send the link's reader to
         the landing page, so each unfurler keeps the link it was handed. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vespin" />
    <meta property="og:title" content="Vespin" />
    <meta
      property="og:description"
      content="Vespin is an inbox for all your coding agents."
    />
    <meta property="og:image" content="https://vespin.dev/luke-og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta
      property="og:image:alt"
      content="The Vespin logo — a disc cut by a V, beside the name — on a near-black ground."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vespin" />
    <meta
      name="twitter:description"
      content="Vespin is an inbox for all your coding agents."
    />
    <meta name="twitter:image" content="https://vespin.dev/luke-og-card.png" />
    <meta
      name="twitter:image:alt"
      content="The Vespin logo — a disc cut by a V, beside the name — on a near-black ground."
    />

    <!-- Vespin's app icon, the same icons the landing page carries — the tag set
         is documented there, in index.html. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Installable: added to a phone's Home Screen, the app opens at /app
         full screen. It posts no notifications on a phone, installed or not:
         Android's Chrome and iOS show one only through a service worker,
         which the app has none of (`src/app/web-notices.ts`). The status bar stays default (dark text on a light
         bar), because a translucent one would draw white text over the
         light ground. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Vespin" />
  </head>
  <body>
    <!-- The shell's frame, drawn the moment the page and its stylesheet land,
         while the host stands in the tab and reads the session, which only
         then draws the panel: React's first render replaces it, and a tab
         that can draw nothing takes it down (`src/app/web-root.tsx`). It is
         built of the shell's own classes (`@luke/panel`'s `desktop.css`), so
         each box stands where the shell's does. The sidebar stands only where
         this browser last read someone signed in and drew it pinned, and the
         stage is wide enough to pin it, which the head's script reads
         (`public/app-theme.js`); everywhere else, a phone or a visitor signed
         out among it, the work column is
         the whole frame, and the product's mark comes up in it should the wait run
         on (`src/app/app.css`). -->
    <div id="root">
      <div class="app-stage boot-frame" data-surface="desktop" aria-hidden="true">
        <div class="desktop-stage">
          <div class="desktop-shell">
            <aside class="desktop-sidebar">
              <div class="desktop-drag-strip"></div>
              <div class="sidebar-identity">
                <span class="sidebar-identity-face">
                  <svg class="luke-product-mark" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
                    <path fill="currentColor" d="M0,50c0,-12.93 4.91,-24.71 12.96,-33.59l0.00,0.00c0.54,-0.60 1.34,-0.98 2.22,-0.98c1.22,0 2.28,0.73 2.74,1.79l25.88,55.50c1.04,2.37 3.41,4.03 6.18,4.03c2.76,0 5.13,-1.65 6.18,-4.03l25.88,-55.50c0.46,-1.05 1.51,-1.79 2.74,-1.79c0.88,0 1.67,0.37 2.22,0.98l0.00,-0.00c8.05,8.87 12.96,20.66 12.96,33.59c0,27.61 -22.38,50 -50,50c-27.61,0 -50,-22.38 -50,-50zM30.12,4.10c6.09,-2.64 12.81,-4.10 19.87,-4.10c7.06,0 13.78,1.46 19.87,4.10l-0.00,0.01c1.06,0.46 1.80,1.52 1.80,2.75c0,0.47 -0.11,0.92 -0.30,1.32l-18.16,38.95c-0.54,1.23 -1.77,2.09 -3.20,2.09c-1.43,0 -2.66,-0.86 -3.20,-2.09l-18.16,-38.95c-0.19,-0.39 -0.30,-0.84 -0.30,-1.32c0,-1.23 0.74,-2.29 1.80,-2.75z" />
                  </svg>
                </span>
                <span class="sidebar-identity-copy">
                  <span class="sidebar-identity-name">Vespin</span>
                </span>
              </div>
              <div class="sidebar-places">
                <span class="luke-nav-item boot-frame-row"></span>
                <span class="luke-nav-item boot-frame-row"></span>
                <span class="luke-nav-item boot-frame-row"></span>
                <span class="luke-nav-item boot-frame-row"></span>
                <span class="luke-nav-item boot-frame-row"></span>
                <span class="luke-nav-item boot-frame-row"></span>
              </div>
            </aside>
            <main class="desktop-main">
              <span class="sidebar-identity-face boot-frame-mark">
                <svg class="luke-product-mark" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
                  <path fill="currentColor" d="M0,50c0,-13.55 5.39,-25.84 14.14,-34.84c0.54,-0.56 1.30,-0.90 2.15,-0.90c1.22,0 2.28,0.73 2.74,1.79l26.14,56.07c0.81,1.84 2.65,3.13 4.80,3.13c2.14,0 3.99,-1.29 4.80,-3.13l26.14,-56.07c0.46,-1.05 1.51,-1.79 2.74,-1.79c0.84,0 1.60,0.34 2.15,0.90c8.75,9.00 14.14,21.29 14.14,34.84c0,27.61 -22.38,50 -50,50c-27.61,0 -50,-22.38 -50,-50zM28.66,4.76c6.46,-3.05 13.70,-4.76 21.33,-4.76c7.63,0 14.86,1.70 21.33,4.76l-0.00,0.01c1.01,0.48 1.72,1.51 1.72,2.71c0,0.47 -0.11,0.92 -0.30,1.32l-19.99,42.87c-0.46,1.05 -1.51,1.79 -2.74,1.79c-1.22,0 -2.28,-0.73 -2.74,-1.79l-19.99,-42.87c-0.19,-0.39 -0.30,-0.84 -0.30,-1.32c0,-1.19 0.70,-2.23 1.72,-2.71z" />
                </svg>
              </span>
            </main>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
