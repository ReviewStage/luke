packages:
  - "apps/*"
  - "apps/web/eve"
  - "packages/*"
  - "tools/*"

catalog:
  typescript: 7.0.2
  effect: 4.0.0-rc.115
  "@effect/atom-react": 4.0.0-rc.115
  "@effect/platform-node": 4.0.0-rc.115
  "@effect/sql-pg": 4.0.0-rc.115
  "@types/node": 26.2.0
  tsx: 4.23.12
  react: 19.2.8
  react-dom: 19.2.8
  ws: 8.21.3
  ai: 7.0.97
  vitest: 5.0.0
  "@effect/vitest": 4.0.0-rc.115

catalogs:
  web:
    typescript: 6.0.3
    "@types/node": 22.20.1

# Every dependency here builds nothing this repository needs: esbuild runs from
# its platform package, @sentry/cli is only reached with an auth token no check
# carries, and the other two are transitive Windows and polyfill packages. Listed
# so an install says so once instead of printing the approval box every time.
ignoredBuiltDependencies:
  - "@sentry/cli"
  - core-js
  - electron-winstaller
  - esbuild
