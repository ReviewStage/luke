packages:
  - "apps/*"
  - "apps/web/eve"
  - "packages/*"
  - "tools/*"

catalog:
  typescript: 7.0.2
  effect: 3.22.2
  "@effect-atom/atom": 0.7.0
  "@effect-atom/atom-react": 0.7.0
  "@effect/platform": 0.97.2
  "@effect/platform-node": 0.108.0
  "@effect/rpc": 0.76.2
  "@effect/experimental": 0.61.1
  "@effect/sql": 0.52.1
  "@effect/sql-pg": 0.52.1
  "@types/node": 26.2.0
  tsx: 4.23.12
  react: 19.2.8
  react-dom: 19.2.8
  ws: 8.21.3
  ai: 7.0.97
  vitest: 3.2.7
  "@effect/vitest": 0.30.0

catalogs:
  web:
    typescript: 6.0.3
    "@types/node": 22.20.1

# Every dependency here builds nothing this repository needs: esbuild runs from
# its platform package, @sentry/cli is only reached with an auth token no check
# carries, and the other two are transitive Windows and polyfill packages. Listed
# so an install says so once instead of printing the approval box every time.
ignoredBuiltDependencies:
  - "@sentry/cli"
  - core-js
  - electron-winstaller
  - esbuild
