packages:
  - "apps/*"
  - "packages/*"
  - "tools/*"

catalog:
  typescript: 7.0.2
  effect: 4.0.4
  "@effect/atom-react": 4.0.4
  "@effect/platform-node": 4.0.4
  "@effect/sql-pg": 4.0.4
  "@effect/sql-pglite": 4.0.4
  "@types/node": 26.2.0
  tsx: 4.23.12
  react: 19.2.8
  react-dom: 19.2.8
  ws: 8.21.3
  ai: 7.0.135
  drizzle-orm: 1.0.0-rc.4
  drizzle-kit: 1.0.0-rc.4
  vitest: 5.0.0
  "@effect/vitest": 4.0.4
  "@orpc/contract": 2.0.0-beta.44
  "@orpc/experimental-effect": 2.0.0-beta.44
  "@orpc/openapi": 2.0.0-beta.44
  "@orpc/server": 2.0.0-beta.44

# The workspaces that resolve a dependency away from the catalog above, and
# it is the compiler alone, held to TypeScript 6 because each needs the compiler
# API that the native 7 does not ship: `apps/web`, whose
# `server/api-callers.ts` walks its routes through it, and the root, whose
# discarded-effect check does (`scripts/lib/discarded-effect.mjs`). `apps/luke`
# and `apps/dev` call `tsc` alone, so they typecheck on the catalog's 7. `@types/node` used to be pinned here
# too, at 22.x, on the stated ground that it matched Vercel's own runtime; it
# did not, because `apps/web`'s `engines.node` says 24.x and that is what Vercel
# takes the runtime from. The pin bought no safety either, since every
# `@luke/*` package the functions import is already checked against the
# catalog's types, so the deployed graph was never held to 22.x. What it did buy
# was a second `vitest`: `@types/node` is a peer of `vitest`, so pnpm stood one
# copy up per version, `@effect/vitest` read the collector out of whichever copy
# it resolved itself, and `apps/web/vitest.config.ts` had to inline
# `@effect/vitest` to force the two back together. One `@types/node` is one
# `vitest`, and that workaround is gone with it.
catalogs:
  web:
    typescript: 6.0.3

# Every dependency here builds nothing this repository needs: esbuild runs from
# its platform package, @sentry/cli is only reached with an auth token no check
# carries, and the other two are transitive Windows and polyfill packages. Listed
# so an install says so once instead of printing the approval box every time.
ignoredBuiltDependencies:
  - "@sentry/cli"
  - core-js
  - electron-winstaller
  - esbuild

# `@better-auth/oauth-provider` 1.7.7 declares its `/oauth2/authorize` OpenAPI
# parameters with `items?: undefined`, which `exactOptionalPropertyTypes` (on in
# `tsconfig.base.json`) refuses against better-call's `OpenAPIParameter`, so the
# plugin stops typing as a `BetterAuthPlugin` and its endpoints fall off
# `auth.api`. The patch drops those four lines of the emitted declaration and
# nothing at runtime; delete it when an upstream release types them cleanly.
patchedDependencies:
  "@better-auth/oauth-provider@1.7.7": patches/@better-auth__oauth-provider@1.7.7.patch
#
# `drizzle-orm` 1.0.0-rc.4's Effect code is patched for three things. Its error
# classes call `Schema.TaggedErrorClass`, which Effect 4.0.4 stable names
# `Schema.TaggedError`, so the Effect drivers fail to load at all; the patch
# makes the same rename upstream's unreleased rc.5 builds make. Its Postgres
# and PGlite declarations import `SqlError` from `effect/unstable/sql/SqlError`,
# a path 4.0.4 does not have, which `skipLibCheck` turns into `any` in every
# transaction's and migration's error channel; the patch points them at
# `effect/sql/SqlError`. And its
# Postgres driver fails a statement with an `EffectDrizzleQueryError` that
# carries the statement's bound parameters and prints them in its `message`,
# and a parameter can be an account's secret (a sealed provider key, a token)
# that AGENTS.md's Never rule keeps out of every log, span, and answer; the
# patch builds that error with no parameters, keeping the statement's text and
# its cause. `apps/web/tests/drizzle-driver.test.ts` holds all three. Delete
# the patch when drizzle-orm 1.0.0-rc.5 is released and carries them.
  drizzle-orm@1.0.0-rc.4: patches/drizzle-orm@1.0.0-rc.4.patch

# A dependency is keyed by its peers' names alone, not by the peers' own peer
# graphs, so one `vitest` serves every workspace. Keyed in full, a peer's own
# optional peers can split `vitest` in two, and `@effect/vitest` then reads
# its collector out of the other copy, as the old `@types/node` pin once did.
dedupePeers: true
