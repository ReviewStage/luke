name: Sandbox image

# Publishes the coding agent's OCI image, which a host's or a Mac's microVM
# boots (`packages/service/src/agents/sandbox-oci-image.ts`), on every push to
# `main`: the push whose deployment rebuilds the Vercel template from the same
# preparation. Its tag is the preparation's key, so a push that leaves the
# preparation alone finds its image published and builds nothing, and one
# that moves it publishes a new tag; no tag is ever written over. Each
# platform is built on a runner of its own architecture and pushed as
# `<key>-<arch>`, then the two are joined as `<key>`, whose digest the run's
# summary names for a host to pin. Pull requests build it without publishing
# (`ci.yml`).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Note that runs queue rather than cancel, so a second push of one key waits
# for the first to publish it, then finds it published.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      - run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: ./scripts/sandbox-image.sh build ${{ matrix.platform }} --push

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      - run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: ./scripts/sandbox-image.sh publish
