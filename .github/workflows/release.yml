name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Whether the signing secrets exist, asked in a step because that is the
  # only place the `secrets` context is allowed — a job-level `if` cannot
  # read it, and referencing it there fails the whole workflow at startup.
  # The expression compares to empty and never prints the secret itself.
  gate:
    name: Check for signing secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      signable: ${{ steps.check.outputs.signable }}
    steps:
      - id: check
        run: echo "signable=${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' }}" >> "$GITHUB_OUTPUT"

  release:
    name: Sign and notarize macOS release
    # Until the Apple secrets are configured, releases are cut by hand with
    # pnpm release:macos and scripts/release/publish-github.sh — so a tag push
    # skips this job cleanly instead of failing it. A manual dispatch still
    # runs unconditionally, so asking for a rehearsal without secrets fails
    # loudly at the check below rather than silently doing nothing.
    needs: gate
    if: ${{ github.event_name == 'workflow_dispatch' || needs.gate.outputs.signable == 'true' }}
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "16.2"

      - name: Check release secrets
        env:
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          GOOGLE_CALENDAR_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_CALENDAR_OAUTH_CLIENT_SECRET }}
          POSTHOG_PROJECT_API_KEY: ${{ secrets.POSTHOG_PROJECT_API_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          for secret_name in \
            MACOS_CERTIFICATE_P12_BASE64 \
            MACOS_CERTIFICATE_PASSWORD \
            APPLE_API_KEY_P8_BASE64 \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER_ID \
            GOOGLE_CALENDAR_OAUTH_CLIENT_SECRET \
            POSTHOG_PROJECT_API_KEY \
            SENTRY_AUTH_TOKEN \
            SENTRY_DSN; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "error: required GitHub Actions secret is missing: $secret_name" >&2
              exit 1
            fi
          done

      - uses: ./.github/actions/setup

      - name: Resolve release version
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF" != "refs/tags/v$VERSION" ]]; then
            echo "error: tag $GITHUB_REF does not match desktop version v$VERSION" >&2
            exit 1
          fi

          {
            echo "VERSION=$VERSION"
            node -e '
              import("./apps/desktop/scripts/release-config.mjs").then((config) => {
                const version = process.argv[1];
                const distDirectory = config.builderReleaseArtifactDirectory(process.cwd());
                const zipName = config.releaseZipFileName(version);
                const dmgName = config.releaseDmgFileName(version);
                process.stdout.write(
                  [
                    `DIST_DIR=${distDirectory}`,
                    `ASSET_NAME=${zipName}`,
                    `CHECKSUM_NAME=${zipName}.sha256`,
                    `DMG_ASSET_NAME=${dmgName}`,
                    `DMG_CHECKSUM_NAME=${dmgName}.sha256`,
                    `LATEST_DMG_ASSET_NAME=${config.RELEASE_LATEST_DMG_FILE_NAME}`,
                    `UPDATE_FEED_ASSET_NAME=${config.RELEASE_UPDATE_FEED_FILE_NAME}`,
                    `APP_PATH=${distDirectory}/mac-arm64/Luke.app`,
                    `UPDATE_FEED_PATH=${distDirectory}/${config.RELEASE_UPDATE_FEED_FILE_NAME}`,
                    "",
                  ].join("\n"),
                );
              });
            ' "$VERSION"
          } >> "$GITHUB_ENV"

      - name: Run repository checks
        run: ./scripts/check.sh

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: ./scripts/release/setup-keychain.sh

      - name: Build signed, notarized release artifacts
        env:
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          GOOGLE_CALENDAR_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_CALENDAR_OAUTH_CLIENT_SECRET }}
          POSTHOG_PROJECT_API_KEY: ${{ secrets.POSTHOG_PROJECT_API_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          key_directory=$(mktemp -d "$RUNNER_TEMP/luke-notary.XXXXXX")
          trap 'rm -rf "$key_directory"' EXIT
          APPLE_API_KEY_PATH="$key_directory/AuthKey_$APPLE_API_KEY_ID.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | /usr/bin/base64 -D > "$APPLE_API_KEY_PATH"
          chmod 600 "$APPLE_API_KEY_PATH"
          export APPLE_API_KEY_PATH
          pnpm --filter @luke/desktop release

      - name: Verify signed application
        run: |
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign_details=$(codesign -dvv "$APP_PATH" 2>&1)
          printf '%s\n' "$codesign_details"
          grep -q "Authority=Developer ID Application" <<< "$codesign_details"
          grep -Eq "flags=.*\(.*runtime.*\)" <<< "$codesign_details"

          architectures=$(lipo -archs "$APP_PATH/Contents/MacOS/Luke")
          if [[ "$architectures" != "arm64" ]]; then
            echo "error: expected an arm64-only application, found: $architectures" >&2
            exit 1
          fi

          if [[ -z $(find "$APP_PATH" -name LUKE-LICENSE.txt -print -quit) ]]; then
            echo "error: LUKE-LICENSE.txt is missing from the application bundle" >&2
            exit 1
          fi

          if [[ -n $(find "$APP_PATH" -name '*.map' -print -quit) ]]; then
            echo "error: source maps must not be packaged in the application" >&2
            exit 1
          fi

      - name: Validate notarized application
        run: |
          assessment=$(spctl --assess --type execute -vv "$APP_PATH" 2>&1)
          printf '%s\n' "$assessment"
          grep -q "source=Notarized Developer ID" <<< "$assessment"
          xcrun stapler validate "$APP_PATH"

      - name: Verify DMG, archive, and update manifest
        run: |
          for artifact_path in \
            "$DIST_DIR/$ASSET_NAME" \
            "$DIST_DIR/$CHECKSUM_NAME" \
            "$DIST_DIR/$DMG_ASSET_NAME" \
            "$DIST_DIR/$DMG_CHECKSUM_NAME" \
            "$DIST_DIR/$LATEST_DMG_ASSET_NAME" \
            "$UPDATE_FEED_PATH"; do
            if [[ ! -f "$artifact_path" ]]; then
              echo "error: missing release artifact: $artifact_path" >&2
              exit 1
            fi
          done

          codesign --verify --strict "$DIST_DIR/$DMG_ASSET_NAME"
          spctl --assess --type open --context context:primary-signature -vv "$DIST_DIR/$DMG_ASSET_NAME"
          xcrun stapler validate "$DIST_DIR/$DMG_ASSET_NAME"
          hdiutil verify "$DIST_DIR/$DMG_ASSET_NAME"
          (
            cd "$DIST_DIR"
            shasum -a 256 -c "$CHECKSUM_NAME"
            shasum -a 256 -c "$DMG_CHECKSUM_NAME"
          )
          cmp "$DIST_DIR/$DMG_ASSET_NAME" "$DIST_DIR/$LATEST_DMG_ASSET_NAME"
          node <<'NODE'
          const fs = require("node:fs");
          const manifest = fs.readFileSync(process.env.UPDATE_FEED_PATH, "utf8");
          const archive = process.env.ASSET_NAME;
          if (!manifest.includes(`url: ${archive}`)) throw new Error("latest-mac.yml does not name the release zip");
          if (!manifest.includes(`path: ${archive}`)) throw new Error("latest-mac.yml path is not the release zip");
          if (/https?:\/\//.test(manifest)) throw new Error("latest-mac.yml must use relative archive URLs");
          if (!/sha512: \S+/.test(manifest)) throw new Error("latest-mac.yml is missing sha512");
          if (!/size: \d+/.test(manifest)) throw new Error("latest-mac.yml is missing size");
          NODE

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release/publish-github.sh

      - name: Preserve rehearsal artifacts
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: luke-${{ env.VERSION }}-macos-arm64-rehearsal
          path: |
            ${{ env.DIST_DIR }}/${{ env.ASSET_NAME }}
            ${{ env.DIST_DIR }}/${{ env.CHECKSUM_NAME }}
            ${{ env.DIST_DIR }}/${{ env.DMG_ASSET_NAME }}
            ${{ env.DIST_DIR }}/${{ env.DMG_CHECKSUM_NAME }}
            ${{ env.DIST_DIR }}/${{ env.LATEST_DMG_ASSET_NAME }}
            ${{ env.DIST_DIR }}/${{ env.UPDATE_FEED_ASSET_NAME }}
          if-no-files-found: error
          retention-days: 14

      - name: Remove release keychain
        if: ${{ always() }}
        env:
          LUKE_RELEASE_KEYCHAIN: ${{ env.LUKE_RELEASE_KEYCHAIN }}
        run: ./scripts/release/cleanup-keychain.sh
