name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI is Linux only: the packaged macOS app is proven where it is built, by
# `./scripts/verify.sh` at the developer's hand before a UI change is opened
# and by the release workflow before anything ships. Every job below is
# independent and runs at once, so a run takes as long as its longest job:
# the tests, which are the bulk of `check.sh`, are sharded across runners
# rather than run behind the lint and typecheck.
jobs:
  portable:
    name: TypeScript checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      - run: ./scripts/check.sh --without test

  tests:
    name: Tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      # The harness tests are one small `node --test` pass, so one shard owns them.
      - if: ${{ matrix.shard == 1 }}
        run: pnpm test:harness
      - run: pnpm exec vitest run --shard=${{ matrix.shard }}/4

  # The store tests run on PGlite inside the test shards above; this job is
  # the one place the generated migrations and the same tests meet a real
  # Postgres, so a statement PGlite accepts and Postgres refuses is caught
  # before a deployment's `db:migrate` finds it. The image is the major
  # production runs (Neon, 18.x), which is also the major PGlite embeds; a
  # test that fails here fails about the database the service actually runs.
  # `db:migrate` migrates the `luke` database and nothing else writes to it:
  # each test file clones it as a template into a database of its own and
  # drops the clone when it is done (`tests/support/store-test-postgres.ts`),
  # so a statement one file forgets to scope reaches no other file's rows here
  # any more than it does on PGlite. The image is Docker's official one, and a
  # runner pulls it anonymously from a shared address, so every registry it
  # can come from meets a rate limit sooner or later: Docker Hub's pull count,
  # then AWS's public mirror's data limit. A service container gets one pull
  # (the runner's own three tries, seconds apart, at the one registry), so
  # the container is a step instead: each round tries AWS's mirror, Google's
  # mirror, then Docker Hub, and a round that finds all three throttled waits
  # and tries again. It starts before the checkout so it boots while the
  # workspace installs, as a service container did, and the job waits for it
  # to answer only before the first step that needs it.
  postgres:
    name: Postgres migrations and store
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL_UNPOOLED: postgresql://luke:luke@localhost:5432/luke
      LUKE_STORE_TEST_DATABASE_URL: postgresql://luke:luke@localhost:5432/luke
    steps:
      - name: Start Postgres
        run: |
          for round in 1 2 3 4; do
            for image in \
              public.ecr.aws/docker/library/postgres:luke-fallback-probe-missing \
              mirror.gcr.io/library/postgres:18 \
              docker.io/library/postgres:18; do
              if docker pull --quiet "$image"; then
                docker run --detach --name postgres \
                  --env POSTGRES_USER=luke \
                  --env POSTGRES_PASSWORD=luke \
                  --env POSTGRES_DB=luke \
                  --publish 5432:5432 \
                  --health-cmd "pg_isready -U luke" \
                  --health-interval 5s \
                  --health-timeout 5s \
                  --health-retries 12 \
                  "$image"
                exit 0
              fi
              echo "::warning::Could not pull $image (round $round)"
            done
            if [ "$round" -lt 4 ]; then sleep $((round * 15)); fi
          done
          echo "::error::Every registry refused postgres:18"
          exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      - name: Wait for Postgres
        run: |
          for _ in $(seq 90); do
            status=$(docker inspect --format '{{.State.Health.Status}}' postgres)
            if [ "$status" = healthy ]; then exit 0; fi
            if [ "$status" = unhealthy ]; then break; fi
            sleep 1
          done
          docker logs postgres
          echo "::error::Postgres did not become healthy"
          exit 1
      - run: pnpm --filter @luke/web db:migrate
      - run: pnpm --filter @luke/web test:store
      # The eve end-to-end eval writes through the real writer, so it runs where a Postgres stands.
      - run: pnpm --filter @luke/web test:agent
        env:
          DATABASE_URL: postgresql://luke:luke@localhost:5432/luke
