name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI is Linux only: the packaged macOS app is proven by the release workflow
# before anything ships. Every job below bar `CI`, which only reads the
# others' results, is independent and runs at once, so a run takes as long as
# its longest job: the tests, which are the bulk of `check.sh`, are spread
# across runners rather than run behind the lint and typecheck.
#
# The TypeScript checks and the tests run through Turborepo (`turbo.json`),
# which replays a task whose inputs it has already seen pass. Its cache is
# Vercel's Remote Cache, given the TURBO_TOKEN and TURBO_TEAM secrets and
# shared with every machine that runs the checks, so a re-run or a push that
# leaves a workspace alone replays that workspace's tasks. Note that no
# `.turbo/cache` is kept between runs: an actions/cache entry per commit only
# repeated what the Remote Cache serves. A fork's pull request gets no
# secrets, so turbo says "Remote caching disabled" and runs every task.
# `scripts/turbo.mjs` hands the token to turbo on its command line, so no task
# sees it in its environment and no cached log can carry it.
jobs:
  portable:
    name: TypeScript checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      - run: ./scripts/check.sh --without test
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

  # One job per slice of the tests, so a run takes about as long as its slowest
  # slice rather than two large suites back to back. Each of the four largest
  # suites, and @repo/database's, runs in jobs of its own, the longest of them
  # cut into vitest shards with `-- --shard=<i>/<n>`, which turbo hashes, so
  # each shard is cached on its own; a shard count is set here alone and is
  # sized to keep a slice near two minutes when it misses the cache. The last
  # job runs every other workspace's tests, one workspace at a time
  # (`scripts/check.mjs` says why), bar the ones it leaves out with
  # `--filter=!`. `scripts/repository-checks.sh` fails unless every workspace
  # with tests runs in exactly one of these jobs, or in every shard of one
  # set, so no test file can fall outside every job or run twice.
  tests:
    name: Tests (${{ matrix.slice }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - slice: panel 1/6
            task: test:vitest --filter=@repo/panel -- --shard=1/6
          - slice: panel 2/6
            task: test:vitest --filter=@repo/panel -- --shard=2/6
          - slice: panel 3/6
            task: test:vitest --filter=@repo/panel -- --shard=3/6
          - slice: panel 4/6
            task: test:vitest --filter=@repo/panel -- --shard=4/6
          - slice: panel 5/6
            task: test:vitest --filter=@repo/panel -- --shard=5/6
          - slice: panel 6/6
            task: test:vitest --filter=@repo/panel -- --shard=6/6
          - slice: service 1/4
            task: test:vitest --filter=@repo/service -- --shard=1/4
          - slice: service 2/4
            task: test:vitest --filter=@repo/service -- --shard=2/4
          - slice: service 3/4
            task: test:vitest --filter=@repo/service -- --shard=3/4
          - slice: service 4/4
            task: test:vitest --filter=@repo/service -- --shard=4/4
          - slice: web 1/2
            task: test:vitest --filter=@repo/web -- --shard=1/2
          - slice: web 2/2
            task: test:vitest --filter=@repo/web -- --shard=2/2
          - slice: ui
            task: test:vitest --filter=@repo/ui
          - slice: database
            task: test:vitest --filter=@repo/database
          - slice: the rest
            task: test:vitest --filter=!@repo/panel --filter=!@repo/service --filter=!@repo/web --filter=!@repo/ui --filter=!@repo/database
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      # Note that the flag comes before the task, because a shard's task ends
      # in `--`, past which turbo hands every word to vitest.
      - run: node scripts/turbo.mjs run --concurrency=1 ${{ matrix.task }}
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

  # What only a real Postgres can prove, and nothing more: the generated
  # migrations apply on the major production runs (Neon, 18.x), so a statement
  # PGlite accepts and Postgres refuses is caught before a deployment's
  # `db:migrate` finds it, and they end at the declared schema, its tables
  # (`apps/web/tests/storage-schema.test.ts`) and its columns
  # (`drizzle-schema.test.ts`), read back through the real `pg` driver from
  # what `db:migrate` built (`@repo/database/testing` clones it as a template). The store tests
  # themselves run on PGlite, the same Postgres 18, in the test jobs above, but
  # for the database package's `*.postgres.test.ts`, two connections contending
  # for one lock, which PGlite's one connection cannot hold apart: its
  # `vitest.config.ts` leaves them out wherever no URL names a Postgres, so
  # they run here alone.
  # The image comes from whichever of three registries answers first, because each one
  # rate-limits anonymous pulls.
  postgres:
    name: Postgres migrations and store
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL_UNPOOLED: postgresql://vespin:vespin@localhost:5432/vespin
      APP_STORE_TEST_DATABASE_URL: postgresql://vespin:vespin@localhost:5432/vespin
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      - name: Start Postgres
        run: |
          for round in 1 2 3 4; do
            for image in \
              public.ecr.aws/docker/library/postgres:18 \
              mirror.gcr.io/library/postgres:18 \
              docker.io/library/postgres:18; do
              if docker pull --quiet "$image"; then
                docker run --detach --name postgres \
                  --env POSTGRES_USER=vespin \
                  --env POSTGRES_PASSWORD=vespin \
                  --env POSTGRES_DB=vespin \
                  --publish 5432:5432 \
                  --health-cmd "pg_isready -U vespin" \
                  --health-interval 5s \
                  --health-timeout 5s \
                  --health-retries 12 \
                  "$image"
                exit 0
              fi
              echo "::warning::Could not pull $image (round $round)"
            done
            if [ "$round" -lt 4 ]; then sleep $((round * 15)); fi
          done
          echo "::error::Every registry refused postgres:18"
          exit 1
      - name: Wait for Postgres
        run: |
          for _ in $(seq 90); do
            status=$(docker inspect --format '{{.State.Health.Status}}' postgres)
            if [ "$status" = healthy ]; then exit 0; fi
            if [ "$status" = unhealthy ]; then break; fi
            sleep 1
          done
          docker logs postgres
          echo "::error::Postgres did not become healthy"
          exit 1
      - run: pnpm --filter @repo/web db:migrate
      - name: The migrations end at the declared schema
        run: pnpm exec vitest run apps/web/tests/storage-schema.test.ts apps/web/tests/drizzle-schema.test.ts
      - name: The store's lock and claim tests on a real Postgres
        run: pnpm exec vitest run --project database .postgres.test.ts

  # The image every cloud agent's sandbox boots from (`apps/web/agent-image/`),
  # pushed to the project's Vercel Container Registry as Vercel's guide does
  # it (https://vercel.com/docs/container-registry/github-actions), under the
  # tag its staged build context digests to, which the web build names too
  # (`apps/web/scripts/agent-image.ts`). A pull request's run pushes the one
  # its Preview names, and the merge queue's the one `main` deploys, so no
  # deploy names an image not yet pushed. A tag already pushed is not built
  # again, and the job ends only once Vercel has prepared the image for
  # Sandbox, which a sandbox cannot boot before. It signs in with GitHub's
  # OIDC token, which the team's VCR policy trusts, so no secret is kept.
  agent-image:
    name: Agent image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      - name: Stage the build context
        id: stage
        run: |
          pnpm --filter @repo/agent-runner build
          tag=$(pnpm --silent --filter @repo/web agent-image "$RUNNER_TEMP/agent-image" | tail -n 1)
          echo "image=vcr.vercel.com/$TEAM/$PROJECT/agent-image:$tag" >> "$GITHUB_OUTPUT"
        env:
          TEAM: ${{ vars.VERCEL_TEAM_SLUG }}
          PROJECT: ${{ vars.VERCEL_PROJECT_SLUG }}
      - name: Log in to VCR
        uses: vercel/vcr-action/login@6888f841cb0d2255ef9dab40f068cba07234ef47 # v1
        with:
          team: ${{ vars.VERCEL_TEAM_ID }}
      - name: Look for the image
        id: pushed
        run: |
          if docker buildx imagetools inspect "$IMAGE" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          IMAGE: ${{ steps.stage.outputs.image }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.pushed.outputs.found != 'true'
      - name: Build and push
        if: steps.pushed.outputs.found != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ runner.temp }}/agent-image
          platforms: linux/amd64
          provenance: false
          tags: ${{ steps.stage.outputs.image }}
          outputs: type=image,push=true,oci-mediatypes=true,compression=zstd,compression-level=3,force-compression=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Wait for Vercel to prepare it
        uses: vercel/vcr-action/wait-for-optimized-image@6888f841cb0d2255ef9dab40f068cba07234ef47 # v1
        with:
          image: ${{ steps.stage.outputs.image }}
          timeout-seconds: 1800

  # The one check the ruleset requires, so a job or slice added above is
  # required without a ruleset edit. It passes only where every job it needs
  # succeeded. Note that it runs whatever became of them, because a job skipped
  # behind a failed `needs` reports skipped, and a skipped required check
  # counts as passed.
  ci:
    name: CI
    if: ${{ always() }}
    needs: [portable, tests, postgres, agent-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: for result in $RESULTS; do test "$result" = success; done
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
