name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: TypeScript checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      - run: ./scripts/check.sh

  # The store tests run on PGlite inside the portable job above; this job is
  # the one place the generated migrations and the same tests meet a real
  # Postgres, so a statement PGlite accepts and Postgres refuses is caught
  # before a deployment's `db:migrate` finds it.
  postgres:
    name: Postgres migrations and store
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: luke
          POSTGRES_PASSWORD: luke
          POSTGRES_DB: luke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U luke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL_UNPOOLED: postgresql://luke:luke@localhost:5432/luke
      LUKE_STORE_TEST_DATABASE_URL: postgresql://luke:luke@localhost:5432/luke
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      - run: pnpm --filter @luke/web db:migrate
      - run: pnpm --filter @luke/web test:store

  # Packages the app and captures the fixture frames. The portable job above is
  # the one place the full check runs: repeating it on a macOS runner costs
  # minutes and reports nothing the Linux run did not.
  macos:
    name: macOS app and evidence
    runs-on: macos-15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "16.2"
      - run: ./scripts/evidence.sh
      - name: Preserve visual evidence
        id: visual-evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: app-visual-evidence-${{ github.event.pull_request.number || github.run_id }}
          path: artifacts/evidence/
          if-no-files-found: error
          retention-days: 90
      - name: Link evidence from the pull request description
        if: >-
          always() &&
          !cancelled() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.visual-evidence.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.visual-evidence.outputs.artifact-url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/update-pr-evidence.mjs
