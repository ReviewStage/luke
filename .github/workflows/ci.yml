name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core-checks:
    name: Platform-independent checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2
        with:
          swift-version: "6.0.3"
      - run: ./scripts/bootstrap.sh
      - run: ./scripts/check.sh

  macos:
    name: macOS app and evidence
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "16.2"
      - run: ./scripts/bootstrap.sh
      - run: ./scripts/test-macos.sh
      - run: ./scripts/evidence.sh
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: macos-test-results
          path: artifacts/test-results/App.xcresult
          if-no-files-found: warn
      - name: Preserve visual evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: app-visual-evidence
          path: artifacts/evidence/app-development.png
          if-no-files-found: error
