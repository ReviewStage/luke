name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI is Linux only: the packaged macOS app is proven where it is built, by
# `./scripts/verify.sh` at the developer's hand before a UI change is opened
# and by the release workflow before anything ships. Every job below is
# independent and runs at once, so a run takes as long as its longest job:
# the tests, which are the bulk of `check.sh`, are sharded across runners
# rather than run behind the lint and typecheck.
jobs:
  portable:
    name: TypeScript checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      - run: ./scripts/check.sh --without test

  tests:
    name: Tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      - run: pnpm exec vitest run --shard=${{ matrix.shard }}/4

  # The generated migrations meet a real Postgres here, the major production
  # runs (Neon, 18.x), so a statement PGlite accepts and Postgres refuses is
  # caught before a deployment's `db:migrate` finds it. The job keeps its old
  # name because the ruleset requires it. The image comes from whichever of
  # three registries answers first, because each one rate-limits anonymous
  # pulls; it starts before the checkout so it boots while the workspace
  # installs.
  postgres:
    name: Postgres migrations and store
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL_UNPOOLED: postgresql://luke:luke@localhost:5432/luke
    steps:
      - name: Start Postgres
        run: |
          for round in 1 2 3 4; do
            for image in \
              public.ecr.aws/docker/library/postgres:18 \
              mirror.gcr.io/library/postgres:18 \
              docker.io/library/postgres:18; do
              if docker pull --quiet "$image"; then
                docker run --detach --name postgres \
                  --env POSTGRES_USER=luke \
                  --env POSTGRES_PASSWORD=luke \
                  --env POSTGRES_DB=luke \
                  --publish 5432:5432 \
                  --health-cmd "pg_isready -U luke" \
                  --health-interval 5s \
                  --health-timeout 5s \
                  --health-retries 12 \
                  "$image"
                exit 0
              fi
              echo "::warning::Could not pull $image (round $round)"
            done
            if [ "$round" -lt 4 ]; then sleep $((round * 15)); fi
          done
          echo "::error::Every registry refused postgres:18"
          exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      - name: Wait for Postgres
        run: |
          for _ in $(seq 90); do
            status=$(docker inspect --format '{{.State.Health.Status}}' postgres)
            if [ "$status" = healthy ]; then exit 0; fi
            if [ "$status" = unhealthy ]; then break; fi
            sleep 1
          done
          docker logs postgres
          echo "::error::Postgres did not become healthy"
          exit 1
      - run: pnpm --filter @luke/web db:migrate
