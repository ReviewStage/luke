name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI is Linux only: the packaged macOS app is proven by the release workflow
# before anything ships. Every job below is independent and runs at once, so a
# run takes as long as its longest job: the tests, which are the bulk of
# `check.sh`, are spread across runners rather than run behind the lint and
# typecheck.
#
# The TypeScript checks and the tests run through Turborepo (`turbo.json`),
# which replays a task whose inputs it has already seen pass. Its cache is
# Vercel's Remote Cache, given the TURBO_TOKEN and TURBO_TEAM secrets and
# shared with every machine that runs the checks, so a re-run or a push that
# leaves a workspace alone replays that workspace's tasks. Note that no
# `.turbo/cache` is kept between runs: an actions/cache entry per commit only
# repeated what the Remote Cache serves. A fork's pull request gets no
# secrets, so turbo says "Remote caching disabled" and runs every task.
# `scripts/turbo.mjs` hands the token to turbo on its command line, so no task
# sees it in its environment and no cached log can carry it.
jobs:
  portable:
    name: TypeScript checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      - run: ./scripts/check.sh --without test
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

  # The four jobs keep the names the ruleset requires. @luke/service's and
  # @luke/panel's suites are the largest, so each is cut into three vitest
  # shards, one per job, and the fourth job runs every other workspace's
  # tests, one workspace at a time (`scripts/check.mjs` says why), bar the
  # ones it leaves out with `--filter=!`, which `database-tests` below runs on
  # a runner of its own so the fourth job is not the run's longest. Every
  # workspace with tests runs under exactly one of these jobs or
  # `scripts/repository-checks.sh` fails, so no test file can fall outside
  # every job.
  tests:
    name: Tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            task: test:vitest:1
          - shard: 2
            task: test:vitest:2
          - shard: 3
            task: test:vitest:3
          - shard: 4
            task: test:vitest --filter=!@luke/database
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      - run: node scripts/turbo.mjs run ${{ matrix.task }} --concurrency=1
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

  # @luke/database's suite, the longest after @luke/web's, on a runner of its
  # own beside the fourth job rather than after it in that job.
  database-tests:
    name: Tests (database)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      - run: node scripts/turbo.mjs run test:vitest --filter=@luke/database
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

  # What only a real Postgres can prove, and nothing more: the generated
  # migrations apply on the major production runs (Neon, 18.x), so a statement
  # PGlite accepts and Postgres refuses is caught before a deployment's
  # `db:migrate` finds it, and they end at the declared schema
  # (`apps/web/tests/storage-schema.test.ts`, run against what `db:migrate`
  # built; `@luke/database/testing` clones it as a template). The store tests
  # themselves run on PGlite, the same Postgres 18, in the test jobs above.
  # The job keeps its old name because the ruleset requires it. The image
  # comes from whichever of three registries answers first, because each one
  # rate-limits anonymous pulls.
  postgres:
    name: Postgres migrations and store
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL_UNPOOLED: postgresql://luke:luke@localhost:5432/luke
      LUKE_STORE_TEST_DATABASE_URL: postgresql://luke:luke@localhost:5432/luke
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      - name: Start Postgres
        run: |
          for round in 1 2 3 4; do
            for image in \
              public.ecr.aws/docker/library/postgres:18 \
              mirror.gcr.io/library/postgres:18 \
              docker.io/library/postgres:18; do
              if docker pull --quiet "$image"; then
                docker run --detach --name postgres \
                  --env POSTGRES_USER=luke \
                  --env POSTGRES_PASSWORD=luke \
                  --env POSTGRES_DB=luke \
                  --publish 5432:5432 \
                  --health-cmd "pg_isready -U luke" \
                  --health-interval 5s \
                  --health-timeout 5s \
                  --health-retries 12 \
                  "$image"
                exit 0
              fi
              echo "::warning::Could not pull $image (round $round)"
            done
            if [ "$round" -lt 4 ]; then sleep $((round * 15)); fi
          done
          echo "::error::Every registry refused postgres:18"
          exit 1
      - name: Wait for Postgres
        run: |
          for _ in $(seq 90); do
            status=$(docker inspect --format '{{.State.Health.Status}}' postgres)
            if [ "$status" = healthy ]; then exit 0; fi
            if [ "$status" = unhealthy ]; then break; fi
            sleep 1
          done
          docker logs postgres
          echo "::error::Postgres did not become healthy"
          exit 1
      - run: pnpm --filter @luke/web db:migrate
      - name: The migrations end at the declared schema
        run: pnpm exec vitest run apps/web/tests/storage-schema.test.ts
