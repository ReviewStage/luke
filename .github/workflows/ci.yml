name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI is Linux only: the packaged macOS app is proven where it is built, by
# `./scripts/verify.sh` at the developer's hand before a UI change is opened
# and by the release workflow before anything ships. Every job below is
# independent and runs at once, so a run takes as long as its longest job:
# the tests, which are the bulk of `check.sh`, are sharded across runners
# rather than run behind the lint and typecheck.
jobs:
  portable:
    name: TypeScript checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      - run: ./scripts/check.sh --without test

  tests:
    name: Tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      # The harness tests are one small `node --test` pass, so one shard owns them.
      - if: ${{ matrix.shard == 1 }}
        run: pnpm test:harness
      - run: pnpm exec vitest run --shard=${{ matrix.shard }}/4

  # The store tests run on PGlite inside the test shards above; this job is
  # the one place the generated migrations and the same tests meet a real
  # Postgres, so a statement PGlite accepts and Postgres refuses is caught
  # before a deployment's `db:migrate` finds it. The image is the major
  # production runs (Neon, 18.x), which is also the major PGlite embeds; a
  # test that fails here fails about the database the service actually runs.
  postgres:
    name: Postgres migrations and store
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: luke
          POSTGRES_PASSWORD: luke
          POSTGRES_DB: luke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U luke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL_UNPOOLED: postgresql://luke:luke@localhost:5432/luke
      LUKE_STORE_TEST_DATABASE_URL: postgresql://luke:luke@localhost:5432/luke
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      - run: pnpm --filter @luke/web db:migrate
      - run: pnpm --filter @luke/web test:store
      # The eve end-to-end eval writes through the real writer, so it runs where a Postgres stands.
      - run: pnpm --filter @luke/web test:agent
        env:
          DATABASE_URL: postgresql://luke:luke@localhost:5432/luke
          PROVIDER_KEY_ENCRYPTION_SECRET: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
