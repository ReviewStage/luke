name: Classify a release-only change
description: >-
  Whether the change CI is checking touches nothing but the changelog, its
  screenshots, and package versions (scripts/release-only.mjs). A pull request
  is measured from its merge commit's first parent, so the checkout must fetch
  two commits deep; a merge group from the base the queue built it on.

outputs:
  release-only:
    description: "true when the change is release-only, false otherwise"
    value: ${{ steps.classify.outputs.release_only }}

runs:
  using: composite
  steps:
    - id: classify
      shell: bash
      env:
        MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
      run: |
        base=HEAD^1
        if [[ -n "$MERGE_GROUP_BASE" ]]; then
          # A base that cannot be fetched is classified as not release-only.
          git fetch --quiet --no-tags --depth=1 origin "$MERGE_GROUP_BASE" || true
          base=$MERGE_GROUP_BASE
        fi
        node scripts/release-only.mjs "$base" HEAD | tee -a "$GITHUB_OUTPUT"
