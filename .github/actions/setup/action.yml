name: Set up the Luke workspace
description: Pin pnpm and Node from .nvmrc, then install the locked dependencies.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
    # Note that a failed restore of the pnpm store holds the step for the
    # cache library's segment timeout, 10 minutes by default, because its
    # timer is cleared only when a segment arrives. On 2026-10-30 GitHub
    # refused restores as "Egress is over the account limit" for four hours,
    # and 334 jobs each sat 600 s on that timer before installing from the
    # registry in 16 s. A healthy restore of the whole store takes about 9 s,
    # so a minute per 128 MB segment leaves it ample room, and a restore the
    # minute does cut short only installs from the registry instead.
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version-file: .nvmrc
        cache: pnpm
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"
    - run: ./scripts/bootstrap.sh
      shell: bash
