<script type="module">
// Unpacks the payload: the stylesheet, the file-icon bundle, then the page's own script.
const packed = document.getElementById("show-payload").textContent.replace(/\s+/g, "");
const bytes = Uint8Array.from(atob(packed), (character) => character.charCodeAt(0));
const unzipped = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
const { css, fileTree, app } = JSON.parse(await new Response(unzipped).text());
const style = document.createElement("style");
style.textContent = css;
document.head.append(style);
const tree = document.createElement("script");
tree.textContent = fileTree;
document.body.append(tree);
const page = document.createElement("script");
page.type = "module";
page.textContent = app;
document.body.append(page);
</script>
