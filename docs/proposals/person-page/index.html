<script type="module">
const payload = JSON.parse(document.getElementById("show-payload").textContent);
const unzip = async (b64) => {
  const bytes = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  return new Response(stream).arrayBuffer();
};
const blob = async (b64, type) => URL.createObjectURL(new Blob([await unzip(b64)], { type }));
document.getElementById("root").innerHTML = new TextDecoder().decode(await unzip(payload.page));
const [js, light, dark] = await Promise.all([
  blob(payload.js, "text/javascript"), blob(payload.light, "text/css"), blob(payload.dark, "text/css"),
]);
const css = { light, dark };
const tag = (name, attributes, inner) => "<" + name + attributes + ">" + inner + "</" + name + ">";
const srcdoc = (d, id) => "<!doctype html>" + tag("html", " data-theme=" + d.theme, tag("head", "", "<meta charset=utf-8><link rel=stylesheet href=" + css[d.theme] + ">" + tag("script", "", "window.SHOW=" + JSON.stringify({ surface: d.surface, version: d.version, theme: d.theme, id }))) + tag("body", "", tag("div", " id=root", "") + tag("script", " src=" + js, "")));
const load = (frame) => { frame.srcdoc = srcdoc(frame.dataset, frame.id); };

// Every frame keeps its desktop size and is drawn scaled to the room its figure has: a
// box reserves the scaled size, and a press on it opens the frame at full size to pan and pinch.
const frames = [...document.querySelectorAll("iframe[data-surface]")];
let n = 0;
for (const frame of frames) {
  frame.id = "f" + n++;
  frame.dataset.width = String(parseInt(frame.style.width, 10));
  frame.dataset.height = String(parseInt(frame.style.height, 10));
  const figure = frame.closest("figure");
  frame.title = figure?.querySelector("figcaption")?.textContent ?? "A frame of the show";
  const box = document.createElement("button");
  box.type = "button";
  box.className = "frame-box";
  box.setAttribute("aria-label", "Open full size: " + frame.title);
  frame.replaceWith(box);
  box.append(frame);
  box.addEventListener("click", () => openZoom(frame));
}
const scaleFrame = (frame) => {
  const box = frame.parentElement;
  const width = Number(frame.dataset.width), height = Number(frame.dataset.height);
  const room = box.closest(".frames")?.clientWidth ?? document.documentElement.clientWidth;
  const scale = Math.min(1, room / (width + 2));
  frame.style.width = width + "px";
  frame.style.height = height + "px";
  frame.style.transform = scale < 1 ? "scale(" + scale + ")" : "";
  box.style.width = Math.floor((width + 2) * scale) + "px";
  box.style.height = Math.ceil((height + 2) * scale) + "px";
  box.dataset.scaled = String(scale < 1);
  const caption = box.closest("figure")?.querySelector("figcaption");
  if (caption) caption.style.maxWidth = scale < 1 ? box.style.width : "";
};
const fitAll = () => frames.forEach(scaleFrame);
new ResizeObserver(fitAll).observe(document.documentElement);

// The full-size view: the frame at its own size in a layer that scrolls both ways, over the page.
const zoom = document.createElement("div");
zoom.className = "zoom";
zoom.hidden = true;
zoom.innerHTML = '<div class="zoom-bar"><span class="zoom-title"></span><button type="button" class="zoom-size" aria-pressed="true">Fit width</button><button type="button" class="zoom-close">Close</button></div><div class="zoom-scroll"><div class="zoom-stage"><div class="zoom-box"><iframe title="Full size frame"></iframe></div><div class="zoom-cover"></div></div></div>';
document.body.append(zoom);
const zoomFrame = zoom.querySelector("iframe");
const zoomSize = zoom.querySelector(".zoom-size");
let fitted = true;
// Fitted, the frame is scaled to the screen's width as on the page but larger; at actual size it pans both ways. Pinch works on either.
const fitZoom = () => {
  const width = parseInt(zoomFrame.style.width, 10), height = parseInt(zoomFrame.style.height, 10);
  const room = zoom.querySelector(".zoom-scroll").clientWidth - 24;
  const scale = fitted ? Math.min(1, room / (width + 2)) : 1;
  zoomFrame.style.transform = scale < 1 ? "scale(" + scale + ")" : "";
  const box = zoom.querySelector(".zoom-box");
  box.style.width = Math.floor((width + 2) * scale) + "px";
  box.style.height = Math.ceil((height + 2) * scale) + "px";
  zoomSize.textContent = fitted ? "Actual size" : "Fit width";
};
zoomSize.addEventListener("click", () => { fitted = !fitted; fitZoom(); });
const openZoom = (frame) => {
  zoom.querySelector(".zoom-title").textContent = frame.title;
  zoomFrame.dataset.of = frame.id;
  zoomFrame.style.width = frame.dataset.width + "px";
  zoomFrame.style.height = frame.dataset.height + "px";
  zoomFrame.srcdoc = srcdoc(frame.dataset, "zoom");
  zoom.hidden = false;
  document.body.style.overflow = "hidden";
  fitted = true;
  fitZoom();
};
const closeZoom = () => { zoom.hidden = true; zoomFrame.srcdoc = ""; document.body.style.overflow = ""; };
zoom.querySelector(".zoom-close").addEventListener("click", closeZoom);
window.addEventListener("keydown", (event) => { if (event.key === "Escape" && !zoom.hidden) closeZoom(); });

window.addEventListener("message", (event) => {
  const { id, height } = event.data ?? {};
  if (typeof height !== "number" || height <= 0) return;
  if (id === "zoom") { zoomFrame.style.height = height + "px"; fitZoom(); return; }
  const frame = id && document.getElementById(id);
  if (!frame || Number(frame.dataset.height) === height) return;
  frame.dataset.height = String(height);
  scaleFrame(frame);
});
// The theme every frame draws in, chosen at the page's head; a change redraws the frames already drawn.
const themed = (theme) => {
  document.documentElement.dataset.theme = theme;
  for (const button of document.querySelectorAll("[data-pick-theme]")) button.setAttribute("aria-pressed", String(button.dataset.pickTheme === theme));
  for (const frame of frames) {
    if (frame.dataset.fixed !== undefined) continue;
    frame.dataset.theme = theme;
    if (frame.srcdoc) load(frame);
  }
};
for (const button of document.querySelectorAll("[data-pick-theme]")) button.addEventListener("click", () => themed(button.dataset.pickTheme));
themed(matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
fitAll();
const seen = new IntersectionObserver((entries) => {
  for (const entry of entries) if (entry.isIntersecting) { seen.unobserve(entry.target); load(entry.target.querySelector("iframe")); }
}, { rootMargin: "800px" });
for (const frame of frames) seen.observe(frame.parentElement);
</script>
