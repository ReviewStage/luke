.frame { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: var(--chip); }

.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.pair img { width: 100%; border: 1px solid var(--line); border-radius: 10px; }
.note { padding: 10px 14px; border-left: 3px solid var(--accent); background: var(--chip); border-radius: 0 8px 8px 0; max-width: 860px; }
table { border-collapse: collapse; margin: 8px 0; }
td, th { padding: 6px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }

<script>
(async () => {
  const bytes = Uint8Array.from(atob(document.getElementById("show-payload").textContent.trim()), (c) => c.charCodeAt(0));
  const text = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  const data = JSON.parse(text);
  let theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  let current = location.hash.slice(1) || data.pages[0].id;
  const themed = (css) => css
    .replaceAll("prefers-color-scheme:light", theme === "light" ? "min-width:0px" : "max-width:0px")
    .replaceAll("prefers-color-scheme:dark", theme === "dark" ? "min-width:0px" : "max-width:0px");
  const docOf = (key, group) => {
    const html = data.screens[key];
    const style = "<style>" + themed(data.css[group]) + "</style>";
    return html.includes("</head>") ? html.replace("</head>", style + "</head>") : style + html;
  };
  const frames = [];
  const fit = () => frames.forEach(({ box, frame, width, height }) => {
    const scale = box.clientWidth / width;
    frame.style.transform = "scale(" + scale + ")";
    box.style.height = height * scale + "px";
  });
  const render = () => {
    document.documentElement.dataset.theme = theme;
    document.querySelectorAll("button.theme").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.theme === theme)));
    const tabs = document.getElementById("tabs");
    tabs.replaceChildren(...data.pages.map((page) => {
      const b = document.createElement("button");
      b.className = "tab"; b.textContent = page.title;
      if (page.id === current) b.setAttribute("aria-current", "page");
      b.onclick = () => { current = page.id; location.hash = page.id; render(); scrollTo(0, 0); };
      return b;
    }));
    const page = data.pages.find((p) => p.id === current) || data.pages[0];
    const main = document.getElementById("page");
    main.innerHTML = "";
    frames.length = 0;
    for (const block of page.blocks) {
      if (block.html) { const div = document.createElement("div"); div.innerHTML = block.html; main.append(...div.childNodes); continue; }
      if (block.pair) {
        const div = document.createElement("div"); div.className = "pair";
        for (const [name, alt] of block.pair) { const img = document.createElement("img"); img.src = data.images[name]; img.alt = alt; div.append(img); }
        main.append(div); continue;
      }
      const fig = document.createElement("figure");
      const box = document.createElement("div"); box.className = "frame";
      const frame = document.createElement("iframe");
      const width = 1440, height = block.height || 900;
      frame.width = width; frame.height = height; frame.title = block.caption;
      frame.srcdoc = docOf(block.screen, block.group);
      box.append(frame); fig.append(box);
      const cap = document.createElement("figcaption"); cap.innerHTML = block.caption; fig.append(cap);
      main.append(fig);
      frames.push({ box, frame, width, height });
    }
    fit();
  };
  document.querySelectorAll("button.theme").forEach((b) => b.onclick = () => { theme = b.dataset.theme; render(); });
  addEventListener("resize", fit);
  render();
})();
</script>
