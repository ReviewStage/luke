<!doctype html>
<!-- Factory as a campus of buildings: a design exploration, not a feature. One self-contained page that fetches nothing; every task, agent, and pull request on it is illustrative. Open it in a browser. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luke · Factory as a campus (design exploration)</title>
<style>
/* Tokens, copied from the renderer's base.css, desktop.css, and the generated
   motion tokens so the mockup wears the app's own ground, ink, and timing. */
:root {
  color-scheme: dark;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
  font-synthesis: none;
  -webkit-font-smoothing: antialiased;
  --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  --spring: linear(0, 0.0285, 0.0993, 0.1943, 0.3005, 0.4083, 0.5115, 0.6061, 0.69, 0.7623, 0.8229, 0.8727, 0.9125, 0.9437, 0.9674, 0.9848, 0.9972, 1.0056, 1.0109, 1.0138, 1.015, 1.015, 1.0142, 1.0129, 1.0114, 1.0098, 1);
  --duration-fast: 280ms;
  --motion-exit: cubic-bezier(0.4, 0, 0.6, 1);
  --duration-shape: 460ms;
  --duration-exit: 90ms;
  --duration-quick: 140ms;
  --duration-hover: 70ms;
  --duration-pane: 240ms;
  --motion-pane: cubic-bezier(0.2, 0, 0, 1);
  --row-stagger: 32ms;
  --loop-motion: running;

  --space-2: 2px; --space-4: 4px; --space-6: 6px; --space-8: 8px; --space-12: 12px;
  --space-16: 16px; --space-20: 20px; --space-24: 24px; --space-32: 32px; --space-40: 40px;
  --column-inset: var(--space-12);
  --row-inset: var(--space-8);
  --content-inset: calc(var(--column-inset) + var(--row-inset));
  --glyph-gap: var(--space-8);
  --control-gap: var(--space-8);
  --list-gap: var(--space-2);
  --section-gap: var(--space-16);
  --control-height: 30px;
  --control-radius: 8px;
  --control-glyph: 15px;
  --menu-inset: var(--space-4);
  --menu-row-height: 32px;
  --menu-row-radius: 6px;
  --menu-radius: calc(var(--menu-row-radius) + var(--menu-inset));
  --sidebar-width: 264px;
  --desktop-bar-height: 51px;
  --focus-ring-width: 2px;
  --focus-ring-offset: 1px;
}

/* Dark, the default; data-theme on <html> takes a choice from the page's own switch. */
:root, :root[data-theme="dark"] {
  color-scheme: dark;
  --state-working: #5cd5ff;
  --state-attention: #ffa049;
  --state-complete: #6fdca4;
  --state-merged: #c3a0ff;
  --voice-developer: #7fe0ac;
  --message-sent: #0071e3;
  --danger: #ff7e7e;
  --text-primary: rgba(255, 255, 255, 0.95);
  --text-secondary: rgba(255, 255, 255, 0.56);
  --text-tertiary: rgba(255, 255, 255, 0.5);
  --text-body: rgba(255, 255, 255, 0.86);
  --raised: rgba(255, 255, 255, 0.05);
  --raised-strong: rgba(255, 255, 255, 0.09);
  --selected: rgba(255, 255, 255, 0.2);
  --pressed: rgba(255, 255, 255, 0.26);
  --hairline: rgba(255, 255, 255, 0.08);
  --hairline-strong: rgba(255, 255, 255, 0.12);
  --on-accent: #fff;
  --shadow: rgba(0, 0, 0, 0.5);
  --shadow-deep: rgba(0, 0, 0, 0.6);
  --section-fill: rgba(255, 255, 255, 0.022);
  --desktop-ground: #0c0c0e;
  --desktop-sidebar: #111114;
  --desktop-well: #0f0f12;
  --sidebar-ink: rgba(255, 255, 255, 0.7);
  --surface-popover: #111114;
  --attention-mark-ground: #c4620c;
  --workspace-hue-1: #4f63b8;
  --actor-tile: #2a2a30;
  --focus-ring: var(--message-sent);
  --page-ground: #050506;
  --page-ink: rgba(255, 255, 255, 0.6);
  --stage-sky: radial-gradient(120% 90% at 50% 30%, #15161c 0%, #0c0c0e 70%);
  --label-ground: rgba(17, 17, 20, 0.92);
}

:root[data-theme="light"] {
  color-scheme: light;
  --state-working: #0a72a8;
  --state-attention: #a65400;
  --state-complete: #18794e;
  --state-merged: #8250df;
  --voice-developer: #17784a;
  --danger: #e0383e;
  --text-primary: rgba(0, 0, 0, 0.88);
  --text-secondary: rgba(0, 0, 0, 0.6);
  --text-tertiary: rgba(0, 0, 0, 0.56);
  --text-body: rgba(0, 0, 0, 0.8);
  --raised: rgba(0, 0, 0, 0.035);
  --raised-strong: rgba(0, 0, 0, 0.06);
  --selected: rgba(0, 0, 0, 0.07);
  --pressed: rgba(0, 0, 0, 0.11);
  --hairline: rgba(0, 0, 0, 0.08);
  --hairline-strong: rgba(0, 0, 0, 0.1);
  --shadow: rgba(0, 0, 0, 0.12);
  --shadow-deep: rgba(0, 0, 0, 0.2);
  --section-fill: #fff;
  --desktop-ground: #fcfcfc;
  --desktop-sidebar: #f3f3f4;
  --desktop-well: #f8f8f9;
  --sidebar-ink: rgba(0, 0, 0, 0.68);
  --surface-popover: #fff;
  --attention-mark-ground: #a65400;
  --workspace-hue-1: #4a5fc0;
  --actor-tile: #e8e8ec;
  --page-ground: #e4e4e8;
  --page-ink: rgba(0, 0, 0, 0.6);
  --stage-sky: radial-gradient(120% 90% at 50% 30%, #ffffff 0%, #f4f4f6 70%);
  --label-ground: rgba(255, 255, 255, 0.94);
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --loop-motion: paused;
    --duration-fast: 0ms; --duration-shape: 0ms; --duration-exit: 0ms;
    --duration-quick: 0ms; --duration-hover: 0ms; --duration-pane: 0ms; --row-stagger: 0ms;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  display: flex;
  flex-direction: column;
  background: var(--page-ground);
  color: var(--text-primary);
  font-size: 13px;
  overflow: hidden;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: default; }
svg.glyph { width: 15px; height: 15px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
:focus { outline: none; }
:focus-visible { outline: var(--focus-ring-width) solid var(--focus-ring); outline-offset: var(--focus-ring-offset); }

/* The page around the mockup: what this is, and the appearance switch. */
.show-head {
  display: flex;
  align-items: center;
  gap: var(--space-16);
  padding: var(--space-12) var(--space-24);
  color: var(--page-ink);
  font-size: 12px;
}
.show-head strong { color: var(--text-primary); font-weight: 600; font-size: 13px; }
.show-chip {
  padding: var(--space-2) var(--space-8);
  border: 1px solid var(--hairline-strong);
  border-radius: 999px;
  color: var(--text-secondary);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.02em;
}
.show-chip[data-tone="illustrative"] { color: var(--state-attention); border-color: currentColor; }
.show-head .spacer { flex: 1; }
.segmented {
  display: inline-flex;
  margin: 0;
  border: 0;
  padding: var(--space-2);
  border-radius: var(--control-radius);
  background: var(--raised-strong);
}
.segmented button {
  height: 24px;
  padding: 0 var(--space-12);
  border-radius: 6px;
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 600;
}
.segmented button[aria-pressed="true"] { background: var(--desktop-ground); color: var(--text-primary); box-shadow: 0 1px 2px var(--shadow); }

/* The window. */
.window-wrap { flex: 1; min-height: 0; display: flex; padding: 0 var(--space-24) var(--space-24); }
.window {
  position: relative;
  flex: 1;
  min-width: 0;
  display: grid;
  grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
  border: 1px solid var(--hairline-strong);
  border-radius: 12px;
  overflow: clip;
  background: var(--desktop-ground);
  box-shadow: 0 24px 64px var(--shadow-deep);
}
.traffic { position: absolute; top: 18px; left: 18px; display: flex; gap: 8px; z-index: 5; }
.traffic i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; }
.traffic i:nth-child(2) { background: #febc2e; }
.traffic i:nth-child(3) { background: #28c840; }

/* Sidebar, drawn as desktop-sidebar.tsx draws it. */
.sidebar {
  display: flex;
  min-height: 0;
  flex-direction: column;
  padding: 0 var(--column-inset) var(--column-inset);
  border-right: 1px solid var(--hairline);
  background: var(--desktop-sidebar);
}
.sidebar-top { height: var(--desktop-bar-height); display: flex; align-items: center; justify-content: flex-end; gap: var(--space-2); }
.sidebar-top .icon-button { color: var(--text-tertiary); }
.switcher {
  display: flex; align-items: center; gap: var(--glyph-gap);
  height: 36px; padding: 0 var(--row-inset); margin-bottom: var(--space-8);
  border-radius: 9px; font-size: 14px; font-weight: 650; letter-spacing: -0.01em;
}
.switcher:hover { background: var(--raised); }
.workspace-tile {
  display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 4px;
  background: var(--workspace-hue-1); color: #fff; font-size: 10px; font-weight: 650;
}
.switcher .chev { margin-left: auto; color: var(--text-tertiary); }
.side-row {
  display: flex; align-items: center; gap: var(--glyph-gap);
  height: var(--control-height); margin: 0 0 var(--list-gap); padding: 0 var(--row-inset);
  border-radius: 9px; color: var(--sidebar-ink); font-size: 13px; text-align: left; width: 100%;
  transition: background-color var(--duration-hover) ease, color var(--duration-hover) ease;
}
.side-row:hover { color: var(--text-primary); }
.side-row[aria-current="page"] { background: var(--raised-strong); color: var(--text-primary); }
.side-row .end { margin-left: auto; color: var(--text-tertiary); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.kbd { display: inline-flex; gap: 1px; color: var(--text-tertiary); font-size: 11.5px; }
.sidebar-rule { height: 1px; margin: var(--space-8) var(--row-inset); border: 0; background: var(--hairline); }
.section-head {
  display: flex; align-items: center; height: 28px; padding: 0 var(--row-inset);
  color: var(--text-tertiary); font-size: 11.5px; font-weight: 600;
}
.task-row {
  display: flex; align-items: center; gap: var(--glyph-gap);
  width: 100%; min-height: var(--control-height); padding: var(--space-6) var(--row-inset);
  border-radius: 9px; color: var(--sidebar-ink); text-align: left; font-size: 13px;
}
.task-row:hover { color: var(--text-primary); background: var(--raised); }
.task-row[aria-current="true"] { background: var(--raised-strong); color: var(--text-primary); }
.task-row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; background: var(--tone, var(--text-tertiary)); }
.dot[data-pulse] { box-shadow: 0 0 0 3px color-mix(in srgb, var(--tone) 25%, transparent); }
.sidebar-scroll { flex: 1; min-height: 0; overflow: auto; margin: 0 calc(-1 * var(--space-4)); padding: 0 var(--space-4); }
.sidebar-foot { padding-top: var(--space-8); border-top: 1px solid var(--hairline); }

/* The work column: a toolbar over the campus, and the inspector pane beside it. */
.main { display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; min-height: 0; }
.toolbar {
  display: flex; align-items: center; gap: var(--control-gap);
  min-height: var(--desktop-bar-height); padding: var(--space-8) var(--content-inset);
  border-bottom: 1px solid var(--hairline);
}
.toolbar-title { display: flex; align-items: center; gap: var(--glyph-gap); font-size: 13px; font-weight: 600; }
.toolbar-title .sub { color: var(--text-tertiary); font-weight: 500; }
.toolbar .spacer { flex: 1; }
.toolbar-button, .icon-button, .primary-button {
  --button-fill: transparent;
  display: inline-flex; align-items: center; justify-content: center; gap: var(--glyph-gap);
  height: var(--control-height); padding: 0 var(--space-12);
  border-radius: var(--control-radius); background: var(--button-fill);
  font-size: 12.5px; font-weight: 600; white-space: nowrap;
  transition: background-color var(--duration-hover) ease, color var(--duration-hover) ease, filter var(--duration-hover) ease;
}
.icon-button { width: var(--control-height); padding: 0; color: var(--text-secondary); }
.toolbar-button:hover, .icon-button:hover, .toolbar-button[aria-pressed="true"], .icon-button[aria-pressed="true"] { background: var(--selected); color: var(--text-primary); }
.toolbar-button:active, .icon-button:active { background: var(--pressed); }
.primary-button { --button-fill: var(--message-sent); color: var(--on-accent); }
.primary-button:hover { filter: brightness(1.1); }
.toolbar-button[data-tone="attention"] { color: var(--state-attention); }
.attention-mark {
  display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%;
  background: var(--attention-mark-ground); color: #fff; font-size: 11px; font-weight: 800; line-height: 1;
}

.work { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; min-height: 0; }
.stage {
  position: relative; min-width: 0; min-height: 0; overflow: clip;
  background: var(--stage-sky);
  touch-action: none;
}
.stage svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage[data-dragging] { cursor: grabbing; }
#camera { transform-origin: 0 0; transition: transform var(--duration-shape) var(--spring); }
.stage[data-dragging] #camera, #camera[data-instant] { transition: none; }

/* Buildings. */
.bldg { cursor: pointer; transition: opacity var(--duration-fast) ease; }
.bldg .lift { transition: transform var(--duration-hover) ease; }
.bldg:hover .lift, .bldg:focus-visible .lift { transform: translateY(-3px); }
.bldg:focus-visible { outline: none; } /* no ring: the plot's outline draws the keyboard's ring (.plot[data-focus]) */
.scene[data-focused] .bldg:not([data-open]) { opacity: 0.42; }
.bldg .shell, .bldg .upper, .bldg .cut, .bldg .fx { transition: opacity var(--duration-fast) ease, transform var(--duration-shape) var(--spring); }
.bldg .cut { opacity: 0; pointer-events: none; }
.bldg[data-open] .shell { opacity: 0; }
.bldg[data-open] .upper { opacity: 0; transform: translateY(-48px); }
.bldg[data-open] .fx-roof { opacity: 0; }
.bldg[data-open] .cut { opacity: 1; }
.plot { transition: opacity var(--duration-hover) ease; }
.plot-edge { fill: none; stroke: var(--text-primary); stroke-width: 1.4; opacity: 0; transition: opacity var(--duration-hover) ease; vector-effect: non-scaling-stroke; }
.plot[data-hover] .plot-edge { opacity: 0.35; }
.plot[data-open] .plot-edge { opacity: 0.5; }
.plot[data-focus] .plot-edge { opacity: 1; stroke: var(--focus-ring); stroke-width: 2; }
.new-plot { cursor: pointer; }
.new-plot .plot-dash { fill: none; stroke: var(--text-tertiary); stroke-width: 1.2; stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; }
.new-plot:hover .plot-dash, .new-plot:focus-visible .plot-dash { stroke: var(--text-primary); }
.new-plot:focus-visible { outline: none; } /* no ring: the dashed edge brightens and thickens */
.new-plot:focus-visible .plot-dash { stroke: var(--focus-ring); stroke-width: 2; }

.win-lit { filter: url(#glow); }
:root[data-theme="light"] .win-lit { filter: none; }

/* Loops: each answers --loop-motion, so reduced motion holds them still. */
.loop { animation-play-state: var(--loop-motion); transform-box: fill-box; transform-origin: center; }
.smoke { animation: smoke 4.8s linear infinite; }
@keyframes smoke {
  0% { transform: translate(0, 0) scale(0.5); opacity: 0; }
  12% { opacity: 0.75; }
  100% { transform: translate(-22px, -64px) scale(2.1); opacity: 0; }
}
.beacon-ring { animation: beacon 1.6s ease-out infinite; transform-origin: center; }
@keyframes beacon {
  0% { transform: scale(0.4); opacity: 0.9; }
  100% { transform: scale(2.6); opacity: 0; }
}
.beacon-core { animation: blink 1.6s ease-in-out infinite; }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
.wave { animation: wave 2.4s ease-out infinite; }
@keyframes wave {
  0% { transform: scale(0.3); opacity: 0; }
  15% { opacity: 0.9; }
  100% { transform: scale(1.8); opacity: 0; }
}
.flag { animation: flag 2.2s ease-in-out infinite; transform-origin: left center; }
@keyframes flag { 0%, 100% { transform: skewY(0deg) scaleX(1); } 50% { transform: skewY(-6deg) scaleX(0.92); } }
.flag-raise { animation: raise var(--duration-shape) var(--spring) backwards; }
@keyframes raise { from { transform: translateY(18px); opacity: 0; } }
.bubble { animation: bob 2.8s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
.screen { animation: screen 3.2s steps(4) infinite; }
@keyframes screen { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

/* Labels float over the campus at a constant size. */
.tag { pointer-events: none; transition: opacity var(--duration-quick) ease; }
.tag rect.ground { fill: var(--label-ground); stroke: var(--hairline-strong); }
.tag text { font-size: 11.5px; font-weight: 600; fill: var(--text-primary); }
.tag text.meta { font-size: 10.5px; font-weight: 500; fill: var(--text-secondary); }
.tag[data-dim] { opacity: 0.35; }
.agent-tag text { font-size: 7px; font-weight: 600; fill: var(--text-primary); }
.agent-tag rect { fill: var(--label-ground); stroke: var(--hairline-strong); }

/* What floats over the stage: the map's controls, the key, and a passing notice. */
.map-controls {
  position: absolute; right: var(--space-16); bottom: var(--space-16);
  display: flex; flex-direction: column; gap: var(--space-2);
  padding: var(--space-4); border: 1px solid var(--hairline-strong); border-radius: var(--menu-radius);
  background: var(--surface-popover); box-shadow: 0 12px 32px var(--shadow);
}
.map-controls hr { width: 100%; height: 1px; margin: var(--space-2) 0; border: 0; background: var(--hairline); }
.key {
  position: absolute; left: var(--space-16); bottom: var(--space-16); width: 236px;
  padding: var(--space-8) var(--space-4) var(--space-4);
  border: 1px solid var(--hairline-strong); border-radius: var(--menu-radius);
  background: var(--surface-popover); box-shadow: 0 12px 32px var(--shadow);
  transition: opacity var(--duration-quick) ease, transform var(--duration-shape) var(--spring);
}
.key[data-hidden] { opacity: 0; transform: translateY(8px); pointer-events: none; }
.key-head { display: flex; align-items: center; justify-content: space-between; padding: 0 var(--space-4) var(--space-4) var(--space-8); color: var(--text-tertiary); font-size: 11.5px; font-weight: 600; }
.key-head .icon-button { width: 24px; height: 24px; }
.key-row { display: flex; align-items: center; gap: var(--glyph-gap); height: 28px; padding: 0 var(--space-8); color: var(--text-secondary); font-size: 12px; }
.key-row svg { width: 22px; height: 18px; flex: 0 0 auto; overflow: visible; }
.toast {
  position: absolute; left: 50%; bottom: var(--space-24);
  display: flex; align-items: center; gap: var(--glyph-gap);
  padding: var(--space-8) var(--space-12); border: 1px solid var(--hairline-strong); border-radius: 10px;
  background: var(--surface-popover); box-shadow: 0 12px 32px var(--shadow); font-size: 12.5px; font-weight: 600;
  transform: translateX(-50%); transition: opacity var(--duration-quick) ease, transform var(--duration-shape) var(--spring);
}
.toast[data-hidden] { opacity: 0; transform: translate(-50%, 8px); pointer-events: none; }

/* The inspector: a pane beside the campus, the side panel's well and edge. */
.inspector {
  width: 0; overflow: clip; border-left: 0 solid var(--hairline); background: var(--desktop-well);
  display: flex; flex-direction: column; min-height: 0;
}
.inspector[data-open] { width: 360px; border-left-width: 1px; }
.inspector-body { width: 360px; flex: 1; min-height: 0; overflow: auto; padding: 0 0 var(--space-24); }
.inspector-body > * { animation: arrive var(--duration-shape) var(--spring) backwards; animation-delay: calc(var(--i, 0) * var(--row-stagger)); }
@keyframes arrive { from { opacity: 0; transform: translateY(6px); } }
.insp-head { display: flex; align-items: flex-start; gap: var(--space-12); padding: var(--space-16) var(--space-12) var(--space-12) var(--content-inset); }
.insp-head .titles { flex: 1; min-width: 0; }
.insp-title { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; line-height: 1.3; }
.insp-path { margin-top: var(--space-2); color: var(--text-tertiary); font-family: var(--font-mono); font-size: 11.5px; }
.insp-state {
  display: flex; align-items: center; gap: var(--glyph-gap);
  margin: 0 var(--column-inset) var(--space-12); padding: var(--space-8) var(--row-inset);
  border-radius: 9px; background: color-mix(in srgb, var(--tone) 12%, transparent); color: var(--tone);
  font-size: 12.5px; font-weight: 650;
}
.insp-state .when { margin-left: auto; color: var(--text-tertiary); font-weight: 500; font-variant-numeric: tabular-nums; }
.insp-section { padding: var(--space-8) var(--content-inset) var(--space-4); color: var(--text-tertiary); font-size: 11.5px; font-weight: 600; }
.card {
  margin: 0 var(--column-inset) var(--space-12); padding: var(--space-12);
  border: 1px solid var(--hairline-strong); border-radius: 12px; background: var(--section-fill);
}
.card p { margin: 0 0 var(--space-12); color: var(--text-body); font-size: 13px; line-height: 1.45; }
.card .who { display: flex; align-items: center; gap: var(--space-6); margin-bottom: var(--space-8); color: var(--text-secondary); font-size: 12px; font-weight: 600; }
.choices { display: flex; flex-wrap: wrap; gap: var(--space-6); }
.choice {
  height: 28px; padding: 0 var(--space-12); border: 1px solid var(--hairline-strong); border-radius: 999px;
  font-size: 12.5px; font-weight: 600; transition: background-color var(--duration-hover) ease;
}
.choice:hover { background: var(--selected); }
.row {
  display: flex; align-items: center; gap: var(--glyph-gap);
  min-height: 34px; margin: 0 var(--column-inset); padding: var(--space-4) var(--row-inset);
  border-radius: 9px; font-size: 13px;
}
.row:hover { background: var(--raised); }
.row .meta { margin-left: auto; color: var(--text-tertiary); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row .sub { color: var(--text-secondary); font-size: 12px; }
.row .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.actor {
  display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; flex: 0 0 auto;
  background: var(--actor-tile);
}
.actor svg { width: 14px; height: 14px; }
.actor[data-person] { border-radius: 50%; background: var(--workspace-hue-1); color: #fff; font-size: 10px; font-weight: 650; }
.log { margin: 0 var(--column-inset) var(--space-12); padding: var(--space-8) 0; }
.log-line { display: flex; gap: var(--space-8); padding: var(--space-4) var(--row-inset); color: var(--text-secondary); font-size: 12px; line-height: 1.4; }
.log-line time { flex: 0 0 38px; color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
.log-line code { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-body); }
.log-line[data-new] { animation: arrive var(--duration-shape) var(--spring) backwards; }
.insp-actions { display: flex; gap: var(--control-gap); padding: var(--space-4) var(--content-inset) var(--space-12); }
.check-row { display: flex; align-items: center; gap: var(--space-6); color: var(--state-complete); font-size: 12px; font-weight: 600; }
.diffstat { font-family: var(--font-mono); font-size: 11.5px; }
.diffstat .add { color: var(--state-complete); }
.diffstat .del { color: var(--danger); }
.plan-line { margin: 0 0 var(--space-8); color: var(--text-body); font-size: 13px; line-height: 1.45; }
.plan-line b { display: block; color: var(--text-secondary); font-size: 11.5px; font-weight: 600; }
.caret { display: inline-block; width: 2px; height: 1em; vertical-align: -2px; background: var(--state-working); animation: blink 1s steps(2) infinite; animation-play-state: var(--loop-motion); }
.meter { display: inline-flex; align-items: center; gap: 2px; height: 14px; }
.meter i { width: 2px; height: 4px; border-radius: 1px; background: var(--voice-developer); animation: meter 0.9s ease-in-out infinite; animation-play-state: var(--loop-motion); }
.meter i:nth-child(2) { animation-delay: 0.15s; } .meter i:nth-child(3) { animation-delay: 0.3s; } .meter i:nth-child(4) { animation-delay: 0.45s; }
@keyframes meter { 0%, 100% { height: 4px; } 50% { height: 13px; } }
.toolbar-button[hidden] { display: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<header class="show-head">
  <strong>Factory · campus of buildings</strong>
  <span class="show-chip">Design exploration</span>
  <span class="show-chip" data-tone="illustrative">Illustrative data · nothing is live</span>
  <span>Every task is a building. Click one to look inside; answer or merge to watch the campus change.</span>
  <span class="spacer"></span>
  <span>Appearance</span>
  <fieldset class="segmented">
    <legend class="sr-only">Appearance</legend>
    <button type="button" data-theme-choice="dark">Night</button>
    <button type="button" data-theme-choice="light">Day</button>
  </fieldset>
</header>

<div class="window-wrap">
<div class="window" id="window">
  <div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div>

  <aside class="sidebar" aria-label="Sidebar">
    <div class="sidebar-top">
      <button type="button" class="icon-button" aria-label="Back" data-g="chevron-left"></button>
      <button type="button" class="icon-button" aria-label="Forward" data-g="chevron-right"></button>
    </div>
    <button type="button" class="switcher"><span class="workspace-tile">R</span>ReviewStage<span class="chev" data-g="chevrons"></span></button>
    <button type="button" class="side-row" data-g-lead="square-pen">New task<span class="end kbd">⌘N</span></button>
    <button type="button" class="side-row" data-g-lead="search">Search<span class="end kbd">⌘K</span></button>
    <button type="button" class="side-row" data-g-lead="house">Home</button>
    <button type="button" class="side-row" data-g-lead="inbox">Inbox<span class="end" id="inbox-count">2</span></button>
    <button type="button" class="side-row" data-g-lead="factory" aria-current="page">Factory</button>
    <button type="button" class="side-row" data-g-lead="zap">Automations</button>
    <hr class="sidebar-rule">
    <div class="sidebar-scroll">
      <div class="section-head">Tasks</div>
      <nav id="task-list" aria-label="Tasks"></nav>
    </div>
    <div class="sidebar-foot">
      <button type="button" class="side-row" data-g-lead="settings">Settings</button>
    </div>
  </aside>

  <section class="main" aria-label="Factory">
    <div class="toolbar">
      <div class="toolbar-title"><span data-g="factory"></span>Factory <span class="sub" id="census"></span></div>
      <span class="show-chip" data-tone="illustrative" title="Every task, agent, and pull request here is made up">Illustrative</span>
      <span class="spacer"></span>
      <button type="button" class="toolbar-button" id="needs-you" data-tone="attention"></button>
    </div>
    <div class="work">
      <div class="stage" id="stage">
        <svg class="scene" id="scene">
          <title>Campus</title>
          <defs>
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="2.2" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
            <radialGradient id="pool"><stop offset="0" stop-color="#ffd9a0" stop-opacity="0.32"/><stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/></radialGradient>
          </defs>
          <g id="camera">
            <g id="layer-ground"></g>
            <g id="layer-plots"></g>
            <g id="layer-shadows"></g>
            <g id="layer-vehicles"></g>
            <g id="layer-objects"></g>
            <g id="layer-tags"></g>
          </g>
        </svg>
        <section class="key" id="key" aria-label="Key">
          <div class="key-head">How to read it<button type="button" class="icon-button" id="key-close" aria-label="Hide key" data-g="x"></button></div>
          <div id="key-rows"></div>
        </section>
        <div class="map-controls" role="toolbar" aria-label="Campus view">
          <button type="button" class="icon-button" id="zoom-in" aria-label="Zoom in" data-g="plus"></button>
          <button type="button" class="icon-button" id="zoom-out" aria-label="Zoom out" data-g="minus"></button>
          <hr>
          <button type="button" class="icon-button" id="rotate" aria-label="Turn the campus" data-g="rotate-cw"></button>
          <button type="button" class="icon-button" id="fit" aria-label="Show the whole campus" data-g="scan"></button>
          <button type="button" class="icon-button" id="key-toggle" aria-label="Key" aria-pressed="true" data-g="circle-help"></button>
        </div>
        <div class="toast" id="toast" role="status" aria-live="polite" data-hidden></div>
      </div>
      <aside class="inspector" id="inspector" aria-label="Building">
        <div class="inspector-body" id="inspector-body"></div>
      </aside>
    </div>
  </section>
</div>
</div>

<script>
"use strict";
/* ------------------------------------------------------------------------

   ------------------------------------------------------------------------ */
const GLYPH = {

  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',

  factory: '<path d="M2 20a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8l-7 5V8l-7 5V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M17 18h1"/><path d="M12 18h1"/><path d="M7 18h1"/>',
  zap: '<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>',
  settings: '<path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/>',
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',

  scan: '<path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/>',
  "circle-help": '<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  question: '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>',
  pr: '<circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><line x1="6" x2="6" y1="9" y2="21"/>',
  merge: '<circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M6 21V9a9 9 0 0 0 9 9"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  mic: '<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/>',
  blocks: '<rect width="7" height="7" x="14" y="3" rx="1"/><path d="M10 21V8a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5a1 1 0 0 0-1-1H3"/>',
  open: '<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
};
const glyph = (name) => `<svg class="glyph" viewBox="0 0 24 24" aria-hidden="true">${GLYPH[name] || ""}</svg>`;
/* An agent's harness mark: Claude's burst, drawn simply, in its own clay. */
const claudeMark = () => {
  let rays = "";
  for (let i = 0; i < 8; i++) {
    const a = (i * Math.PI) / 4;
    rays += `<line x1="12" y1="12" x2="${(12 + Math.cos(a) * 9).toFixed(2)}" y2="${(12 + Math.sin(a) * 9).toFixed(2)}"/>`;
  }
  return `<svg viewBox="0 0 24 24" aria-hidden="true" stroke="#d97757" stroke-width="3.2" stroke-linecap="round">${rays}</svg>`;
};
for (const el of document.querySelectorAll("[data-g]")) el.insertAdjacentHTML("afterbegin", glyph(el.dataset.g));
for (const el of document.querySelectorAll("[data-g-lead]")) el.insertAdjacentHTML("afterbegin", glyph(el.dataset.gLead));

/* ------------------------------------------------------------------------
   The illustrative work. Nothing here is read from anywhere.
   ------------------------------------------------------------------------ */
const STATE = {
  call: { label: "On a call", tone: "--voice-developer" },
  question: { label: "Needs an answer", tone: "--state-attention" },
  working: { label: "Working", tone: "--state-working" },
  ready: { label: "Ready to merge", tone: "--state-complete" },
  merged: { label: "Merged", tone: "--state-merged" },
};
const WORK = [
  { id: "factory-view", name: "Add another Factory view", state: "call", who: "You and Luke", branch: "plan", when: "14 min" },
  { id: "invite", name: "Invite your teammates", state: "question", agent: "Opus", effort: "high", branch: "luke/invite-teammates", when: "4 min" },
  { id: "search", name: "Improve search ranking", state: "working", agent: "Sonnet", effort: "medium", branch: "luke/search-ranking", when: "22 min" },
  { id: "shortcuts", name: "Keyboard shortcuts", state: "working", agent: "Opus", effort: "high", branch: "luke/keyboard-shortcuts", when: "9 min" },
  { id: "reconnect", name: "Fix reconnect handling", state: "ready", agent: "Opus", effort: "high", branch: "luke/reconnect-handling", pr: 3081, when: "checks passed" },
  { id: "switching", name: "Faster workspace switching", state: "merged", agent: "Sonnet", branch: "luke/workspace-switching", pr: 3071, when: "2h ago" },
  { id: "empty", name: "Polish empty states", state: "merged", agent: "Opus", branch: "luke/empty-states", pr: 3068, when: "yesterday" },
];
const byId = Object.fromEntries(WORK.map((w) => [w.id, w]));
const LOGS = {
  invite: [["4m", "Asked: <b>should an invite link expire?</b>"], ["6m", "Wrote <code>invite-dialog.tsx</code>"], ["9m", "Read <code>memberships.ts</code>"], ["12m", "Started on the plan"]],
  search: [["now", "Running <code>vitest run search</code>"], ["1m", "Edited <code>rank.ts</code>"], ["3m", "Edited <code>query-terms.ts</code>"], ["7m", "Read <code>search-index.ts</code>"]],
  shortcuts: [["now", "Editing <code>app-shortcuts.ts</code>"], ["2m", "Added <code>shortcut-sheet.tsx</code>"], ["5m", "Read <code>menu-bar.ts</code>"]],
  reconnect: [["8m", "All 14 checks passed"], ["15m", "Opened <b>#3081</b>"], ["21m", "Backoff now resets on a clean close"]],
  switching: [["2h", "Merged <b>#3071</b>"], ["3h", "Checks passed"]],
  empty: [["1d", "Merged <b>#3068</b>"], ["1d", "Checks passed"]],
};
const TICKER = {
  search: ["Edited <code>rank.ts</code>", "Running <code>vitest run search</code>", "Edited <code>score-weights.ts</code>", "Read <code>fixtures/queries.json</code>", "12 of 12 search tests passed"],
  shortcuts: ["Editing <code>app-shortcuts.ts</code>", "Edited <code>settings-shortcuts.tsx</code>", "Running <code>pnpm check:affected</code>", "Read <code>keyboard-modality.ts</code>"],
};

/* ------------------------------------------------------------------------
   The campus: world coordinates in tiles, N by N, roads at 9 to 11.
   x runs down to the right on screen, y down to the left, z up.
   ------------------------------------------------------------------------ */
const N = 20;
const DX = 22, DY = 11, DZ = 25;
let rot = 0;
const near = (a, b) => Math.abs(a - b) < 1e-6;
function R(x, y) {
  switch (rot) {
    case 1: return [N - y, x];
    case 2: return [N - x, N - y];
    case 3: return [y, N - x];
    default: return [x, y];
  }
}
const P = (x, y, z) => [(x - y) * DX, (x + y) * DY - z * DZ];
const PR = (x, y, z) => { const [a, b] = R(x, y); return P(a, b, z); };
const pts = (list) => list.map((p) => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
const poly = (list, fill, extra = "") => `<polygon points="${pts(list)}" fill="${fill}" ${extra}/>`;

/* Materials and light, per appearance: night is the dark window, day the light one. */
let theme = "dark";
const PALETTE = {
  dark: {
    slab: "#18191e", slabSide: "#101115", grass: "#141a17", road: "#1f2026", line: "rgba(255,255,255,0.16)",
    pad: "#1d1e24", curb: "#26272e", wall: "#3a3c46", wall2: "#45403c", glass: "#1f2a36", roof: "#2c2e36",
    metal: "#4b4e5a", dock: "#30323a", floor: "#2a2b33", inner: "#24252c", unlit: "#16171c",
    tree: "#1f3a2d", tree2: "#2a4a39", trunk: "#3a2f28", shadow: "rgba(0,0,0,0.42)", smoke: "#8a8d99",
    lamp: "#ffd9a0", deskTop: "#4a4c57", crate: "#5a4a36", truck: "#d9dbe3", cab: "#4f63b8",
  },
  light: {
    slab: "#e7e8ec", slabSide: "#cfd0d6", grass: "#dfe7df", road: "#d3d4da", line: "rgba(255,255,255,0.9)",
    pad: "#f1f1f4", curb: "#dcdde2", wall: "#f7f7f9", wall2: "#efe7df", glass: "#bfd3e6", roof: "#e3e4ea",
    metal: "#c4c7d0", dock: "#d7d8de", floor: "#ececf0", inner: "#dedfe5", unlit: "#c8d2df",
    tree: "#8fb89a", tree2: "#a8cbb0", trunk: "#9b8572", shadow: "rgba(30,30,60,0.16)", smoke: "#c9ccd4",
    lamp: "#ffd9a0", deskTop: "#d0d2da", crate: "#c9a77a", truck: "#ffffff", cab: "#4a5fc0",
  },
};
const C = () => PALETTE[theme];
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
/* Light from behind the right shoulder: tops brightest, the right faces next, the left faces darkest. */
const L = (() => { const v = [0.38, -0.32, 0.87]; const m = Math.hypot(...v); return v.map((c) => c / m); })();
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function shade(hex, normal) {
  const d = Math.max(0, normal[0] * L[0] + normal[1] * L[1] + normal[2] * L[2]);
  const f = (theme === "dark" ? 0.62 : 0.8) + (theme === "dark" ? 0.5 : 0.22) * d;
  const [r, g, b] = hexToRgb(hex);
  const c = (v) => Math.max(0, Math.min(255, Math.round(v * f)));
  return `rgb(${c(r)},${c(g)},${c(b)})`;
}
const TOP = [0, 0, 1], FX = [1, 0, 0], FY = [0, 1, 0];

/* A box in world tiles, with its top's corners at their own heights so a slope
   or a gable is a box too. Turned with the campus, its corners keep their heights. */
function turnBox(b) {
  const hs = b.hs || [b.h, b.h, b.h, b.h];
  const c = [[b.x, b.y, hs[0]], [b.x + b.w, b.y, hs[1]], [b.x + b.w, b.y + b.d, hs[2]], [b.x, b.y + b.d, hs[3]]]
    .map(([x, y, h]) => { const [a, bb] = R(x, y); return [a, bb, h]; });
  const xs = c.map((q) => q[0]), ys = c.map((q) => q[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const H = (x, y) => c.find((q) => near(q[0], x) && near(q[1], y))[2];
  return { x0, x1, y0, y1, z: b.z || 0, h00: H(x0, y0), h10: H(x1, y0), h11: H(x1, y1), h01: H(x0, y1) };
}
function normalOf(a, b, c) {
  const u = [b[0] - a[0], b[1] - a[1], b[2] - a[2]], v = [c[0] - a[0], c[1] - a[1], c[2] - a[2]];
  const n = [u[1] * v[2] - u[2] * v[1], u[2] * v[0] - u[0] * v[2], u[0] * v[1] - u[1] * v[0]];
  const m = Math.hypot(...n) || 1;
  return n.map((q) => q / m);
}
function boxSVG(b, mat, opts = {}) {
  const t = turnBox(b);
  const { x0, x1, y0, y1, z } = t;
  const w3 = [[x0, y0, z + t.h00], [x1, y0, z + t.h10], [x1, y1, z + t.h11], [x0, y1, z + t.h01]];
  const n = normalOf(w3[0], w3[1], w3[3]);
  const top = w3.map((q) => P(...q));
  const fx = [P(x1, y0, z), P(x1, y1, z), P(x1, y1, z + t.h11), P(x1, y0, z + t.h10)];
  const fy = [P(x0, y1, z), P(x1, y1, z), P(x1, y1, z + t.h11), P(x0, y1, z + t.h01)];
  const base = C()[mat] || mat;
  const edge = theme === "dark" ? 'stroke="rgba(255,255,255,0.05)" stroke-width="0.6"' : 'stroke="rgba(0,0,0,0.06)" stroke-width="0.6"';
  let s = "";
  if (!opts.noTop) s += poly(top, opts.topFill || shade(base, n[2] < 0 ? TOP : n), edge);
  s += poly(fx, opts.sideFill || shade(base, FX), edge) + poly(fy, opts.sideFill || shade(base, FY), edge);
  if (opts.win) s += windowsSVG(t, opts.win);
  if (opts.stripe) s += stripeSVG(t, opts.stripe);
  return s;
}
/* Windows on the two faces the viewer sees, lit by what the building is doing. */
function windowsSVG(t, win) {
  const { x0, x1, y0, y1, z } = t;
  const hTop = Math.min(t.h00, t.h10, t.h11, t.h01);
  const rows = win.rows || Math.max(1, Math.floor((hTop - 0.25) / 0.55));
  const per = win.per || 2;
  const lit = win.lit;

function renderShadows() {
  let s = "";

function buildingSVG(w) {

}

/* Name tags: a pill over each roof, the state's dot and the task's name. */

/* ------------------------------------------------------------------------
   Carts on the roads, the crane's swing, and a window or two going on and off.
   ------------------------------------------------------------------------ */
const reduced = matchMedia("(prefers-reduced-motion: reduce)");
const carts = [
  { axis: "x", lane: 9.5, pos: 2, speed: 0.9 },
  { axis: "x", lane: 10.5, pos: 15, speed: -0.7 },
  { axis: "y", lane: 10.5, pos: 4, speed: 0.6 },
];
let departing = null;
function cartSVG(cart) {
  const c = C();
  const [x, y] = cart.axis === "x" ? [cart.pos, cart.lane] : [cart.lane, cart.pos];
  const box = cart.axis === "x" ? { x: x - 0.4, y: y - 0.22, w: 0.8, d: 0.44, z: 0.04, h: 0.32 } : { x: x - 0.22, y: y - 0.4, w: 0.44, d: 0.8, z: 0.04, h: 0.32 };

  return boxSVG(box, "metal") + boxSVG({ ...box, w: box.w * 0.6, d: box.d * 0.6, x: box.x + box.w * 0.2, y: box.y + box.d * 0.2, z: 0.36, h: 0.16 }, "crate");
}
function renderVehicles() {

  $("layer-vehicles").innerHTML = s;
}
let last = performance.now();
let twinkleAt = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!reduced.matches) {
    for (const cart of carts) {
      cart.pos += cart.speed * dt;
      if (cart.pos > N - 0.4) cart.pos = 0.4;
      if (cart.pos < 0.4) cart.pos = N - 0.4;
    }
    if (departing) stepDeparture(dt);
    renderVehicles();
    craneAngle += dt * 0.18;
    const cr = $("crane-shortcuts");
    if (cr) cr.innerHTML = craneSVG(BUILDINGS.shortcuts.crane);
    if (now > twinkleAt) { twinkle(); twinkleAt = now + 900; }
  }
  requestAnimationFrame(frame);
}
function twinkle() {
  for (const w of WORK) {
    if (w.state !== "working" && w.state !== "question") continue;
    const wins = document.querySelectorAll(`.bldg[data-id="${w.id}"] .shell [data-win]`);
    if (!wins.length) continue;
    const el = wins[Math.floor(Math.random() * wins.length)];
    const on = el.classList.contains("win-lit");
    el.classList.toggle("win-lit", !on);
    el.setAttribute("fill", on ? C().unlit : lit(w).color);
    el.setAttribute("opacity", on ? 1 : theme === "dark" ? 0.92 : 0.75);
  }
}

/* The merge's departure: the truck pulls off the dock, down to the avenue, and away. */
function stepDeparture(dt) {
  const d = departing;
  d.t += dt;
  if (d.phase === 0) { d.y += 2.2 * dt; if (d.y > 9.3) { d.phase = 1; d.dir = "x"; d.x = 14.2; d.y = 9.5; } }
  else { d.x += 3.2 * dt; if (d.x > N + 1) { departing = null; finishMerge(d.id); } }

const cam = { x: 0, y: 0, s: 1 };
function sceneBounds() {

  const k = 1 / cam.s;

  const base = Math.min((st.width - 80) / (sceneBounds().x1 - sceneBounds().x0), (st.height - 80) / (sceneBounds().y1 - sceneBounds().y0));
  cam.s = Math.max(base * 1.9, 1.15);

  const ns = Math.max(0.35, Math.min(5, cam.s * f));
  cam.x = ox - ((ox - cam.x) * ns) / cam.s;
  cam.y = oy - ((oy - cam.y) * ns) / cam.s;
  cam.s = ns;
}

/* ------------------------------------------------------------------------
   Opening a building, the inspector, and the two acts it offers.
   ------------------------------------------------------------------------ */
function syncPlotMarks() {
  document.querySelectorAll(".plot").forEach((p) => {
    const id = p.dataset.plot;
    p.toggleAttribute("data-hover", hoverId === id);
    p.toggleAttribute("data-open", openId === id);
    p.toggleAttribute("data-focus", focusId === id);
  });
  for (const g of document.querySelectorAll(".bldg")) g.toggleAttribute("data-open", g.dataset.id === openId);
  for (const t of document.querySelectorAll(".tag")) t.toggleAttribute("data-dim", !!openId && t.dataset.tag !== openId);
  for (const r of document.querySelectorAll(".task-row")) r.setAttribute("aria-current", r.dataset.id === openId ? "true" : "false");
  $("scene").toggleAttribute("data-focused", !!openId);
}
let keyAutoHidden = false;
function open(id) {
  openId = id;
  /* The key makes way the first time a building is opened; its button brings it back. */
  if (!keyAutoHidden) { keyAutoHidden = true; setKey(false); }
  syncPlotMarks();
  const insp = $("inspector");
  const was = insp.hasAttribute("data-open");
  insp.setAttribute("data-open", "");
  renderInspector();
  /* The pane lands at once; the campus flies to the building in the room left. */
  requestAnimationFrame(() => focusOn(id, false));
  if (!was) renderTags();
}
function close() {
  if (!openId) return;
  const id = openId;
  openId = null;
  syncPlotMarks();
  $("inspector").removeAttribute("data-open");
  requestAnimationFrame(() => fitCampus(false));
  const g = document.querySelector(`.bldg[data-id="${id}"]`);
  if (g) g.focus({ preventScroll: true });
}

function actorTile(w) { return `<span class="actor">${claudeMark()}</span>`; }
function renderInspector() {
  const w = byId[openId];
  if (!w) return;
  const st = STATE[w.state];
  let i = 0;
  const n = () => `style="--i:${i++}"`;
  let h = `<div class="insp-head" ${n()}><div class="titles"><div class="insp-title">${w.name}</div><div class="insp-path">ReviewStage/luke · ${w.branch}</div></div>` +
    `<button type="button" class="icon-button" id="insp-close" aria-label="Close">${glyph("x")}</button></div>`;
  const icon = { call: "mic", question: "question", working: "blocks", ready: "pr", shipping: "merge", merged: "merge" }[w.state];
  h += `<div class="insp-state" style="--tone:var(${st.tone});--i:${i++}">${glyph(icon)}${st.label}${w.state === "call" ? '<span class="meter" aria-hidden="true"><i></i><i></i><i></i><i></i></span>' : ""}<span class="when">${w.when}</span></div>`;

  if (w.state === "call") {
    h += `<div class="insp-section" ${n()}>Plan so far</div><div class="card" ${n()}>` +
      `<p class="plan-line"><b>Goal</b>A second Factory view that reads at a glance, like walking a campus.</p>` +
      `<p class="plan-line"><b>Decided</b>Every task is a building; what it is doing shows on the building.</p>` +
      `<p class="plan-line" style="margin:0"><b>Open</b>Campus or factory floor, or both behind one switch <span class="caret"></span></p></div>`;
    h += `<div class="insp-section" ${n()}>Inside</div>` +
      `<div class="row" ${n()}><span class="actor" data-person>D</span><span class="grow">You</span><span class="meta">talking</span></div>` +
      `<div class="row" ${n()}><span class="actor" style="background:var(--raised-strong)">${lukeFace()}</span><span class="grow">Luke</span><span class="meta">writing the plan</span></div>`;
    h += `<div class="insp-actions" ${n()}><button type="button" class="toolbar-button" style="--button-fill:var(--raised-strong)">${glyph("open")}Open plan</button></div>`;
  }
  if (w.state === "question") {
    h += `<div class="card" ${n()}><div class="who">${actorTile(w)}${w.agent} asks</div>` +
      `<p>Should an invite link expire? Members can resend one either way.</p>` +
      `<div class="choices"><button type="button" class="choice" data-answer="After 7 days">After 7 days</button><button type="button" class="choice" data-answer="After 30 days">After 30 days</button><button type="button" class="choice" data-answer="Never">Never</button></div></div>`;
  }
  if (w.state === "ready") {
    h += `<div class="card" ${n()}><div class="who">${glyph("pr")}<span>#${w.pr} · ${w.name}</span></div>` +
      `<div class="check-row">${glyph("check")}14 of 14 checks passed</div>` +
      `<div class="diffstat" style="margin-top:var(--space-8)"><span class="add">+84</span> <span class="del">−31</span> <span style="color:var(--text-tertiary)">in 5 files</span></div></div>` +
      `<div class="insp-actions" ${n()}><button type="button" class="primary-button" id="merge">${glyph("merge")}Merge</button><button type="button" class="toolbar-button" style="--button-fill:var(--raised-strong)">${glyph("open")}Open pull request</button></div>`;
  }
  if (w.state === "merged") {
    h += `<div class="card" ${n()}><div class="who">${glyph("merge")}<span>#${w.pr} · merged ${w.when}</span></div>` +
      `<div class="diffstat"><span class="add">+${w.id === "empty" ? 156 : 302}</span> <span class="del">−${w.id === "empty" ? 47 : 118}</span> <span style="color:var(--text-tertiary)">in ${w.id === "empty" ? 9 : 12} files</span></div></div>`;
  }
  if (w.agent) {
    h += `<div class="insp-section" ${n()}>Inside</div>` +
      `<div class="row" ${n()}>${actorTile(w)}<span class="grow">${w.agent}${w.effort ? ` <span class="sub">· ${w.effort}</span>` : ""}</span><span class="meta" style="color:var(${st.tone})">${w.state === "merged" ? "done" : st.label.toLowerCase()}</span></div>`;
    h += `<div class="insp-section" ${n()}>Activity</div><div class="log" id="log" ${n()}>` +
      (LOGS[w.id] || []).map(([t, line]) => `<div class="log-line"><time>${t}</time><span>${line}</span></div>`).join("") + `</div>`;
    if (w.state === "working" || w.state === "question") {
      h += `<div class="insp-actions" ${n()}><button type="button" class="toolbar-button" style="--button-fill:var(--raised-strong)">${glyph("open")}Open task</button></div>`;
    }
  }
  $("inspector-body").innerHTML = h;
}
function lukeFace() {
  return `<svg viewBox="53.85 56.72 134.29 134.29" aria-hidden="true"><g transform="rotate(-8 120 124)"><path d="M 104 84 V 150 Q 104 164 118 164 Q 140 164 168 142" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round"/><circle cx="78" cy="92" r="12" fill="currentColor"/><circle cx="162" cy="92" r="12" fill="currentColor"/></g></svg>`;
}

let toastTimer = 0;
function toast(html) {
  const t = $("toast");
  t.innerHTML = html;
  t.removeAttribute("data-hidden");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.setAttribute("data-hidden", ""), 2600);
}
function answer(choice) {
  const w = byId.invite;
  w.state = "working";
  w.when = "now";
  LOGS.invite.unshift(["now", `You answered: <b>${choice}</b>`]);
  TICKER.invite = ["Edited <code>invite-links.ts</code>", "Running <code>vitest run invites</code>", "Edited <code>invite-dialog.tsx</code>"];
  toast(`${glyph("check")}Sent to Opus: “${choice}”`);
  refreshAll();
}
function merge() {
  const w = byId.reconnect;
  if (w.state !== "ready") return;
  w.state = "shipping";
  STATE.shipping = { label: "Merging", tone: "--state-complete" };
  departing = { id: "reconnect", x: 14.6, y: 5.75, dir: "y", phase: 0, t: 0 };
  refreshAll();
  if (reduced.matches) { departing = null; finishMerge("reconnect"); }
}
function finishMerge(id) {
  const w = byId[id];
  w.state = "merged";
  w.pr = 3081;
  w.when = "just now";
  LOGS.reconnect.unshift(["now", "Merged <b>#3081</b>"]);
  BUILDINGS.reconnect.fx = () => [{ kind: "flag", at: [17.8, 2.2, 1.64], raise: true }];
  toast(`${glyph("merge")}Merged #3081`);
  refreshAll();
}
function refreshAll() {
  renderAll();
  renderSidebar();
  renderCensus();
  if (openId) renderInspector();
  applyCamera(true);
}

/* ------------------------------------------------------------------------
   The sidebar's tasks and the toolbar's census, from the same work.
   ------------------------------------------------------------------------ */
function renderSidebar() {
  $("task-list").innerHTML = WORK.map((w) => {
    const st = STATE[w.state] || STATE.ready;
    const pulse = w.state === "question" || w.state === "ready" ? "data-pulse" : "";
    return `<button type="button" class="task-row" data-id="${w.id}" aria-current="${openId === w.id}"><span class="dot" ${pulse} style="--tone:var(${st.tone})"></span><span class="name">${w.name}</span></button>`;
  }).join("");
}
function needs() { return WORK.filter((w) => w.state === "question" || w.state === "ready"); }
function renderCensus() {
  const working = WORK.filter((w) => w.state === "working").length;
  const shipped = WORK.filter((w) => w.state === "merged").length;
  $("census").textContent = `· ${WORK.length} buildings, ${working} at work, ${shipped} shipped`;
  const n = needs().length;
  const btn = $("needs-you");
  btn.hidden = n === 0;
  btn.innerHTML = `<span class="attention-mark">!</span>${n} need${n === 1 ? "s" : ""} you`;
  $("inbox-count").textContent = n || "";
}
function renderKey() {
  const k = (svg, text) => `<div class="key-row"><svg viewBox="-11 -9 22 18" aria-hidden="true">${svg}</svg>${text}</div>`;
  $("key-rows").innerHTML =
    k(`<rect x="-8" y="-6" width="5" height="5" rx="1" fill="${css("--state-working")}"/><rect x="-1" y="-6" width="5" height="5" rx="1" fill="${css("--state-working")}"/><rect x="-8" y="1" width="5" height="5" rx="1" fill="${css("--state-working")}"/><rect x="-1" y="1" width="5" height="5" rx="1" fill="${css("--text-tertiary")}" opacity="0.4"/><circle cx="7" cy="-4" r="2.5" fill="${css("--text-tertiary")}"/>`, "Lights and smoke: agents at work") +
    k(`<circle cx="0" cy="0" r="4" fill="${css("--state-attention")}"/><circle cx="0" cy="0" r="8" fill="none" stroke="${css("--state-attention")}" stroke-width="1.5" opacity="0.6"/>`, "Beacon: someone needs an answer") +
    k(`<ellipse cx="0" cy="0" rx="9" ry="4.5" fill="none" stroke="${css("--voice-developer")}" stroke-width="1.5"/><circle cx="0" cy="0" r="2" fill="${css("--voice-developer")}"/>`, "Rings: you are talking it through") +
    k(`<rect x="-9" y="-5" width="11" height="9" rx="1" fill="${css("--text-secondary")}"/><rect x="3" y="-2" width="6" height="6" rx="1" fill="${css("--workspace-hue-1")}"/><circle cx="-4" cy="-8" r="1.8" fill="${css("--state-complete")}"/>`, "Truck at the dock: ready to merge") +
    k(`<line x1="-4" y1="8" x2="-4" y2="-8" stroke="${css("--text-secondary")}" stroke-width="1.5"/><path d="M-4,-8 l11,3 l-11,4 Z" fill="${css("--state-merged")}"/>`, "Flag: merged") +
    k(`<line x1="0" y1="8" x2="0" y2="-7" stroke="#e0b42e" stroke-width="2"/><line x1="-8" y1="-7" x2="9" y2="-7" stroke="#e0b42e" stroke-width="2"/>`, "Crane: going up floor by floor");
}

/* ------------------------------------------------------------------------
   Wiring.
   ------------------------------------------------------------------------ */
function setTheme(t) {
  theme = t;
  document.documentElement.dataset.theme = t;
  for (const b of document.querySelectorAll("[data-theme-choice]")) b.setAttribute("aria-pressed", String(b.dataset.themeChoice === t));
  renderAll(); renderKey(); applyCamera(true);
}
for (const b of document.querySelectorAll("[data-theme-choice]")) b.addEventListener("click", () => setTheme(b.dataset.themeChoice));

const scene = $("scene");
scene.addEventListener("click", (e) => {
  if (dragMoved) return;
  const g = e.target.closest(".bldg");
  if (g) { open(g.dataset.id); return; }
  if (e.target.closest("#new-plot")) { toast(`${glyph("plus")}New task: a fresh plot breaks ground once you start talking`); return; }
  if (openId) close();
});
scene.addEventListener("pointerover", (e) => {
  const g = e.target.closest(".bldg");
  const id = g ? g.dataset.id : null;
  if (id !== hoverId) { hoverId = id; syncPlotMarks(); }
});
scene.addEventListener("focusin", (e) => { const g = e.target.closest(".bldg"); focusId = g?.matches(":focus-visible") ? g.dataset.id : null; syncPlotMarks(); });
scene.addEventListener("focusout", () => { focusId = null; syncPlotMarks(); });
scene.addEventListener("keydown", (e) => {
  const g = e.target.closest(".bldg");
  if (g && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); open(g.dataset.id); }
  if (e.target.closest("#new-plot") && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); toast(`${glyph("plus")}New task: a fresh plot breaks ground once you start talking`); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") close();
  if (e.target.closest("input, textarea")) return;
  if (e.key === "r" && !e.metaKey) turn();
});
$("task-list").addEventListener("click", (e) => { const r = e.target.closest(".task-row"); if (r) open(r.dataset.id); });
$("inspector").addEventListener("click", (e) => {
  if (e.target.closest("#insp-close")) close();
  const a = e.target.closest("[data-answer]");
  if (a) answer(a.dataset.answer);
  if (e.target.closest("#merge")) merge();
});
let needIndex = 0;
$("needs-you").addEventListener("click", () => {
  const list = needs();
  if (!list.length) return;
  const cur = list.findIndex((w) => w.id === openId);
  needIndex = cur === -1 ? 0 : (cur + 1) % list.length;
  open(list[needIndex].id);
});
$("zoom-in").addEventListener("click", () => { zoomBy(1.3); applyCamera(false); });
$("zoom-out").addEventListener("click", () => { zoomBy(1 / 1.3); applyCamera(false); });
$("fit").addEventListener("click", () => { if (openId) close(); else fitCampus(false); });
function turn() {
  rot = (rot + 1) % 4;
  renderAll();
  if (openId) focusOn(openId, true); else fitCampus(true);
}
$("rotate").addEventListener("click", turn);
function setKey(shown) { $("key").toggleAttribute("data-hidden", !shown); $("key-toggle").setAttribute("aria-pressed", String(shown)); }
$("key-close").addEventListener("click", () => setKey(false));
$("key-toggle").addEventListener("click", () => setKey($("key").hasAttribute("data-hidden")));

/* Dragging pans; the wheel zooms about the pointer. */
const stage = $("stage");
let drag = null, dragMoved = false;
stage.addEventListener("pointerdown", (e) => {
  if (e.target.closest(".map-controls, .key, .toast")) return;
  drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y };
  dragMoved = false;
});
window.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!dragMoved && Math.hypot(dx, dy) < 4) return;
  dragMoved = true;
  stage.setAttribute("data-dragging", "");
  cam.x = drag.cx + dx; cam.y = drag.cy + dy;
  applyCamera(true);
});
window.addEventListener("pointerup", () => {
  drag = null;
  stage.removeAttribute("data-dragging");
  setTimeout(() => { dragMoved = false; }, 0);
});
stage.addEventListener("wheel", (e) => {
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  zoomBy(Math.exp(-e.deltaY * 0.0022), e.clientX - r.left, e.clientY - r.top);
  applyCamera(true);
}, { passive: false });
new ResizeObserver(() => { if (openId) focusOn(openId, true); else fitCampus(true); }).observe(stage);

/* A working building's activity keeps arriving while its inspector is open. */
setInterval(() => {
  if (!openId || reduced.matches) return;
  const w = byId[openId];
  const lines = TICKER[w.id];
  if (!lines || w.state !== "working") return;
  const log = $("log");
  if (!log) return;
  const line = lines[(Date.now() / 3000 | 0) % lines.length];
  log.insertAdjacentHTML("afterbegin", `<div class="log-line" data-new><time>now</time><span>${line}</span></div>`);
  log.querySelectorAll(".log-line time").forEach((t, idx) => { if (idx > 0 && t.textContent === "now") t.textContent = "1m"; });
  while (log.children.length > 6) log.lastElementChild.remove();
}, 3000);

const params = new URLSearchParams(location.search);
const initialTheme = params.get("theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
renderSidebar();
renderCensus();
setTheme(initialTheme);
fitCampus(true);
if (params.get("open")) open(params.get("open"));
if (params.get("rot")) { for (let i = 0; i < Number(params.get("rot")); i++) turn(); }
requestAnimationFrame(frame);
</script>
</body>
</html>
