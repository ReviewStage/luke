<!doctype html>
<!-- Factory as a campus of buildings: a design exploration, not a feature. One self-contained page that fetches nothing; every task, agent, Inbox item, and pull request on it is illustrative, shaped as the fields the window already holds. Open it in a browser. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luke · Factory as a campus (design exploration)</title>
<style>
/* Tokens, copied from the renderer's base.css, desktop.css, and the generated
   motion tokens so the mockup wears the app's own ground, ink, and timing. */
:root {
  color-scheme: dark;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
  font-synthesis: none;
  -webkit-font-smoothing: antialiased;
  --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  --spring: linear(0, 0.0285, 0.0993, 0.1943, 0.3005, 0.4083, 0.5115, 0.6061, 0.69, 0.7623, 0.8229, 0.8727, 0.9125, 0.9437, 0.9674, 0.9848, 0.9972, 1.0056, 1.0109, 1.0138, 1.015, 1.015, 1.0142, 1.0129, 1.0114, 1.0098, 1);
  --duration-fast: 280ms;
  --motion-exit: cubic-bezier(0.4, 0, 0.6, 1);
  --duration-shape: 460ms;
  --duration-exit: 90ms;
  --duration-quick: 140ms;
  --duration-hover: 70ms;
  --duration-pane: 240ms;
  --motion-pane: cubic-bezier(0.2, 0, 0, 1);
  --row-stagger: 32ms;
  --loop-motion: running;

  --space-2: 2px; --space-4: 4px; --space-6: 6px; --space-8: 8px; --space-12: 12px;
  --space-16: 16px; --space-20: 20px; --space-24: 24px; --space-32: 32px; --space-40: 40px;
  --column-inset: var(--space-12);
  --row-inset: var(--space-8);
  --content-inset: calc(var(--column-inset) + var(--row-inset));
  --glyph-gap: var(--space-8);
  --control-gap: var(--space-8);
  --list-gap: var(--space-2);
  --section-gap: var(--space-16);
  --control-height: 30px;
  --control-radius: 8px;
  --control-glyph: 15px;
  --menu-inset: var(--space-4);
  --menu-row-height: 32px;
  --menu-row-radius: 6px;
  --menu-radius: calc(var(--menu-row-radius) + var(--menu-inset));
  --sidebar-width: 264px;
  --desktop-bar-height: 51px;
  --focus-ring-width: 2px;
  --focus-ring-offset: 1px;
}

/* Dark, the default; data-theme on <html> takes a choice from the page's own switch. */
:root, :root[data-theme="dark"] {
  color-scheme: dark;
  --state-working: #5cd5ff;
  --state-attention: #ffa049;
  --state-complete: #6fdca4;
  --state-merged: #c3a0ff;
  --voice-developer: #7fe0ac;
  --message-sent: #0071e3;
  --danger: #ff7e7e;
  --text-primary: rgba(255, 255, 255, 0.95);
  --text-secondary: rgba(255, 255, 255, 0.56);
  --text-tertiary: rgba(255, 255, 255, 0.5);
  --text-body: rgba(255, 255, 255, 0.86);
  --raised: rgba(255, 255, 255, 0.05);
  --raised-strong: rgba(255, 255, 255, 0.09);
  --selected: rgba(255, 255, 255, 0.2);
  --pressed: rgba(255, 255, 255, 0.26);
  --hairline: rgba(255, 255, 255, 0.08);
  --hairline-strong: rgba(255, 255, 255, 0.12);
  --on-accent: #fff;
  --shadow: rgba(0, 0, 0, 0.5);
  --shadow-deep: rgba(0, 0, 0, 0.6);
  --section-fill: rgba(255, 255, 255, 0.022);
  --desktop-ground: #0c0c0e;
  --desktop-sidebar: #111114;
  --desktop-well: #0f0f12;
  --sidebar-ink: rgba(255, 255, 255, 0.7);
  --surface-popover: #111114;
  --attention-mark-ground: #c4620c;
  --workspace-hue-1: #4f63b8;
  --actor-tile: #2a2a30;
  --focus-ring: var(--message-sent);
  --page-ground: #050506;
  --page-ink: rgba(255, 255, 255, 0.6);
  --stage-sky: radial-gradient(120% 90% at 50% 30%, #15161c 0%, #0c0c0e 70%);
  --label-ground: rgba(17, 17, 20, 0.92);
}

:root[data-theme="light"] {
  color-scheme: light;
  --state-working: #0a72a8;
  --state-attention: #a65400;
  --state-complete: #18794e;
  --state-merged: #8250df;
  --voice-developer: #17784a;
  --danger: #e0383e;
  --text-primary: rgba(0, 0, 0, 0.88);
  --text-secondary: rgba(0, 0, 0, 0.6);
  --text-tertiary: rgba(0, 0, 0, 0.56);
  --text-body: rgba(0, 0, 0, 0.8);
  --raised: rgba(0, 0, 0, 0.035);
  --raised-strong: rgba(0, 0, 0, 0.06);
  --selected: rgba(0, 0, 0, 0.07);
  --pressed: rgba(0, 0, 0, 0.11);
  --hairline: rgba(0, 0, 0, 0.08);
  --hairline-strong: rgba(0, 0, 0, 0.1);
  --shadow: rgba(0, 0, 0, 0.12);
  --shadow-deep: rgba(0, 0, 0, 0.2);
  --section-fill: #fff;
  --desktop-ground: #fcfcfc;
  --desktop-sidebar: #f3f3f4;
  --desktop-well: #f8f8f9;
  --sidebar-ink: rgba(0, 0, 0, 0.68);
  --surface-popover: #fff;
  --attention-mark-ground: #a65400;
  --workspace-hue-1: #4a5fc0;
  --actor-tile: #e8e8ec;
  --page-ground: #e4e4e8;
  --page-ink: rgba(0, 0, 0, 0.6);
  --stage-sky: radial-gradient(120% 90% at 50% 30%, #ffffff 0%, #f4f4f6 70%);
  --label-ground: rgba(255, 255, 255, 0.94);
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --loop-motion: paused;
    --duration-fast: 0ms; --duration-shape: 0ms; --duration-exit: 0ms;
    --duration-quick: 0ms; --duration-hover: 0ms; --duration-pane: 0ms; --row-stagger: 0ms;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  display: flex;
  flex-direction: column;
  background: var(--page-ground);
  color: var(--text-primary);
  font-size: 13px;
  overflow: hidden;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: default; }
svg.glyph { width: 15px; height: 15px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
:focus { outline: none; }
:focus-visible { outline: var(--focus-ring-width) solid var(--focus-ring); outline-offset: var(--focus-ring-offset); }

/* The page around the mockup: what this is, and the appearance switch. */
.show-head {
  display: flex;
  align-items: center;
  gap: var(--space-16);
  padding: var(--space-12) var(--space-24);
  color: var(--page-ink);
  font-size: 12px;
}
.show-head strong { color: var(--text-primary); font-weight: 600; font-size: 13px; }
.show-chip {
  padding: var(--space-2) var(--space-8);
  border: 1px solid var(--hairline-strong);
  border-radius: 999px;
  color: var(--text-secondary);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.02em;
}
.show-chip[data-tone="illustrative"] { color: var(--state-attention); border-color: currentColor; }
.show-head .spacer { flex: 1; }
.segmented {
  display: inline-flex;
  margin: 0;
  border: 0;
  padding: var(--space-2);
  border-radius: var(--control-radius);
  background: var(--raised-strong);
}
.segmented button {
  height: 24px;
  padding: 0 var(--space-12);
  border-radius: 6px;
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 600;
}
.segmented button[aria-pressed="true"] { background: var(--desktop-ground); color: var(--text-primary); box-shadow: 0 1px 2px var(--shadow); }

/* The window. */
.window-wrap { flex: 1; min-height: 0; display: flex; padding: 0 var(--space-24) var(--space-24); }
.window {
  position: relative;
  flex: 1;
  min-width: 0;
  display: grid;
  grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
  border: 1px solid var(--hairline-strong);
  border-radius: 12px;
  overflow: clip;
  background: var(--desktop-ground);
  box-shadow: 0 24px 64px var(--shadow-deep);
}
.traffic { position: absolute; top: 18px; left: 18px; display: flex; gap: 8px; z-index: 5; }
.traffic i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; }
.traffic i:nth-child(2) { background: #febc2e; }
.traffic i:nth-child(3) { background: #28c840; }

/* Sidebar, drawn as desktop-sidebar.tsx draws it. */
.sidebar {
  display: flex;
  min-height: 0;
  flex-direction: column;
  padding: 0 var(--column-inset) var(--column-inset);
  border-right: 1px solid var(--hairline);
  background: var(--desktop-sidebar);
}
.sidebar-top { height: var(--desktop-bar-height); display: flex; align-items: center; justify-content: flex-end; gap: var(--space-2); }
.sidebar-top .icon-button { color: var(--text-tertiary); }
.switcher {
  display: flex; align-items: center; gap: var(--glyph-gap);
  height: 36px; padding: 0 var(--row-inset); margin-bottom: var(--space-8);
  border-radius: 9px; font-size: 14px; font-weight: 650; letter-spacing: -0.01em;
}
.switcher:hover { background: var(--raised); }
.workspace-tile {
  display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 4px;
  background: var(--workspace-hue-1); color: #fff; font-size: 10px; font-weight: 650;
}
.switcher .chev { margin-left: auto; color: var(--text-tertiary); }
.side-row {
  display: flex; align-items: center; gap: var(--glyph-gap);
  height: var(--control-height); margin: 0 0 var(--list-gap); padding: 0 var(--row-inset);
  border-radius: 9px; color: var(--sidebar-ink); font-size: 13px; text-align: left; width: 100%;
  transition: background-color var(--duration-hover) ease, color var(--duration-hover) ease;
}
.side-row:hover { color: var(--text-primary); }
.side-row[aria-current="page"] { background: var(--raised-strong); color: var(--text-primary); }
.side-row .end { margin-left: auto; color: var(--text-tertiary); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.kbd { display: inline-flex; gap: 1px; color: var(--text-tertiary); font-size: 11.5px; }
.sidebar-rule { height: 1px; margin: var(--space-8) var(--row-inset); border: 0; background: var(--hairline); }
.section-head {
  display: flex; align-items: center; height: 28px; padding: 0 var(--row-inset);
  color: var(--text-tertiary); font-size: 11.5px; font-weight: 600;
}
.task-row {
  display: flex; align-items: center; gap: var(--glyph-gap);
  width: 100%; min-height: var(--control-height); padding: var(--space-6) var(--row-inset);
  border-radius: 9px; color: var(--sidebar-ink); text-align: left; font-size: 13px;
}
.task-row:hover { color: var(--text-primary); background: var(--raised); }
.task-row[aria-current="true"] { background: var(--raised-strong); color: var(--text-primary); }
.task-row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; background: var(--tone, var(--text-tertiary)); }
.dot[data-pulse] { box-shadow: 0 0 0 3px color-mix(in srgb, var(--tone) 25%, transparent); }
.sidebar-scroll { flex: 1; min-height: 0; overflow: auto; margin: 0 calc(-1 * var(--space-4)); padding: 0 var(--space-4); }
.sidebar-foot { padding-top: var(--space-8); border-top: 1px solid var(--hairline); }

/* The work column: a toolbar over the campus, and the inspector pane beside it. */
.main { display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; min-height: 0; }
.toolbar {
  display: flex; align-items: center; gap: var(--control-gap);
  min-height: var(--desktop-bar-height); padding: var(--space-8) var(--content-inset);
  border-bottom: 1px solid var(--hairline);
}
.toolbar-title { display: flex; align-items: center; gap: var(--glyph-gap); font-size: 13px; font-weight: 600; }
.toolbar-title .sub { color: var(--text-tertiary); font-weight: 500; }
.toolbar .spacer { flex: 1; }
.toolbar-button, .icon-button, .primary-button {
  --button-fill: transparent;
  display: inline-flex; align-items: center; justify-content: center; gap: var(--glyph-gap);
  height: var(--control-height); padding: 0 var(--space-12);
  border-radius: var(--control-radius); background: var(--button-fill);
  font-size: 12.5px; font-weight: 600; white-space: nowrap;
  transition: background-color var(--duration-hover) ease, color var(--duration-hover) ease, filter var(--duration-hover) ease;
}
.icon-button { width: var(--control-height); padding: 0; color: var(--text-secondary); }
.toolbar-button:hover, .icon-button:hover, .toolbar-button[aria-pressed="true"], .icon-button[aria-pressed="true"] { background: var(--selected); color: var(--text-primary); }
.toolbar-button:active, .icon-button:active { background: var(--pressed); }
.primary-button { --button-fill: var(--message-sent); color: var(--on-accent); }
.primary-button:hover { filter: brightness(1.1); }
.toolbar-button[data-tone="attention"] { color: var(--state-attention); }
.attention-mark {
  display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%;
  background: var(--attention-mark-ground); color: #fff; font-size: 11px; font-weight: 800; line-height: 1;
}

.work { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; min-height: 0; }
.stage {
  position: relative; min-width: 0; min-height: 0; overflow: clip;
  background: var(--stage-sky);
  touch-action: none;
}
.stage svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage[data-dragging] { cursor: grabbing; }
#camera { transform-origin: 0 0; transition: transform var(--duration-shape) var(--spring); }
.stage[data-dragging] #camera, #camera[data-instant] { transition: none; }

/* The campus. */
.stage:focus { outline: none; } /* no ring: the stage's inset edge (.stage:focus-visible) draws it */
.stage:focus-visible { box-shadow: inset 0 0 0 var(--focus-ring-width) var(--focus-ring); }
.bldg, .crate, .yard-hit { cursor: pointer; transition: opacity var(--duration-fast) ease; }
.bldg:focus-visible, .crate:focus-visible, .yard-hit:focus-visible { outline: none; } /* no ring: the plot's or the crate's own outline takes the ring's colour */
.scene[data-focused] .bldg:not([data-open]), .scene[data-focused] .crate:not([data-mine]) { opacity: 0.45; }
.bldg .lift { transition: transform var(--duration-hover) ease; }
.bldg:hover .lift { transform: translateY(-3px); }
.bldg .shell, .bldg .upper, .bldg .cut, .bldg .fx-roof { transition: opacity var(--duration-fast) ease, transform var(--duration-shape) var(--spring); }
.bldg .cut { opacity: 0; pointer-events: none; }
.bldg[data-open] .shell { opacity: 0; }
.bldg[data-open] .upper { opacity: 0; transform: translateY(-48px); }
.bldg[data-open] .fx-roof { opacity: 0; }
.bldg[data-open] .cut { opacity: 1; }
.plot-edge, .crate-edge, .yard-edge { fill: none; stroke: var(--text-primary); stroke-width: 1.4; opacity: 0; transition: opacity var(--duration-hover) ease; vector-effect: non-scaling-stroke; }
.plot[data-hover] .plot-edge, .crate:hover .crate-edge, .yard-hit:hover .yard-edge { opacity: 0.4; }
.plot[data-open] .plot-edge, .crate[data-hot] .crate-edge, .yard-hit[data-open] .yard-edge { opacity: 0.7; }
.plot[data-focus] .plot-edge, .crate:focus-visible .crate-edge, .yard-hit:focus-visible .yard-edge { opacity: 1; stroke: var(--focus-ring); stroke-width: 2; }
.new-plot { cursor: pointer; }
.new-plot .plot-dash { fill: none; stroke: var(--text-tertiary); stroke-width: 1.2; stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; }
.new-plot:hover .plot-dash { stroke: var(--text-primary); }
.new-plot:focus-visible { outline: none; } /* no ring: the dashed edge takes the ring's colour and weight */
.new-plot:focus-visible .plot-dash { stroke: var(--focus-ring); stroke-width: 2; }
.route { fill: none; stroke-width: 1.6; stroke-dasharray: 4 3; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.win-lit { filter: url(#glow); }
:root[data-theme="light"] .win-lit { filter: none; }

/* Loops, only while something is happening. Each answers --loop-motion. */
.loop { animation-play-state: var(--loop-motion); transform-box: fill-box; transform-origin: center; }
.smoke { animation: smoke 4.8s linear infinite; }
@keyframes smoke { 0% { transform: translate(0, 0) scale(0.5); opacity: 0; } 12% { opacity: 0.7; } 100% { transform: translate(-22px, -64px) scale(2.1); opacity: 0; } }
.beacon-ring { animation: beacon 1.6s ease-out infinite; }
@keyframes beacon { 0% { transform: scale(0.4); opacity: 0.9; } 100% { transform: scale(2.6); opacity: 0; } }
.pulse { animation: blink 1.6s ease-in-out infinite; }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
.wave { animation: wave 2.4s ease-out infinite; }
@keyframes wave { 0% { transform: scale(0.3); opacity: 0; } 15% { opacity: 0.9; } 100% { transform: scale(1.8); opacity: 0; } }
.flag { animation: flag 2.2s ease-in-out infinite; transform-origin: left center; }
@keyframes flag { 0%, 100% { transform: skewY(0deg) scaleX(1); } 50% { transform: skewY(-6deg) scaleX(0.92); } }
.bubble { animation: bob 2.8s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
#avatar .body { transform-box: fill-box; transform-origin: center bottom; }
#avatar[data-walking] .body { animation: step 0.36s ease-in-out infinite; animation-play-state: var(--loop-motion); }
@keyframes step { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }

/* Names float over the campus at a constant size. */
.tag { pointer-events: none; transition: opacity var(--duration-quick) ease; }
.tag rect { fill: var(--label-ground); stroke: var(--hairline-strong); }
.tag text { font-size: 11px; font-weight: 600; fill: var(--text-primary); }
.tag[data-dim] { opacity: 0.3; }
.tag[data-hide] { opacity: 0; }
.agent-tag text { font-size: 7px; font-weight: 600; fill: var(--text-primary); }
.agent-tag rect { fill: var(--label-ground); stroke: var(--hairline-strong); }

/* What floats over the stage: the walking hint, the map's controls and its key, a crate's card, a notice. */
.walk-hint {
  position: absolute; left: 50%; bottom: var(--space-16); transform: translateX(-50%);
  display: flex; align-items: center; gap: var(--space-8);
  padding: var(--space-6) var(--space-12); border: 1px solid var(--hairline-strong); border-radius: 999px;
  background: var(--surface-popover); color: var(--text-secondary); font-size: 12px; white-space: nowrap; pointer-events: none;
  box-shadow: 0 8px 24px var(--shadow);
}
.walk-hint kbd {
  display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 var(--space-4);
  border: 1px solid var(--hairline-strong); border-radius: 4px; background: var(--raised); color: var(--text-primary);
  font: 600 11px/1 -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
}
.walk-hint .on { display: none; }
.stage:focus-within .walk-hint .on { display: inline; }
.stage:focus-within .walk-hint .off { display: none; }
.map-controls {
  position: absolute; right: var(--space-16); bottom: var(--space-16);
  display: flex; flex-direction: column; gap: var(--space-2);
  padding: var(--space-4); border: 1px solid var(--hairline-strong); border-radius: var(--menu-radius);
  background: var(--surface-popover); box-shadow: 0 12px 32px var(--shadow);
}
.map-controls hr { width: 100%; height: 1px; margin: var(--space-2) 0; border: 0; background: var(--hairline); }
.key {
  position: absolute; right: 64px; bottom: var(--space-16); width: 250px;
  padding: var(--space-8) var(--space-4) var(--space-4);
  border: 1px solid var(--hairline-strong); border-radius: var(--menu-radius);
  background: var(--surface-popover); box-shadow: 0 12px 32px var(--shadow);
  transition: opacity var(--duration-quick) ease, transform var(--duration-shape) var(--spring);
}
.key[data-hidden] { opacity: 0; transform: translateY(8px); pointer-events: none; }
.key-row { display: flex; align-items: center; gap: var(--glyph-gap); padding: var(--space-4) var(--space-8); color: var(--text-secondary); font-size: 11.5px; line-height: 1.35; }
.key-row svg { width: 22px; height: 18px; flex: 0 0 auto; overflow: visible; }
.key-row b { color: var(--text-primary); font-weight: 600; }
.crate-card {
  position: absolute; z-index: 2; min-width: 200px; pointer-events: none;
  padding: var(--space-8) var(--space-12); border: 1px solid var(--hairline-strong); border-radius: var(--menu-radius);
  background: var(--surface-popover); box-shadow: 0 12px 32px var(--shadow); font-size: 12px;
  transition: opacity var(--duration-quick) ease;
}
.crate-card[data-hidden] { opacity: 0; }
.crate-card .title { font-weight: 650; margin-bottom: var(--space-4); }
.crate-card .line { color: var(--text-secondary); line-height: 1.5; }
.toast {
  position: absolute; left: 50%; bottom: 64px;
  display: flex; align-items: center; gap: var(--glyph-gap);
  padding: var(--space-8) var(--space-12); border: 1px solid var(--hairline-strong); border-radius: 10px;
  background: var(--surface-popover); box-shadow: 0 12px 32px var(--shadow); font-size: 12.5px; font-weight: 600;
  transform: translateX(-50%); transition: opacity var(--duration-quick) ease, transform var(--duration-shape) var(--spring);
}
.toast[data-hidden] { opacity: 0; transform: translate(-50%, 8px); pointer-events: none; }

/* The inspector: a pane beside the campus, the side panel's well and edge. */
.inspector { width: 0; overflow: clip; border-left: 0 solid var(--hairline); background: var(--desktop-well); display: flex; flex-direction: column; min-height: 0; }
.inspector[data-open] { width: 360px; border-left-width: 1px; }
.inspector-body { width: 360px; flex: 1; min-height: 0; overflow: auto; padding: 0 0 var(--space-24); }
.inspector-body > * { animation: arrive var(--duration-shape) var(--spring) backwards; animation-delay: calc(var(--i, 0) * var(--row-stagger)); }
@keyframes arrive { from { opacity: 0; transform: translateY(6px); } }

<script>
"use strict";
/* ------------------------------------------------------------------------
   Glyphs: lucide's paths, as the renderer draws them, in a 24 box.
   ------------------------------------------------------------------------ */
const GLYPH = {

  "chevron-right": '<path d="m9 18 6-6-6-6"/>',

};
const glyph = (name) => `<svg class="glyph" viewBox="0 0 24 24" aria-hidden="true">${GLYPH[name] || ""}</svg>`;
const claudeMark = () => {
  let rays = "";
  for (let i = 0; i < 8; i++) {
    const a = (i * Math.PI) / 4;
    rays += `<line x1="12" y1="12" x2="${(12 + Math.cos(a) * 9).toFixed(2)}" y2="${(12 + Math.sin(a) * 9).toFixed(2)}"/>`;
  }
  return `<svg viewBox="0 0 24 24" aria-hidden="true" stroke="#d97757" stroke-width="3.2" stroke-linecap="round">${rays}</svg>`;
};
for (const el of document.querySelectorAll("[data-g]")) el.insertAdjacentHTML("afterbegin", glyph(el.dataset.g));
for (const el of document.querySelectorAll("[data-g-lead]")) el.insertAdjacentHTML("afterbegin", glyph(el.dataset.gLead));

/* ------------------------------------------------------------------------
   The illustrative work, shaped as the window already holds it: the plan
   list's TaskSummary (name, repository, start, and its agents' summary: a
   count of all and of those working, at most three named agents, a count of
   pull requests and at most three named ones with state, one-word checks,
   additions and deletions), the Inbox's open items, and the task on this
   Mac's call. Nothing is read from anywhere and nothing is stored.
   ------------------------------------------------------------------------ */
const NOW = Date.UTC(2026, 9, 16, 17, 0);
const MIN = 60_000, HOUR = 60 * MIN, DAY = 24 * HOUR;
const AGENT = { STARTING: "starting", RUNNING: "running", COMPLETED: "completed", FAILED: "failed", CANCELLED: "cancelled" };
const PR = { OPEN: "open", DRAFT: "draft", MERGED: "merged", CLOSED: "closed" };
const CHECKS = { PENDING: "pending", PASSING: "passing", FAILING: "failing", NONE: "none" };
const TASKS = [
  {
    id: "switching", name: "Faster workspace switching", repository: "ReviewStage/luke", createdAt: NOW - 9 * DAY,
    agents: { total: 5, working: 0, named: [
      { id: "sw-1", model: "Sonnet", effort: "medium", status: AGENT.COMPLETED, at: NOW - 3 * HOUR },
      { id: "sw-2", model: "Sonnet", effort: "medium", status: AGENT.COMPLETED, at: NOW - 5 * HOUR },
      { id: "sw-3", model: "Opus", effort: "high", status: AGENT.COMPLETED, at: NOW - 8 * HOUR },
    ] },
    pullRequests: { total: 4, named: [
      { number: 3071, title: "Faster workspace switching", state: PR.MERGED, checks: CHECKS.PASSING, additions: 302, deletions: 118 },
      { number: 3064, title: "Cache the workspace list", state: PR.MERGED, checks: CHECKS.PASSING, additions: 41, deletions: 12 },
      { number: 3059, title: "Drop the switcher's second read", state: PR.MERGED, checks: CHECKS.PASSING, additions: 18, deletions: 66 },
    ] },
  },
  {
    id: "empty", name: "Polish empty states", repository: "ReviewStage/luke", createdAt: NOW - 7 * DAY,
    agents: { total: 1, working: 0, named: [{ id: "em-1", model: "Opus", effort: "high", status: AGENT.COMPLETED, at: NOW - 26 * HOUR }] },
    pullRequests: { total: 1, named: [{ number: 3068, title: "Polish empty states", state: PR.MERGED, checks: CHECKS.PASSING, additions: 156, deletions: 47 }] },
  },
  {
    id: "reconnect", name: "Fix reconnect handling", repository: "ReviewStage/luke", createdAt: NOW - 3 * DAY,
    agents: { total: 1, working: 0, named: [{ id: "rc-1", model: "Opus", effort: "high", status: AGENT.COMPLETED, at: NOW - 18 * MIN }] },
    pullRequests: { total: 1, named: [{ number: 3081, title: "Fix reconnect handling", state: PR.OPEN, checks: CHECKS.PASSING, additions: 84, deletions: 31 }] },
  },
  {
    id: "search", name: "Improve search ranking", repository: "ReviewStage/luke", createdAt: NOW - 2 * DAY,
    agents: { total: 1, working: 1, named: [{ id: "se-1", model: "Sonnet", effort: "medium", status: AGENT.RUNNING, at: NOW - 22 * MIN }] },
    pullRequests: { total: 1, named: [{ number: 3088, title: "Improve search ranking", state: PR.OPEN, checks: CHECKS.FAILING, additions: 212, deletions: 48 }] },
  },
  {
    id: "shortcuts", name: "Keyboard shortcuts", repository: "ReviewStage/luke", createdAt: NOW - DAY,
    agents: { total: 1, working: 1, named: [{ id: "ks-1", model: "Opus", effort: "high", status: AGENT.RUNNING, at: NOW - 9 * MIN }] },
    pullRequests: { total: 0, named: [] },
  },
  {
    id: "invite", name: "Invite your teammates", repository: "ReviewStage/luke", createdAt: NOW - 5 * HOUR,
    agents: { total: 1, working: 0, named: [{ id: "iv-1", model: "Opus", effort: "high", status: AGENT.COMPLETED, at: NOW - 4 * MIN }] },
    pullRequests: { total: 1, named: [{ number: 3090, title: "Let members invite teammates", state: PR.OPEN, checks: CHECKS.PENDING, additions: 146, deletions: 9 }] },
  },
  {
    id: "factory-view", name: "Add another Factory view", repository: "ReviewStage/luke", createdAt: NOW - HOUR,
    agents: { total: 0, working: 0, named: [] },
    pullRequests: { total: 0, named: [] },
  },
];
const INBOX = [
  { id: "ib-1", taskId: "invite", agentId: "iv-1", title: "Should an invite link expire?", postedAt: NOW - 4 * MIN, options: ["After 7 days", "After 30 days", "Never"] },
];
const callTaskId = "factory-view";

const byId = Object.fromEntries(TASKS.map((t) => [t.id, t]));
const inboxFor = (t) => INBOX.filter((i) => i.taskId === t.id);
const allPRs = () => TASKS.flatMap((t) => t.pullRequests.named.map((p) => ({ ...p, taskId: t.id })));
const linesOf = (p) => p.additions + p.deletions;
const awaiting = () => allPRs().filter((p) => p.state === PR.OPEN);
const merged = () => allPRs().filter((p) => p.state === PR.MERGED);
const readyPRs = () => awaiting().filter((p) => p.checks === CHECKS.PASSING);
const unnamedPRs = (t) => Math.max(0, t.pullRequests.total - t.pullRequests.named.length);
const unnamedAgents = (t) => Math.max(0, t.agents.total - t.agents.named.length);
const ago = (at) => { const d = NOW - at; return d < HOUR ? `${Math.max(1, Math.round(d / MIN))}m` : d < DAY ? `${Math.round(d / HOUR)}h` : `${Math.round(d / DAY)}d`; };

/* What a task shows, read from the fields above. */
const running = (t) => t.agents.working > 0;
const asking = (t) => inboxFor(t).length > 0;
const failed = (t) => t.agents.named.some((a) => a.status === AGENT.FAILED);
/* Going up: an agent at work and no pull request yet. */
const underway = (t) => running(t) && t.pullRequests.total === 0;
/* Shipped: every pull request it names is merged. */
const shippedAll = (t) => t.pullRequests.named.length > 0 && t.pullRequests.named.every((p) => p.state === PR.MERGED);
function taskTone(t) {
  if (asking(t)) return "--state-attention";
  if (failed(t)) return "--danger";
  if (t.id === callTaskId) return "--voice-developer";
  if (running(t)) return "--state-working";
  if (t.pullRequests.named.some((p) => p.state === PR.OPEN && p.checks === CHECKS.PASSING)) return "--state-complete";
  if (shippedAll(t)) return "--state-merged";
  return "--text-tertiary";
}

/* ------------------------------------------------------------------------
   The campus: world tiles, N by N, and a shipped lot past its gate.
   x runs down to the right on screen, y down to the left, z up.
   ------------------------------------------------------------------------ */
const N = 20;
const DX = 22, DY = 11, DZ = 25;
let rot = 0;
const near = (a, b) => Math.abs(a - b) < 1e-6;
function R(x, y) {
  switch (rot) {
    case 1: return [N - y, x];
    case 2: return [N - x, N - y];
    case 3: return [y, N - x];
    default: return [x, y];
  }
}
const P = (x, y, z) => [(x - y) * DX, (x + y) * DY - z * DZ];
const PR_ = (x, y, z) => { const [a, b] = R(x, y); return P(a, b, z); };
const pts = (list) => list.map((p) => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
const poly = (list, fill, extra = "") => `<polygon points="${pts(list)}" fill="${fill}" ${extra}/>`;

let theme = "dark";
const PALETTE = {
  dark: {
    slab: "#18191e", grass: "#141a17", road: "#1f2026", line: "rgba(255,255,255,0.16)",
    pad: "#1d1e24", curb: "#26272e", wall: "#3a3c46", wall2: "#45403c", glass: "#1f2a36", roof: "#2c2e36",
    metal: "#4b4e5a", floor: "#2a2b33", inner: "#24252c", unlit: "#16171c", idle: "#e7d9bd",
    tree: "#1f3a2d", tree2: "#2a4a39", trunk: "#3a2f28", shadow: "rgba(0,0,0,0.42)", smoke: "#8a8d99",
    lamp: "#ffd9a0", deskTop: "#4a4c57", crate: "#5a4a36", unknown: "#3b3d45", lot: "#1b1c22", barrier: "#e6e8ee",
    luke: "#eef0f5", lukeInk: "#16171c",
  },
  light: {
    slab: "#e7e8ec", grass: "#dfe7df", road: "#d3d4da", line: "rgba(255,255,255,0.9)",

    s += `<g class="plot" data-plot="${task.id}">${boxSVG({ x, y, w, d, z: 0, h: 0.1 }, "pad", { topFill: c.pad })}<polygon class="plot-edge" points="${pts(edge)}"/></g>`;
    /* Light spilling from a building where something is happening. */
    const tone = taskTone(task);
    if (theme === "dark" && tone !== "--text-tertiary" && tone !== "--state-merged") {
      const [gx, gy] = PR_(slot.hollow.x + slot.hollow.w / 2, slot.hollow.y + slot.hollow.d / 2, 0.1);

  }

  const [mx, my] = PR_(x + w / 2, y + d / 2, 0.03);
  s += `<g class="new-plot" id="new-plot" tabindex="0" role="button" aria-label="New task"><polygon points="${pts(edge)}" fill="transparent"/><polygon class="plot-dash" points="${pts(edge)}"/>` +
    `<text x="${mx}" y="${my + 4}" text-anchor="middle" font-size="11" font-weight="600" fill="${css("--text-tertiary")}">+ New task</text></g>`;
  /* The yards answer a click too: the gate's yard and the shipped lot. */
  const yardEdge = (r, z) => [PR_(r.x, r.y, z), PR_(r.x + r.w, r.y, z), PR_(r.x + r.w, r.y + r.d, z), PR_(r.x, r.y + r.d, z)];
  s += `<g class="yard-hit" data-yard="gate" tabindex="0" role="button" aria-label="Merge gate: ${awaiting().length} open pull requests"><polygon points="${pts(yardEdge(YARD, 0.02))}" fill="transparent"/><polygon class="yard-edge" points="${pts(yardEdge(YARD, 0.02))}"/></g>`;
  s += `<g class="yard-hit" data-yard="shipped" tabindex="0" role="button" aria-label="Shipped: ${merged().length} merged pull requests"><polygon points="${pts(yardEdge(LOT, 0.02))}" fill="transparent"/><polygon class="yard-edge" points="${pts(yardEdge(LOT, 0.02))}"/></g>`;
  $("layer-plots").innerHTML = s;
}

function renderShadows() {
  let s = "";
  for (const { task, slot } of placed()) {
    for (const p of slot.parts(litFor(task))) {
      if (p.box && (p.box.z || 0) === 0) s += shadowSVG(p.box);
      if (p.cyl && p.solid) s += shadowCyl(p.cyl[0], p.cyl[1], p.cyl[2], p.cyl[4]);

  for (const c of cratePositions()) s += shadowSVG({ x: c.x - c.e / 2, y: c.y - c.e / 2, w: c.e, d: c.e, z: 0, h: c.e });
  for (const [x, y] of TREES) s += shadowCyl(x, y, 0.3, 1.1);

  $("layer-shadows").innerHTML = s;
}

function treeSVG(x, y) {
  const c = C();
  const [bx, by] = PR_(x, y, 0);
  const [tx, ty] = PR_(x, y, 1.25);
  const r = 0.34 * DX * Math.SQRT2;
  return `<line x1="${bx}" y1="${by}" x2="${bx}" y2="${by - 10}" stroke="${c.trunk}" stroke-width="2.4" stroke-linecap="round"/>` +
    `<path d="M${tx},${ty} L${bx - r},${by - 7} Q${bx},${by - 2} ${bx},${by - 2} Z" fill="${c.tree}"/>` +
    `<path d="M${tx},${ty} L${bx + r},${by - 7} Q${bx},${by - 2} ${bx},${by - 2} Z" fill="${c.tree2}"/>`;
}
function lampSVG(x, y) {
  const c = C();
  const [bx, by] = PR_(x, y, 0);
  const [, ty] = PR_(x, y, 1.1);
  const pool = theme === "dark" ? `<ellipse cx="${bx}" cy="${by}" rx="${1.3 * DX}" ry="${1.3 * DY}" fill="url(#pool)"/>` : "";
  return `${pool}<line x1="${bx}" y1="${by}" x2="${bx}" y2="${ty}" stroke="${c.metal}" stroke-width="1.4"/><circle cx="${bx}" cy="${ty}" r="2.4" fill="${theme === "dark" ? c.lamp : c.metal}" ${theme === "dark" ? 'filter="url(#glow)"' : ""}/>`;
}

/* Inside, with the roof off: a desk for every agent the task counts, with no cap. */
function figure(x, y, color, dashed) {
  const [bx, by] = PR_(x, y, 0);
  const st = dashed ? `fill="none" stroke="${color}" stroke-width="1" stroke-dasharray="2 1.5"` : `fill="${color}"`;
  return `<ellipse cx="${bx}" cy="${by}" rx="5" ry="2.6" fill="rgba(0,0,0,0.22)"/>` +
    `<path d="M${bx - 4.2},${by} L${bx - 3.4},${by - 11} Q${bx},${by - 14} ${bx + 3.4},${by - 11} L${bx + 4.2},${by} Q${bx},${by + 2} ${bx - 4.2},${by} Z" ${st}/>` +
    `<circle cx="${bx}" cy="${by - 17}" r="4.2" ${st}/>`;
}
function agentTag(x, y, z, text) {
  const [px, py] = PR_(x, y, z);
  const wd = textWidth(text, 7, 600) + 8;
  return `<g class="agent-tag" transform="translate(${px.toFixed(1)},${py.toFixed(1)})"><rect x="${-wd / 2}" y="-6" width="${wd}" height="11" rx="3.5" stroke-width="0.6"/><text x="0" y="2.2" text-anchor="middle">${text}</text></g>`;
}
function agentTone(agent) {
  if (INBOX.some((i) => i.agentId === agent.id)) return "--state-attention";
  if (agent.status === AGENT.RUNNING || agent.status === AGENT.STARTING) return "--state-working";
  if (agent.status === AGENT.FAILED) return "--danger";
  return null;
}
function agentWord(agent) {
  if (INBOX.some((i) => i.agentId === agent.id)) return "asked a question";

}
function insideSVG(task, slot) {
  const c = C();
  const hb = slot.hollow;
  let s = "";
  if (task.id === callTaskId && task.agents.total === 0) {
    const cx = hb.x + hb.w / 2, cy = hb.y + hb.d / 2;
    s += cylSVG(cx, cy, 0.5, 0, 0.3, "deskTop");
    s += figure(cx - 0.6, cy + 0.3, css("--workspace-hue-1")) + agentTag(cx - 0.6, cy + 0.3, 1.05, "You");
    s += figure(cx + 0.6, cy - 0.3, theme === "dark" ? "#e8eaf0" : "#2a2a30") + agentTag(cx + 0.6, cy - 0.3, 1.05, "Luke");
    return s;
  }
  const n = task.agents.total;
  if (!n) return s;
  const cols = Math.max(1, Math.ceil(Math.sqrt((n * hb.w) / hb.d)));
  const rows = Math.ceil(n / cols);
  const cw = hb.w / cols, rh = hb.d / rows;
  const desks = [];
  for (let i = 0; i < n; i++) desks.push({ i, x: hb.x + cw * ((i % cols) + 0.5), y: hb.y + rh * (Math.floor(i / cols) + 0.4) });
  desks.sort((a, b) => depthOf(a.x, a.y) - depthOf(b.x, b.y));
  const dw = Math.min(0.7, cw * 0.6), dd = Math.min(0.44, rh * 0.35);
  for (const dsk of desks) {
    const agent = task.agents.named[dsk.i];
    const tone = agent ? agentTone(agent) : null;
    s += boxSVG({ x: dsk.x - dw / 2, y: dsk.y - dd / 2, w: dw, d: dd, z: 0, h: 0.3 }, "deskTop");
    s += boxSVG({ x: dsk.x - dw * 0.42, y: dsk.y - dd / 2, w: dw * 0.84, d: 0.05, z: 0.3, h: 0.3 }, "metal", { topFill: tone ? css(tone) : c.unlit });
    const fy = dsk.y + dd / 2 + Math.min(0.3, rh * 0.25);
    if (!agent) { s += figure(dsk.x, fy, css("--text-tertiary"), true); continue; }
    s += figure(dsk.x, fy, "#d97757");
    s += agentTag(dsk.x, fy, 1.05, agent.model);
    if (INBOX.some((i) => i.agentId === agent.id)) {
      const [qx, qy] = PR_(dsk.x, fy, 1.6);
      s += `<g class="loop bubble"><circle cx="${qx + 16}" cy="${qy - 4}" r="8" fill="${css("--attention-mark-ground")}"/><text x="${qx + 16}" y="${qy}" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">?</text></g>`;
    }

}
function cutawaySVG(task, slot) {
  const c = C();
  const t = turnBox({ ...slot.hollow, z: 0 });
  const { x0, x1, y0, y1 } = t;
  const h = slot.hollow.h;
  const mat = c[slot.hollow.mat] || c.wall;
  let s = poly([P(x0, y0, 0.03), P(x1, y0, 0.03), P(x1, y1, 0.03), P(x0, y1, 0.03)], c.floor);
  s += poly([P(x0, y0, 0), P(x0, y1, 0), P(x0, y1, h), P(x0, y0, h)], shade(mat, FX));
  s += poly([P(x0, y0, 0), P(x1, y0, 0), P(x1, y0, h), P(x0, y0, h)], shade(mat, FY));
  s += insideSVG(task, slot);
  const cut = 0.28;
  s += poly([P(x1, y0, 0), P(x1, y1, 0), P(x1, y1, cut), P(x1, y0, cut)], shade(mat, FX));
  s += poly([P(x0, y1, 0), P(x1, y1, 0), P(x1, y1, cut), P(x0, y1, cut)], shade(mat, FY));
  s += `<polyline points="${pts([P(x1, y0, cut), P(x1, y1, cut), P(x0, y1, cut)])}" fill="none" stroke="${theme === "dark" ? "rgba(255,255,255,0.25)" : "rgba(0,0,0,0.15)"}" stroke-width="1.2"/>`;
  return s;
}

/* What a roof says. */
function roofSignals(task, slot) {
  const c = C();
  let s = "";
  const [rx, ry, rz] = slot.roof;
  const [px, py] = PR_(rx, ry, rz);
  if (asking(task)) {
    const col = css("--state-attention");
    s += `<line x1="${px}" y1="${py + 14}" x2="${px}" y2="${py}" stroke="${c.metal}" stroke-width="2"/>` +
      `<ellipse class="loop beacon-ring" cx="${px}" cy="${py}" rx="9" ry="9" fill="none" stroke="${col}" stroke-width="2"/>` +
      `<ellipse class="loop beacon-ring" style="animation-delay:-0.8s" cx="${px}" cy="${py}" rx="9" ry="9" fill="none" stroke="${col}" stroke-width="2"/>` +
      `<circle cx="${px}" cy="${py}" r="5.5" fill="${col}" filter="url(#glow)"/>`;
  } else if (task.id === callTaskId) {
    const col = css("--voice-developer");
    s += `<circle cx="${px}" cy="${py}" r="3.2" fill="${col}" filter="url(#glow)"/>`;
    for (let i = 0; i < 3; i++) s += `<ellipse class="loop wave" style="animation-delay:${-i * 0.8}s" cx="${px}" cy="${py}" rx="26" ry="13" fill="none" stroke="${col}" stroke-width="1.6"/>`;
  } else if (failed(task)) {
    s += `<circle class="loop pulse" cx="${px}" cy="${py}" r="5" fill="${css("--danger")}" filter="url(#glow)"/>`;
  } else if (shippedAll(task) && !running(task)) {
    const col = css("--state-merged");
    s += `<line x1="${px}" y1="${py}" x2="${px}" y2="${py - 34}" stroke="${c.metal}" stroke-width="1.6"/><path class="loop flag" d="M${px},${py - 34} l18,4 l-18,6 Z" fill="${col}"/>`;
  }
  if (running(task) && slot.stack) {
    const [sx, sy] = PR_(...slot.stack);
    for (let i = 0; i < 5; i++) s += `<circle class="loop smoke" style="animation-delay:${-i * 0.96}s" cx="${sx}" cy="${sy}" r="5" fill="${c.smoke}" opacity="0"/>`;
  }
  return `<g class="fx-roof">${s}</g>`;
}
let craneAngle = 0.6;
function craneSVG(cr) {
  const c = C();
  const [mx, my] = cr.at;
  let s = boxSVG({ x: mx - 0.09, y: my - 0.09, w: 0.18, d: 0.18, z: 0, h: cr.h }, "#c9a227");
  const [tx, ty] = PR_(mx, my, cr.h);
  const tip = [mx + Math.cos(craneAngle) * cr.jib, my + Math.sin(craneAngle) * cr.jib];
  const back = [mx - Math.cos(craneAngle) * 1.1, my - Math.sin(craneAngle) * 1.1];
  const [ax, ay] = PR_(tip[0], tip[1], cr.h + 0.1);
  const [bx, by] = PR_(back[0], back[1], cr.h + 0.1);
  const tr = [mx + Math.cos(craneAngle) * cr.jib * 0.7, my + Math.sin(craneAngle) * cr.jib * 0.7];
  const [hx, hy] = PR_(tr[0], tr[1], cr.h + 0.1);
  const [lx, ly] = PR_(tr[0], tr[1], cr.h - 1.6);
  s += `<line x1="${bx}" y1="${by}" x2="${ax}" y2="${ay}" stroke="#e0b42e" stroke-width="3" stroke-linecap="round"/>`;
  s += `<line x1="${tx}" y1="${ty - 14}" x2="${ax}" y2="${ay}" stroke="#e0b42e" stroke-width="0.8"/><line x1="${tx}" y1="${ty - 14}" x2="${bx}" y2="${by}" stroke="#e0b42e" stroke-width="0.8"/>`;
  s += `<line x1="${tx}" y1="${ty}" x2="${tx}" y2="${ty - 14}" stroke="#e0b42e" stroke-width="2"/>`;
  s += `<rect x="${bx - 5}" y="${by - 2}" width="10" height="7" fill="${c.metal}"/>`;
  s += `<line x1="${hx}" y1="${hy}" x2="${lx}" y2="${ly}" stroke="${c.metal}" stroke-width="0.8"/><rect x="${lx - 6}" y="${ly}" width="12" height="7" fill="${c.crate}"/>`;
  return s;
}
function scaffoldSVG(hb) {
  const col = theme === "dark" ? "#8a7a4a" : "#b89a52";
  const { x, y, w, d, h } = hb;
  const corners = [[x - 0.1, y - 0.1], [x + w + 0.1, y - 0.1], [x + w + 0.1, y + d + 0.1], [x - 0.1, y + d + 0.1]];
  let s = "";
  for (const [px, py] of corners) { const [a, b] = PR_(px, py, 0); const [, e] = PR_(px, py, h + 0.6); s += `<line x1="${a}" y1="${b}" x2="${a}" y2="${e}" stroke="${col}" stroke-width="1.2"/>`; }
  for (const f of [0.5, 0.85]) s += `<polygon points="${pts(corners.map(([px, py]) => PR_(px, py, (h + 0.6) * f)))}" fill="none" stroke="${col}" stroke-width="1"/>`;
  return s;
}

function buildingSVG(task, slot) {
  const lit = litFor(task);
  const items = [];
  for (const p of slot.parts(lit)) {
    const svg = p.box ? boxSVG(p.box, p.mat, { win: p.win, stripe: p.stripe }) : cylSVG(...p.cyl, { bands: p.bands });
    const z = p.box ? p.box.z || 0 : p.cyl[3];
    const [cx, cy] = p.box ? [p.box.x + p.box.w / 2, p.box.y + p.box.d / 2] : [p.cyl[0], p.cyl[1]];
    items.push({ z, depth: depthOf(cx, cy), svg, role: p.role });
  }
  const crane = underway(task) && slot.crane;
  if (crane) items.push({ z: 0, depth: depthOf(...slot.crane.at), svg: "", role: "crane" });
  items.sort((p, q) => p.z - q.z || p.depth - q.depth);
  let body = "";
  let cutDone = false;
  for (const it of items) {
    if (it.role === "shell" && !cutDone) { body += `<g class="cut">${cutawaySVG(task, slot)}</g>`; cutDone = true; }
    if (it.role === "crane") { body += `<g class="upper" id="crane">${craneSVG(slot.crane)}</g>`; continue; }
    body += `<g class="${it.role === "shell" ? "shell" : it.role === "upper" ? "upper" : "keep"}">${it.svg}</g>`;
  }
  if (underway(task)) body += `<g class="upper">${scaffoldSVG(slot.hollow)}</g>`;
  return `<g class="lift">${body}${roofSignals(task, slot)}</g>`;
}

/* A crate is a pull request: green for its additions' share, red for its deletions', split across its width. */
function crateSVG(c) {
  const { x, y, e } = c;
  const b = { x: x - e / 2, y: y - e / 2, w: e, d: e };
  let s = "";
  if (c.unknown) {
    s += boxSVG({ ...b, z: 0, h: e }, "unknown", { edge: `stroke="${css("--text-tertiary")}" stroke-width="0.9" stroke-dasharray="2.5 2"` });
    const [qx, qy] = PR_(x, y, e);
    s += `<text x="${qx}" y="${qy + 3}" text-anchor="middle" font-size="8" font-weight="800" fill="${css("--text-secondary")}">?</text>`;
  } else {
    /* A pallet under it, then the two shares. */
    s += boxSVG({ x: b.x - 0.05, y: b.y - 0.05, w: e + 0.1, d: e + 0.1, z: 0, h: 0.06 }, "crate");
    const wa = (e * c.pr.additions) / linesOf(c.pr);
    if (wa > 0) s += boxSVG({ x: b.x, y: b.y, w: wa, d: e, z: 0.06, h: e }, css("--state-complete"));
    if (e - wa > 0) s += boxSVG({ x: b.x + wa, y: b.y, w: e - wa, d: e, z: 0.06, h: e }, css("--danger"));
  }
  const t = turnBox({ ...b, z: 0, h: e });
  const outline = hull([[t.x0, t.y0, 0], [t.x1, t.y0, 0], [t.x1, t.y1, 0], [t.x0, t.y1, 0], [t.x0, t.y0, e + 0.06], [t.x1, t.y0, e + 0.06], [t.x1, t.y1, e + 0.06], [t.x0, t.y1, e + 0.06]].map(([a, bb, z]) => P(a, bb, z)));
  const taskId = c.unknown ? c.taskId : c.pr.taskId;
  const name = c.unknown
    ? `A pull request of ${byId[taskId].name} its summary doesn't name: state and size unknown`
    : `Pull request #${c.pr.number}, ${c.pr.title}: ${c.pr.additions} additions, ${c.pr.deletions} deletions`;
  const key = c.unknown ? `u-${taskId}-${c.k}` : String(c.pr.number);
  return `<g class="crate" data-crate="${key}" data-task="${taskId}" data-where="${c.where}" tabindex="0" role="button" aria-label="${name}">${s}<polygon class="crate-edge" points="${pts(outline)}"/></g>`;
}
function laneLampSVG(lane) {
  const [gx, gy] = PR_(YARD.x + 0.35, lane.y + LANE_D / 2, 0);
  const [px, py] = PR_(YARD.x + 0.35, lane.y + LANE_D / 2, 0.85);
  const has = awaiting().some((p) => p.checks === lane.checks);
  const col = has ? css(lane.tone) : C().unlit;
  return `<line x1="${gx}" y1="${gy}" x2="${px}" y2="${py}" stroke="${C().metal}" stroke-width="1.6"/><circle class="${has && lane.checks === CHECKS.PENDING ? "loop pulse" : ""}" cx="${px}" cy="${py}" r="3.6" fill="${col}" ${has ? 'filter="url(#glow)"' : ""}/>`;
}
function gateSVG() {
  const c = C();
  let s = boxSVG({ ...GATEHOUSE, z: 0, h: 1 }, "wall", { win: { rows: 1, per: 1.4, lit: theme === "dark" ? c.lamp : null, ratio: 1, opacity: 0.6, seed: 4 } });
  s += boxSVG({ x: GATEHOUSE.x - 0.08, y: GATEHOUSE.y - 0.08, w: GATEHOUSE.w + 0.16, d: GATEHOUSE.d + 0.16, z: 1, h: 0.1 }, "roof");
  /* The barrier is down: merging happens on GitHub, not here. */
  const [ax, ay] = PR_(BARRIER.x, BARRIER.y, 0.62), [bx, by] = PR_(BARRIER.x, BARRIER.y + BARRIER.d, 0.62);
  const [px, py] = PR_(BARRIER.x, BARRIER.y, 0);
  s += `<line x1="${px}" y1="${py}" x2="${ax}" y2="${ay}" stroke="${c.metal}" stroke-width="2.2"/>`;
  s += `<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="${c.barrier}" stroke-width="3" stroke-linecap="round"/><line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="${css("--danger")}" stroke-width="3" stroke-dasharray="6 6"/>`;
  return s;
}
function lotFlagSVG() {
  const [px, py] = PR_(LOT.x + LOT.w - 0.4, LOT.y + 0.4, 0);
  return `<line x1="${px}" y1="${py}" x2="${px}" y2="${py - 46}" stroke="${C().metal}" stroke-width="1.6"/><path class="loop flag" d="M${px},${py - 46} l20,4 l-20,7 Z" fill="${css("--state-merged")}"/>`;
}

function renderObjects() {
  const list = [];
  for (const { task, slot } of placed()) {
    const [x, y, w, d] = slot.plot;
    const label = `${task.name}: ${statusLine(task)}`;
    list.push({ depth: depthOf(x + w / 2, y + d / 2), svg: `<g class="bldg" data-id="${task.id}" tabindex="0" role="button" aria-label="${label}" ${openId === task.id ? "data-open" : ""}>${buildingSVG(task, slot)}</g>` });
  }
  for (const c of cratePositions()) list.push({ depth: depthOf(c.x, c.y), svg: crateSVG(c) });
  for (const [x, y] of TREES) list.push({ depth: depthOf(x, y), svg: treeSVG(x, y) });
  for (const [x, y] of LAMPS) list.push({ depth: depthOf(x, y), svg: lampSVG(x, y) });
  for (const lane of LANES) list.push({ depth: depthOf(YARD.x + 0.35, lane.y + LANE_D / 2), svg: laneLampSVG(lane) });
  list.push({ depth: depthOf(GATEHOUSE.x + 0.4, GATEHOUSE.y + 0.4), svg: gateSVG() });
  list.push({ depth: depthOf(LOT.x + LOT.w - 0.4, LOT.y + 0.4), svg: lotFlagSVG() });
  list.sort((a, b) => a.depth - b.depth);
  $("layer-objects").innerHTML = list.map((i) => `<g data-depth="${i.depth.toFixed(3)}">${i.svg}</g>`).join("") + avatarSVG();
  placeAvatar(true);
}
function statusLine(t) {
  if (asking(t)) return "asked you a question";
  if (failed(t)) return "an agent failed";
  if (t.id === callTaskId) return "on this Mac's call";
  if (underway(t)) return "going up";
  if (running(t)) return "at work";
  if (shippedAll(t)) return "shipped";
  if (t.pullRequests.named.some((p) => p.state === PR.OPEN)) return "at the gate";
  return "quiet";
}

/* Names: one line, the state's dot, over each roof. */

/* ------------------------------------------------------------------------
   Luke, walking. Arrow keys move him while the campus holds the keyboard;

/* Where he may stand: on the campus or the shipped lot, clear of every building, crate, tree, and the barrier. */
function obstacles() {
  const list = [];
  for (const { task, slot } of placed()) {
    const hb = slot.hollow;
    list.push({ x: hb.x - 0.1, y: hb.y - 0.1, w: hb.w + 0.2, d: hb.d + 0.2 });
    for (const p of slot.parts(litFor(task))) if (p.cyl && p.solid) list.push({ x: p.cyl[0] - p.cyl[2], y: p.cyl[1] - p.cyl[2], w: p.cyl[2] * 2, d: p.cyl[2] * 2 });
    if (underway(task) && slot.crane) list.push({ x: slot.crane.at[0] - 0.15, y: slot.crane.at[1] - 0.15, w: 0.3, d: 0.3 });
  }
  for (const c of cratePositions()) list.push({ x: c.x - c.e / 2 - 0.05, y: c.y - c.e / 2 - 0.05, w: c.e + 0.1, d: c.e + 0.1 });
  for (const [x, y] of TREES) list.push({ x: x - 0.2, y: y - 0.2, w: 0.4, d: 0.4 });
  list.push(GATEHOUSE, BARRIER);

}
let OBST = [];
function walkable(x, y) {
  const onCampus = x > RADIUS && x < N - RADIUS && y > RADIUS && y < N - RADIUS;

  if (!onCampus && !onLot) return false;

}
function stepTo(nx, ny) {

  if (walkable(nx, avatar.y)) { avatar.x = nx; return true; }
  if (walkable(avatar.x, ny)) { avatar.y = ny; return true; }
  return false;
}
/* A screen direction, turned back into the campus's own axes. */
function worldDir(sx, sy) {
  /* Up the screen is −x −y in the turned view; right is +x −y. */
  let vx = (sx + sy) / Math.SQRT2, vy = (sy - sx) / Math.SQRT2;
  for (let i = 0; i < rot; i++) [vx, vy] = [vy, -vx];

}
/* What he is next to, nearest first: a crate, then a plot, then a yard. */
function nearWhat() {
  let best = null, bd = 0.75;

    const d = Math.hypot(c.x - avatar.x, c.y - avatar.y) - c.e / 2;
    if (d < bd) { bd = d; best = c.unknown ? { kind: "task", id: c.taskId } : { kind: "crate", id: c.pr.taskId, pr: c.pr.number }; }
  }
  if (best) return best;
  for (const { task, slot } of placed()) {
    const [x, y, w, d] = slot.plot;
    if (avatar.x > x && avatar.x < x + w && avatar.y > y && avatar.y < y + d) return { kind: "task", id: task.id };
  }
  const inside = (r) => avatar.x > r.x && avatar.x < r.x + r.w && avatar.y > r.y && avatar.y < r.y + r.d;
  if (inside(YARD)) return { kind: "gate", id: "gate" };

}
function arrive() {

  if (key === nearId) return;
  nearId = key;
  if (what) {
    openDetails(what.id, what.pr, "walk");
    $("arrival").textContent = `Next to ${what.kind === "gate" ? "the merge gate" : what.kind === "shipped" ? "the shipped lot" : byId[what.id].name}. Its details are open.`;
  } else if (openSource === "walk") {

/* The roads he wanders when left alone. */
const ROAD = { nodes: [[0.6, 10], [5, 10], [10, 10], [14.5, 10], [19.2, 10], [10, 0.6], [10, 5], [10, 15], [10, 19.4], [21.2, 10.8], [23.6, 10.8]], edges: [[0, 1], [1, 2], [2, 3], [3, 4], [5, 6], [6, 2], [2, 7], [7, 8], [9, 10]] };

}

const reduced = matchMedia("(prefers-reduced-motion: reduce)");

function keepInView() {

  const m = 90;
  let dx = 0, dy = 0;

  if (y < m) dy = m - y; else if (y > st.height - m - 40) dy = st.height - m - 40 - y;

/* ------------------------------------------------------------------------

const cam = { x: 0, y: 0, s: 1 };
let lastSize = null;
function sceneBounds() {

  const xs = corners.map((c) => c[0]), ys = corners.map((c) => c[1]);

}
function applyCamera(instant) {

}

/* ------------------------------------------------------------------------

function syncMarks() {

    p.toggleAttribute("data-focus", focusTask === id);

  for (const g of document.querySelectorAll(".bldg")) g.toggleAttribute("data-open", g.dataset.id === openId);
  for (const y of document.querySelectorAll(".yard-hit")) y.toggleAttribute("data-open", y.dataset.yard === openId);
  for (const c of document.querySelectorAll(".crate")) {
    c.toggleAttribute("data-mine", c.dataset.task === openId || (openId === "gate" && c.dataset.where === "gate") || (openId === "shipped" && c.dataset.where === "shipped"));
    c.toggleAttribute("data-hot", !!hotPR && c.dataset.crate === String(hotPR.number));

  for (const t of document.querySelectorAll(".tag")) {

      h += `<div class="row" ${n()}><span class="actor">${claudeMark()}</span><span class="grow">${a.model} <span class="sub">· ${a.effort}</span></span><span class="meta" style="${tone ? `color:var(${tone})` : ""}">${agentWord(a)}${a.at ? ` · ${ago(a.at)}` : ""}</span></div>`;
    }
    if (unnamedAgents(t)) h += `<div class="row" data-unknown ${n()}><span class="actor" data-unknown>+${unnamedAgents(t)}</span><span class="grow">${unnamedAgents(t)} more not named in the summary</span></div>`;
    h += `<div class="insp-section" ${n()}>Pull requests <span class="count">${t.pullRequests.total}</span></div>`;
    if (!t.pullRequests.total) h += `<div class="row" data-unknown ${n()}>None yet</div>`;
    h += t.pullRequests.named.map((p) => prRow(p, "", n)).join("");
    if (unnamedPRs(t)) h += `<div class="row" data-unknown ${n()}><span class="actor" data-unknown>?</span><span class="grow">${unnamedPRs(t)} more not named in the summary · state and size unknown</span></div>`;
    h += `<div class="insp-actions" ${n()}><button type="button" class="toolbar-button" style="--button-fill:var(--raised-strong)" id="open-task">${glyph("open")}Open task</button></div>`;
  }
  $("inspector-body").innerHTML = h;
}

let toastTimer = 0;
function toast(html) {
  const t = $("toast");
  t.innerHTML = html;
  t.removeAttribute("data-hidden");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.setAttribute("data-hidden", ""), 2600);
}
function answer(itemId, choice) {
  const k = INBOX.findIndex((i) => i.id === itemId);
  if (k < 0) return;
  const item = INBOX[k];
  INBOX.splice(k, 1);
  /* A reply hands the agent a message, so its turn starts again. */
  const t = byId[item.taskId];
  const agent = t.agents.named.find((a) => a.id === item.agentId);
  if (agent) { agent.status = AGENT.RUNNING; agent.at = NOW; t.agents.working += 1; }
  toast(`${glyph("check")}Replied “${choice}”`);
  refreshAll();
}
function refreshAll() {
  renderAll(); renderSidebar(); renderCensus(); renderKey();
  OBST = obstacles();
  if (openId) renderInspector();
  applyCamera(true);
}

function renderSidebar() {
  $("task-list").innerHTML = TASKS.slice().sort((a, b) => b.createdAt - a.createdAt).map((t) =>
    `<button type="button" class="task-row" data-id="${t.id}" aria-current="${openId === t.id}"><span class="dot" style="--tone:var(${taskTone(t)})"></span><span class="name">${t.name}</span></button>`).join("");
}
function renderCensus() {
  const q = INBOX.length, r = readyPRs().length;
  const btn = $("needs-you");
  btn.hidden = q + r === 0;
  btn.innerHTML = `<span class="attention-mark">!</span>${[q ? `${q} question${q > 1 ? "s" : ""}` : "", r ? `${r} ready to merge` : ""].filter(Boolean).join(" · ")}`;
  $("inbox-count").textContent = q || "";
}
function renderKey() {
  const k = (svg, html) => `<div class="key-row"><svg viewBox="-11 -9 22 18" aria-hidden="true">${svg}</svg><span>${html}</span></div>`;
  $("key").innerHTML =
    k(`<rect x="-8" y="-6" width="5" height="5" rx="1" fill="${css("--state-working")}"/><rect x="-1" y="-6" width="5" height="5" rx="1" fill="${css("--state-working")}"/><circle cx="7" cy="-4" r="2.5" fill="${css("--text-tertiary")}"/>`, "<b>Lit windows, smoke</b>: an agent at work") +
    k(`<circle r="4" fill="${css("--state-attention")}"/><circle r="8" fill="none" stroke="${css("--state-attention")}" stroke-width="1.5" opacity="0.6"/>`, "<b>Beacon</b>: a question in the Inbox") +
    k(`<ellipse rx="9" ry="4.5" fill="none" stroke="${css("--voice-developer")}" stroke-width="1.5"/>`, "<b>Rings</b>: on this Mac's call") +
    k(`<line x1="0" y1="8" x2="0" y2="-7" stroke="#e0b42e" stroke-width="2"/><line x1="-8" y1="-7" x2="9" y2="-7" stroke="#e0b42e" stroke-width="2"/>`, "<b>Crane</b>: at work, no pull request yet") +
    k(`<line x1="-4" y1="8" x2="-4" y2="-8" stroke="${css("--text-secondary")}" stroke-width="1.5"/><path d="M-4,-8 l11,3 l-11,4 Z" fill="${css("--state-merged")}"/>`, "<b>Flag</b>: every pull request it names, merged") +
    k(`<rect x="-7" y="-7" width="10" height="14" fill="${css("--state-complete")}"/><rect x="3" y="-7" width="4" height="14" fill="${css("--danger")}"/>`, "<b>Crate</b>: a pull request. Volume is lines changed, <b>not linear</b> (edge ∝ ∛lines); green and red are the shares") +
    k(`<rect x="-6" y="-6" width="12" height="12" fill="none" stroke="${css("--text-tertiary")}" stroke-dasharray="2.5 2"/>`, "<b>Dashed crate</b>: not named, size unknown") +
    k(`<circle cx="-5" r="3" fill="${css("--danger")}"/><circle cx="1" r="3" fill="${css("--state-attention")}"/><circle cx="7" r="3" fill="${css("--state-complete")}"/>`, "<b>Gate lanes</b>: checks failing, running, ready. Not a merge queue");
}

function showCrateCard(el) {
  const card = $("crate-card");
  const key = el.dataset.crate;
  const stage = $("stage").getBoundingClientRect();
  const r = el.getBoundingClientRect();
  let html;
  if (key.startsWith("u-")) {
    const t = byId[el.dataset.task];
    html = `<div class="title">Not named in the summary</div><div class="line">${t.name} counts ${t.pullRequests.total}, names ${t.pullRequests.named.length}.</div><div class="line">State and size unknown.</div>`;
  } else {
    const p = allPRs().find((q) => String(q.number) === key);
    const [word, tone] = prChip(p);
    html = `<div class="title">#${p.number} ${p.title}</div><div class="line"><span class="diffstat"><span class="add">+${p.additions}</span> <span class="del">−${p.deletions}</span></span> · ${linesOf(p)} lines</div><div class="line"><span class="chip" style="--tone:var(${tone})">${word}</span> · ${byId[p.taskId].name}</div>`;
  }
  card.innerHTML = html;
  card.removeAttribute("data-hidden");
  const w = card.offsetWidth;
  card.style.left = `${Math.max(8, Math.min(stage.width - w - 8, r.left - stage.left + r.width / 2 - w / 2))}px`;
  card.style.top = `${Math.max(8, r.top - stage.top - card.offsetHeight - 10)}px`;
}
function hideCrateCard() { $("crate-card").setAttribute("data-hidden", ""); }

/* ------------------------------------------------------------------------
   Wiring.
   ------------------------------------------------------------------------ */
function setTheme(t) {
  theme = t;
  document.documentElement.dataset.theme = t;
  for (const b of document.querySelectorAll("[data-theme-choice]")) b.setAttribute("aria-pressed", String(b.dataset.themeChoice === t));
  renderAll(); renderKey(); renderSidebar(); applyCamera(true);
}
for (const b of document.querySelectorAll("[data-theme-choice]")) b.addEventListener("click", () => setTheme(b.dataset.themeChoice));

const scene = $("scene");
const stage = $("stage");
/* The campus takes the keyboard as one stop, so the arrows can walk Luke. */
stage.tabIndex = 0;
function activate(target) {
  const crate = target.closest(".crate");
  if (crate) { select(crate.dataset.task, Number(crate.dataset.crate) || undefined); return true; }
  const g = target.closest(".bldg");
  if (g) { select(g.dataset.id); return true; }
  const yard = target.closest(".yard-hit");
  if (yard) { select(yard.dataset.yard); return true; }
  if (target.closest("#new-plot")) { toast(`${glyph("plus")}A new task takes the next plot`); return true; }
  return false;
}
scene.addEventListener("click", (e) => {
  if (dragMoved) return;
  if (!activate(e.target) && openId) closeDetails(true);
});
scene.addEventListener("pointerover", (e) => {
  const crate = e.target.closest(".crate");
  const g = e.target.closest(".bldg");
  const task = crate ? crate.dataset.task : g ? g.dataset.id : null;
  const pr = crate && !crate.dataset.crate.startsWith("u-") ? allPRs().find((q) => String(q.number) === crate.dataset.crate) : null;
  if (crate) showCrateCard(crate); else hideCrateCard();
  if (task !== hoverTask || pr?.number !== hotPR?.number) { hoverTask = task; if (!shownPR) hotPR = pr; syncMarks(); }
});
scene.addEventListener("pointerleave", () => { hideCrateCard(); hoverTask = null; if (!shownPR) hotPR = null; syncMarks(); });
scene.addEventListener("focusin", (e) => {
  const g = e.target.closest(".bldg");
  focusTask = g?.matches(":focus-visible") ? g.dataset.id : null;
  const crate = e.target.closest(".crate");
  if (crate?.matches(":focus-visible")) showCrateCard(crate);
  syncMarks();
});
scene.addEventListener("focusout", () => { focusTask = null; hideCrateCard(); syncMarks(); });

/* The arrow keys walk Luke while the campus holds focus, and only there:
   the map's controls, the pane, and the page keep their own keys, and Tab
   always leaves. */
stage.addEventListener("keydown", (e) => {
  if (e.target.closest(".map-controls, .key, .toast")) return;
  if (DIRS[e.key] && !e.metaKey && !e.ctrlKey && !e.altKey) { e.preventDefault(); held.add(e.key); return; }
  if ((e.key === "Enter" || e.key === " ") && e.target !== stage && activate(e.target)) e.preventDefault();
});
window.addEventListener("keyup", (e) => { held.delete(e.key); });
/* Walking stops the moment the keyboard goes anywhere the arrows don't walk. */
stage.addEventListener("focusout", (e) => { if (!stage.contains(e.relatedTarget) || e.relatedTarget.closest(".map-controls, .key, .toast")) held.clear(); });
window.addEventListener("blur", () => held.clear());
document.addEventListener("visibilitychange", () => { held.clear(); lastManual = performance.now(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && openId) { closeDetails(openSource === "click"); nearId = null; }
  if (e.key === "r" && !e.metaKey && !e.target.closest("input, textarea")) turn();
});
$("task-list").addEventListener("click", (e) => { const r = e.target.closest(".task-row"); if (r) select(r.dataset.id); });
$("inspector").addEventListener("click", (e) => {
  if (e.target.closest("#insp-close")) { closeDetails(openSource === "click"); nearId = null; }
  const a = e.target.closest("[data-answer]");
  if (a) answer(a.dataset.item, a.dataset.answer);
  if (e.target.closest("#open-task")) toast(`${glyph("open")}Opens the task`);
});
$("needs-you").addEventListener("click", () => {
  const list = [...new Set([...INBOX.map((i) => i.taskId), ...readyPRs().map((p) => p.taskId)])];
  if (!list.length) return;
  const next = list[(list.indexOf(openId) + 1) % list.length];
  select(next, readyPRs().find((p) => p.taskId === next)?.number);
});
$("zoom-in").addEventListener("click", () => { zoomBy(1.3); applyCamera(false); });
$("zoom-out").addEventListener("click", () => { zoomBy(1 / 1.3); applyCamera(false); });
$("fit").addEventListener("click", () => { if (openId) closeDetails(true); else fitCampus(false); });
function turn() {
  rot = (rot + 1) % 4;
  renderAll();
  fitCampus(true);
}
$("rotate").addEventListener("click", turn);
$("key-toggle").addEventListener("click", () => {
  const shown = $("key").hasAttribute("data-hidden");
  $("key").toggleAttribute("data-hidden", !shown);
  $("key-toggle").setAttribute("aria-pressed", String(shown));
});

let drag = null, dragMoved = false;
stage.addEventListener("pointerdown", (e) => {
  if (e.target.closest(".map-controls, .key, .toast")) return;
  /* A press on the campus gives it the keyboard, so the arrows walk at once. */
  if (!e.target.closest(".bldg, .crate, .yard-hit, #new-plot")) stage.focus({ preventScroll: true });
  drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y };
  dragMoved = false;
});
window.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!dragMoved && Math.hypot(dx, dy) < 4) return;
  dragMoved = true;
  hideCrateCard();
  stage.setAttribute("data-dragging", "");
  cam.x = drag.cx + dx; cam.y = drag.cy + dy;
  applyCamera(true);
});
window.addEventListener("pointerup", () => { drag = null; stage.removeAttribute("data-dragging"); setTimeout(() => { dragMoved = false; }, 0); });
stage.addEventListener("wheel", (e) => {
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  zoomBy(Math.exp(-e.deltaY * 0.0022), e.clientX - r.left, e.clientY - r.top);
  hideCrateCard();
  applyCamera(true);
}, { passive: false });
/* When the pane opens or the window changes size, the campus keeps its middle where it was. */
new ResizeObserver(() => {
  const st = stage.getBoundingClientRect();
  if (!lastSize) { lastSize = st; fitCampus(true); return; }
  cam.x += (st.width - lastSize.width) / 2;
  cam.y += (st.height - lastSize.height) / 2;
  lastSize = st;
  applyCamera(true);
}).observe(stage);

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  tickAvatar(now, dt);
  if (!reduced.matches && !document.hidden) {
    craneAngle += dt * 0.18;
    const cr = $("crane");
    const spot = placed().find((p) => underway(p.task) && p.slot.crane);
    if (cr && spot) cr.innerHTML = craneSVG(spot.slot.crane);
  }
  requestAnimationFrame(frame);
}

/* A link may name a frame; each value is matched to one of the page's own. */
const params = new URLSearchParams(location.search);
const themeParam = params.get("theme");
const initialTheme = themeParam === "light" ? "light" : themeParam === "dark" ? "dark" : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
const openParam = [...TASKS.map((t) => t.id), "gate", "shipped"].find((id) => id === params.get("open"));
const rotParam = ["1", "2", "3"].indexOf(params.get("rot")) + 1;
renderSidebar();
renderCensus();
setTheme(initialTheme);
OBST = obstacles();
for (let i = 0; i < rotParam; i++) turn();
fitCampus(true);
if (openParam) select(openParam);
requestAnimationFrame(frame);
</script>
</body>
</html>
