<!doctype html>
<!-- Factory as a campus of buildings: a design exploration, not a feature. One self-contained page that fetches nothing; every task, agent, Inbox item, and pull request on it is illustrative, shaped as the fields the window already holds. Open it in a browser. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luke · Factory as a campus (design exploration)</title>
<style>
/* Tokens, copied from the renderer's base.css, desktop.css, and the generated
   motion tokens so the mockup wears the app's own ground, ink, and timing. */
:root {
  color-scheme: dark;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
  font-synthesis: none;
  -webkit-font-smoothing: antialiased;
  --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  --spring: linear(0, 0.0285, 0.0993, 0.1943, 0.3005, 0.4083, 0.5115, 0.6061, 0.69, 0.7623, 0.8229, 0.8727, 0.9125, 0.9437, 0.9674, 0.9848, 0.9972, 1.0056, 1.0109, 1.0138, 1.015, 1.015, 1.0142, 1.0129, 1.0114, 1.0098, 1);
  --duration-fast: 280ms;
  --motion-exit: cubic-bezier(0.4, 0, 0.6, 1);
  --duration-shape: 460ms;
  --duration-exit: 90ms;
  --duration-quick: 140ms;
  --duration-hover: 70ms;
  --duration-pane: 240ms;
  --motion-pane: cubic-bezier(0.2, 0, 0, 1);
  --row-stagger: 32ms;
  --loop-motion: running;

  --space-2: 2px; --space-4: 4px; --space-6: 6px; --space-8: 8px; --space-12: 12px;
  --space-16: 16px; --space-20: 20px; --space-24: 24px; --space-32: 32px; --space-40: 40px;
  --column-inset: var(--space-12);
  --row-inset: var(--space-8);
  --content-inset: calc(var(--column-inset) + var(--row-inset));
  --glyph-gap: var(--space-8);
  --control-gap: var(--space-8);
  --list-gap: var(--space-2);
  --section-gap: var(--space-16);
  --control-height: 30px;
  --control-radius: 8px;
  --control-glyph: 15px;
  --menu-inset: var(--space-4);
  --menu-row-height: 32px;
  --menu-row-radius: 6px;
  --menu-radius: calc(var(--menu-row-radius) + var(--menu-inset));
  --sidebar-width: 264px;
  --desktop-bar-height: 51px;
  --focus-ring-width: 2px;
  --focus-ring-offset: 1px;
}

/* Dark, the default; data-theme on <html> takes a choice from the page's own switch. */
:root, :root[data-theme="dark"] {
  color-scheme: dark;
  --state-working: #5cd5ff;
  --state-attention: #ffa049;
  --state-complete: #6fdca4;
  --state-merged: #c3a0ff;
  --voice-developer: #7fe0ac;
  --message-sent: #0071e3;
  --danger: #ff7e7e;
  --text-primary: rgba(255, 255, 255, 0.95);
  --text-secondary: rgba(255, 255, 255, 0.56);
  --text-tertiary: rgba(255, 255, 255, 0.5);
  --text-body: rgba(255, 255, 255, 0.86);
  --raised: rgba(255, 255, 255, 0.05);
  --raised-strong: rgba(255, 255, 255, 0.09);
  --selected: rgba(255, 255, 255, 0.2);
  --pressed: rgba(255, 255, 255, 0.26);
  --hairline: rgba(255, 255, 255, 0.08);
  --hairline-strong: rgba(255, 255, 255, 0.12);
  --on-accent: #fff;
  --shadow: rgba(0, 0, 0, 0.5);
  --shadow-deep: rgba(0, 0, 0, 0.6);
  --section-fill: rgba(255, 255, 255, 0.022);
  --desktop-ground: #0c0c0e;
  --desktop-sidebar: #111114;
  --desktop-well: #0f0f12;
  --sidebar-ink: rgba(255, 255, 255, 0.7);
  --surface-popover: #111114;
  --attention-mark-ground: #c4620c;
  --workspace-hue-1: #4f63b8;
  --actor-tile: #2a2a30;
  --focus-ring: var(--message-sent);
  --page-ground: #050506;
  --page-ink: rgba(255, 255, 255, 0.6);
  --stage-sky: radial-gradient(120% 90% at 50% 30%, #15161c 0%, #0c0c0e 70%);
  --label-ground: rgba(17, 17, 20, 0.92);
}

:root[data-theme="light"] {
  color-scheme: light;
  --state-working: #0a72a8;
  --state-attention: #a65400;
  --state-complete: #18794e;
  --state-merged: #8250df;
  --voice-developer: #17784a;
  --danger: #e0383e;
  --text-primary: rgba(0, 0, 0, 0.88);
  --text-secondary: rgba(0, 0, 0, 0.6);
  --text-tertiary: rgba(0, 0, 0, 0.56);
  --text-body: rgba(0, 0, 0, 0.8);
  --raised: rgba(0, 0, 0, 0.035);
  --raised-strong: rgba(0, 0, 0, 0.06);
  --selected: rgba(0, 0, 0, 0.07);
  --pressed: rgba(0, 0, 0, 0.11);
  --hairline: rgba(0, 0, 0, 0.08);
  --hairline-strong: rgba(0, 0, 0, 0.1);
  --shadow: rgba(0, 0, 0, 0.12);
  --shadow-deep: rgba(0, 0, 0, 0.2);
  --section-fill: #fff;
  --desktop-ground: #fcfcfc;
  --desktop-sidebar: #f3f3f4;
  --desktop-well: #f8f8f9;
  --sidebar-ink: rgba(0, 0, 0, 0.68);
  --surface-popover: #fff;
  --attention-mark-ground: #a65400;
  --workspace-hue-1: #4a5fc0;
  --actor-tile: #e8e8ec;
  --page-ground: #e4e4e8;
  --page-ink: rgba(0, 0, 0, 0.6);
  --stage-sky: radial-gradient(120% 90% at 50% 30%, #ffffff 0%, #f4f4f6 70%);
  --label-ground: rgba(255, 255, 255, 0.94);
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --loop-motion: paused;
    --duration-fast: 0ms; --duration-shape: 0ms; --duration-exit: 0ms;
    --duration-quick: 0ms; --duration-hover: 0ms; --duration-pane: 0ms; --row-stagger: 0ms;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  display: flex;
  flex-direction: column;
  background: var(--page-ground);
  color: var(--text-primary);
  font-size: 13px;
  overflow: hidden;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: default; }
svg.glyph { width: 15px; height: 15px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
:focus { outline: none; }
:focus-visible { outline: var(--focus-ring-width) solid var(--focus-ring); outline-offset: var(--focus-ring-offset); }

/* The page around the mockup: what this is, and the appearance switch. */
.show-head {
  display: flex;
  align-items: center;
  gap: var(--space-16);
  padding: var(--space-12) var(--space-24);
  color: var(--page-ink);
  font-size: 12px;
}
.show-head strong { color: var(--text-primary); font-weight: 600; font-size: 13px; }
.show-chip {
  padding: var(--space-2) var(--space-8);
  border: 1px solid var(--hairline-strong);
  border-radius: 999px;
  color: var(--text-secondary);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.02em;
}
.show-chip[data-tone="illustrative"] { color: var(--state-attention); border-color: currentColor; }
.show-head .spacer { flex: 1; }
.sim-label { color: var(--page-ink); font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.sim-label span { color: var(--text-tertiary); font-weight: 500; }
.segmented {
  display: inline-flex;
  margin: 0;
  border: 0;
  padding: var(--space-2);
  border-radius: var(--control-radius);
  background: var(--raised-strong);
}
.segmented button {
  height: 24px;
  padding: 0 var(--space-12);
  border-radius: 6px;
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 600;
}
.segmented button[aria-pressed="true"] { background: var(--desktop-ground); color: var(--text-primary); box-shadow: 0 1px 2px var(--shadow); }

/* The window. */
.window-wrap { flex: 1; min-height: 0; display: flex; padding: 0 var(--space-24) var(--space-24); }
.window {
  position: relative;
  flex: 1;
  min-width: 0;
  display: grid;
  grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
  border: 1px solid var(--hairline-strong);
  border-radius: 12px;
  overflow: clip;
  background: var(--desktop-ground);
  box-shadow: 0 24px 64px var(--shadow-deep);
}
.traffic { position: absolute; top: 18px; left: 18px; display: flex; gap: 8px; z-index: 5; }
.traffic i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; }
.traffic i:nth-child(2) { background: #febc2e; }
.traffic i:nth-child(3) { background: #28c840; }

/* Sidebar, drawn as desktop-sidebar.tsx draws it. */
.sidebar {
  display: flex;
  min-height: 0;
  flex-direction: column;
  padding: 0 var(--column-inset) var(--column-inset);
  border-right: 1px solid var(--hairline);
  background: var(--desktop-sidebar);
}
.sidebar-top { height: var(--desktop-bar-height); display: flex; align-items: center; justify-content: flex-end; gap: var(--space-2); }
.sidebar-top .icon-button { color: var(--text-tertiary); }
.switcher {
  display: flex; align-items: center; gap: var(--glyph-gap);
  height: 36px; padding: 0 var(--row-inset); margin-bottom: var(--space-8);
  border-radius: 9px; font-size: 14px; font-weight: 650; letter-spacing: -0.01em;
}
.switcher:hover { background: var(--raised); }
.workspace-tile {
  display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 4px;
  background: var(--workspace-hue-1); color: #fff; font-size: 10px; font-weight: 650;
}
.switcher .chev { margin-left: auto; color: var(--text-tertiary); }
.side-row {
  display: flex; align-items: center; gap: var(--glyph-gap);
  height: var(--control-height); margin: 0 0 var(--list-gap); padding: 0 var(--row-inset);
  border-radius: 9px; color: var(--sidebar-ink); font-size: 13px; text-align: left; width: 100%;
  transition: background-color var(--duration-hover) ease, color var(--duration-hover) ease;
}
.side-row:hover { color: var(--text-primary); }
.side-row[aria-current="page"] { background: var(--raised-strong); color: var(--text-primary); }
.side-row .end { margin-left: auto; color: var(--text-tertiary); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.kbd { display: inline-flex; gap: 1px; color: var(--text-tertiary); font-size: 11.5px; }
.sidebar-rule { height: 1px; margin: var(--space-8) var(--row-inset); border: 0; background: var(--hairline); }
.section-head {
  display: flex; align-items: center; height: 28px; padding: 0 var(--row-inset);
  color: var(--text-tertiary); font-size: 11.5px; font-weight: 600;
}
.task-row {
  display: flex; align-items: center; gap: var(--glyph-gap);
  width: 100%; min-height: var(--control-height); padding: var(--space-6) var(--row-inset);
  border-radius: 9px; color: var(--sidebar-ink); text-align: left; font-size: 13px;
}
.task-row:hover { color: var(--text-primary); background: var(--raised); }
.task-row[aria-current="true"] { background: var(--raised-strong); color: var(--text-primary); }
.task-row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; background: var(--tone, var(--text-tertiary)); }
.dot[data-pulse] { box-shadow: 0 0 0 3px color-mix(in srgb, var(--tone) 25%, transparent); }
.sidebar-scroll { flex: 1; min-height: 0; overflow: auto; margin: 0 calc(-1 * var(--space-4)); padding: 0 var(--space-4); }
.sidebar-foot { padding-top: var(--space-8); border-top: 1px solid var(--hairline); }

/* The work column: a toolbar over the campus, and the inspector pane beside it. */
.main { display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; min-height: 0; }
.toolbar {
  display: flex; align-items: center; gap: var(--control-gap);
  min-height: var(--desktop-bar-height); padding: var(--space-8) var(--content-inset);
  border-bottom: 1px solid var(--hairline);
}
.toolbar-title { display: flex; align-items: center; gap: var(--glyph-gap); font-size: 13px; font-weight: 600; }
.toolbar-title .sub { color: var(--text-tertiary); font-weight: 500; }
.toolbar .spacer { flex: 1; }
.toolbar-button, .icon-button, .primary-button {
  --button-fill: transparent;
  display: inline-flex; align-items: center; justify-content: center; gap: var(--glyph-gap);
  height: var(--control-height); padding: 0 var(--space-12);
  border-radius: var(--control-radius); background: var(--button-fill);
  font-size: 12.5px; font-weight: 600; white-space: nowrap;
  transition: background-color var(--duration-hover) ease, color var(--duration-hover) ease, filter var(--duration-hover) ease;
}
.icon-button { width: var(--control-height); padding: 0; color: var(--text-secondary); }
.toolbar-button:hover, .icon-button:hover, .toolbar-button[aria-pressed="true"], .icon-button[aria-pressed="true"] { background: var(--selected); color: var(--text-primary); }
.toolbar-button:active, .icon-button:active { background: var(--pressed); }
.primary-button { --button-fill: var(--message-sent); color: var(--on-accent); }
.primary-button:hover { filter: brightness(1.1); }
.toolbar-button[data-tone="attention"] { color: var(--state-attention); }
.attention-mark {
  display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%;
  background: var(--attention-mark-ground); color: #fff; font-size: 11px; font-weight: 800; line-height: 1;
}

.work { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; min-height: 0; }
.stage {
  position: relative; min-width: 0; min-height: 0; overflow: clip;
  background: var(--stage-sky);
  touch-action: none;
}
.stage svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage[data-dragging] { cursor: grabbing; }
#camera { transform-origin: 0 0; transition: transform var(--duration-shape) var(--spring); }
.stage[data-dragging] #camera, #camera[data-instant] { transition: none; }

/* The campus. */
.bldg, .crate, .yard-hit { cursor: pointer; transition: opacity var(--duration-fast) ease; }
.bldg:focus-visible, .crate:focus-visible, .yard-hit:focus-visible { outline: none; } /* no ring: the plot's or the crate's own outline takes the ring's colour */
.scene[data-focused] .bldg:not([data-open]), .scene[data-focused] .crate:not([data-mine]) { opacity: 0.45; }
.bldg .lift { transition: transform var(--duration-hover) ease; }
.bldg:hover .lift { transform: translateY(-3px); }
.bldg .shell, .bldg .upper, .bldg .cut, .bldg .fx-roof { transition: opacity var(--duration-fast) ease, transform var(--duration-shape) var(--spring); }
.bldg .cut { opacity: 0; pointer-events: none; }
.bldg[data-open] .shell { opacity: 0; }
.bldg[data-open] .upper { opacity: 0; transform: translateY(-48px); }
.bldg[data-open] .fx-roof { opacity: 0; }
.bldg[data-open] .cut { opacity: 1; }
.plot-edge, .crate-edge, .yard-edge { fill: none; stroke: var(--text-primary); stroke-width: 1.4; opacity: 0; transition: opacity var(--duration-hover) ease; vector-effect: non-scaling-stroke; }
.plot[data-hover] .plot-edge, .crate:hover .crate-edge, .yard-hit:hover .yard-edge { opacity: 0.4; }
.plot[data-open] .plot-edge, .crate[data-hot] .crate-edge, .yard-hit[data-open] .yard-edge { opacity: 0.7; }
.plot[data-focus] .plot-edge, .crate:focus-visible .crate-edge, .yard-hit:focus-visible .yard-edge { opacity: 1; stroke: var(--focus-ring); stroke-width: 2; }
.new-plot { cursor: pointer; }
.new-plot .plot-dash { fill: none; stroke: var(--text-tertiary); stroke-width: 1.2; stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; }
.new-plot:hover .plot-dash { stroke: var(--text-primary); }
.new-plot:focus-visible { outline: none; } /* no ring: the dashed edge takes the ring's colour and weight */
.new-plot:focus-visible .plot-dash { stroke: var(--focus-ring); stroke-width: 2; }
.route { fill: none; stroke-width: 1.6; stroke-dasharray: 4 3; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.win-lit { filter: url(#glow); }
:root[data-theme="light"] .win-lit { filter: none; }

/* Loops, only while something is happening. Each answers --loop-motion. */
.loop { animation-play-state: var(--loop-motion); transform-box: fill-box; transform-origin: center; }
.smoke { animation: smoke 4.8s linear infinite; }
@keyframes smoke { 0% { transform: translate(0, 0) scale(0.5); opacity: 0; } 12% { opacity: 0.7; } 100% { transform: translate(-22px, -64px) scale(2.1); opacity: 0; } }
.beacon-ring { animation: beacon 1.6s ease-out infinite; }
@keyframes beacon { 0% { transform: scale(0.4); opacity: 0.9; } 100% { transform: scale(2.6); opacity: 0; } }
.pulse { animation: blink 1.6s ease-in-out infinite; }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
.wave { animation: wave 2.4s ease-out infinite; }
@keyframes wave { 0% { transform: scale(0.3); opacity: 0; } 15% { opacity: 0.9; } 100% { transform: scale(1.8); opacity: 0; } }
.flag { animation: flag 2.2s ease-in-out infinite; transform-origin: left center; }
@keyframes flag { 0%, 100% { transform: skewY(0deg) scaleX(1); } 50% { transform: skewY(-6deg) scaleX(0.92); } }
.bubble { animation: bob 2.8s ease-in-out infinite; }
/* One-shot arrivals for what just happened: a building rising, a container set down, a ring from a plot, sparks at a merge. */
.bldg[data-fresh="rise"] .lift { transform-box: fill-box; transform-origin: 50% 100%; animation: rise calc(var(--duration-shape) * 2) var(--spring) backwards; }
@keyframes rise { from { transform: scaleY(0.04); opacity: 0.2; } }
.crate[data-fresh="drop"] { animation: drop var(--duration-shape) var(--spring) backwards; }
@keyframes drop { from { transform: translateY(-26px); opacity: 0; } }
.ping { transform-box: fill-box; transform-origin: center; animation: ping calc(var(--duration-shape) * 2.6) ease-out forwards; pointer-events: none; }
@keyframes ping { from { transform: scale(0.5); opacity: 0.9; } to { transform: scale(1.4); opacity: 0; } }
.spark { animation: spark calc(var(--duration-shape) * 2.6) ease-out forwards; }
@keyframes spark { from { transform: translate(0, 0); opacity: 1; } to { transform: translate(var(--dx), var(--dy)); opacity: 0; } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

/* Names float over the campus at a constant size. */
.tag { pointer-events: none; transition: opacity var(--duration-quick) ease; }
.tag rect { fill: var(--label-ground); stroke: var(--hairline-strong); }
.tag text { font-size: 12px; font-weight: 500; fill: var(--text-primary); }
.tag[data-dim] { opacity: 0.3; }
.tag[data-hide] { opacity: 0; }
.agent-tag text { font-size: 7px; font-weight: 600; fill: var(--text-primary); }
.agent-tag rect { fill: var(--label-ground); stroke: var(--hairline-strong); }

/* What floats over the stage: the map's controls and its key, a crate's card, a notice. */
.map-controls {
  position: absolute; right: var(--space-16); top: var(--space-16);
  display: flex; flex-direction: column; gap: var(--space-2);
  padding: var(--space-4); border: 1px solid var(--hairline-strong); border-radius: var(--menu-radius);
  background: var(--surface-popover); box-shadow: 0 12px 32px var(--shadow);
}
.map-controls hr { width: 100%; height: 1px; margin: var(--space-2) 0; border: 0; background: var(--hairline); }
.key {
  position: absolute; right: 64px; top: var(--space-16); width: 250px;
  padding: var(--space-8) var(--space-4) var(--space-4);
  border: 1px solid var(--hairline-strong); border-radius: var(--menu-radius);
  background: var(--surface-popover); box-shadow: 0 12px 32px var(--shadow);
  transition: opacity var(--duration-quick) ease, transform var(--duration-shape) var(--spring);
}
.key[data-hidden] { opacity: 0; transform: translateY(8px); pointer-events: none; }
.key-row { display: flex; align-items: center; gap: var(--glyph-gap); padding: var(--space-4) var(--space-8); color: var(--text-secondary); font-size: 11.5px; line-height: 1.35; }
.key-row svg { width: 22px; height: 18px; flex: 0 0 auto; overflow: visible; }
.key-row b { color: var(--text-primary); font-weight: 600; }
/* ---- The app's own components, copied from the renderer's stylesheets so the pane, the cards, the rows and the notices read as Luke. ---- */

/* Hover cards (desktop.css .tooltip-card / .card-*, tooltip.css). */
.tooltip {
  position: fixed; z-index: 30; top: 0; left: 0;
  display: flex; align-items: center; gap: var(--glyph-gap);
  padding: var(--space-4) var(--row-inset); border: 1px solid var(--hairline-strong); border-radius: 7px;
  font-size: 12px; font-weight: 500; line-height: 16px;
  animation: tooltip-fade var(--duration-quick) var(--motion-exit) both, tooltip-grow var(--duration-fast) var(--spring-fast, var(--spring)) both;
}
.tooltip[hidden] { display: none; }
@keyframes tooltip-fade { from { visibility: hidden; opacity: 0; } }
@keyframes tooltip-grow { from { transform: scale(0.96); } }
.tooltip-card {
  display: flex; width: 280px; flex-direction: column; align-items: stretch; gap: var(--space-4);
  padding: var(--space-6) calc(var(--menu-inset) + var(--row-inset));
  border-color: var(--hairline-strong); border-radius: var(--menu-radius);
  background: var(--surface-popover); box-shadow: 0 12px 32px var(--shadow);
  color: var(--text-primary); font-weight: 400; white-space: normal; transform-origin: top left;
}
.card { display: flex; flex-direction: column; gap: var(--space-4); }
.card-head { display: flex; align-items: baseline; gap: var(--glyph-gap); }
.card-glyph { display: inline-flex; width: 16px; height: 1lh; flex: none; align-self: flex-start; align-items: center; justify-content: center; }
.card-glyph > svg { width: 14px; height: 14px; }
.card-title { display: flex; min-width: 0; flex: 1; flex-direction: column; gap: var(--space-2); }
.card-name { display: -webkit-box; overflow: hidden; font-size: 12.5px; font-weight: 500; overflow-wrap: anywhere; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
.card-sub { display: flex; min-width: 0; align-items: center; gap: var(--space-4); color: var(--text-secondary); font-size: 11.5px; font-variant-numeric: tabular-nums; }

.toast {

button.summary-row:hover { background: var(--raised); }

svg.working-mark { display: block; width: 12px; height: 12px; flex: none; fill: currentColor; color: var(--text-secondary); }

.published-added { color: var(--state-complete); }
.published-removed { color: var(--danger); }
.published-rows { display: flex; flex-direction: column; gap: var(--space-4); }

.inbox-item { display: flex; flex-direction: column; gap: var(--space-4); padding: 0 var(--row-inset); }

.inbox-indent { display: flex; flex-direction: column; gap: var(--space-8); padding-left: 21px; font-size: 13px; line-height: 1.625; }
.inbox-indent h3 { margin: 0; font-size: 13px; font-weight: 500; }

.inbox-option:hover { background: var(--raised-strong); }
.attention-mark { display: inline-grid; width: 14px; height: 14px; flex: none; place-items: center; border-radius: 50%; background: var(--attention-mark-ground); color: #fff; }
.attention-mark svg { width: 12px; height: 12px; }
.call-row { color: var(--voice-developer); font-weight: 500; }
.panel-foot { padding: 0 var(--row-inset); color: var(--text-tertiary); font-size: 11.5px; line-height: 1.45; }
.panel-total { display: flex; align-items: baseline; gap: var(--space-8); padding: 0 var(--row-inset); font-size: 13px; }
.panel-total b { font-size: 20px; font-weight: 650; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }

    ? { x: (sign > 0 ? box.x + 0.05 : box.x + 0.53) + len / 2, y: m.y, w: len, d: CONTAINER_W, h: CONTAINER_H, z: 0.19, orient: "x" }

function drawMovers() {

  if (!g) return;

  for (const m of movers) s += drawTruck(m);
  const now = performance.now();
  for (const b of bursts) {
    const [px, py] = PR_(b.x, b.y, 0.6);
    const cols = [css("--state-merged"), css("--state-complete"), css("--danger"), "#ffd9a0"];
    for (let k = 0; k < 12; k++) {
      const a = (k / 12) * Math.PI * 2;
      s += `<circle class="spark" style="--dx:${(Math.cos(a) * 26).toFixed(1)}px;--dy:${(Math.sin(a) * 18 - 14).toFixed(1)}px;animation-delay:${((b.at - now) / 1000).toFixed(2)}s" cx="${px}" cy="${py}" r="2" fill="${cols[k % 4]}"/>`;
    }
  }
  g.innerHTML = s;
  /* Stand among the objects by depth, so a building in front hides the truck. */
  if (movers.length) {
    const d = depthOf(movers[0].x, movers[0].y);
    const layer = $("layer-objects");
    let before = null;
    for (const el of layer.children) { if (el !== g && Number(el.dataset.depth) > d) { before = el; break; } }
    if (g.nextSibling !== before) layer.insertBefore(g, before);
  }
}
const TRUCK_SPEED = 2.6;
function tickMovers(dt) {
  if (!movers.length && !bursts.length) return;
  for (const m of [...movers]) {
    let left = (m.speed || TRUCK_SPEED) * dt;
    while (left > 0 && m.seg < m.path.length - 1) {
      const b = m.path[m.seg + 1];
      const d = Math.hypot(b[0] - m.x, b[1] - m.y);
      if (d <= left) { m.x = b[0]; m.y = b[1]; m.seg += 1; left -= d; }
      else { m.x += ((b[0] - m.x) / d) * left; m.y += ((b[1] - m.y) / d) * left; left = 0; }
    }
    if (m.seg >= m.path.length - 1) { movers.splice(movers.indexOf(m), 1); m.done(); }
  }
  const open = movers.some((m) => m.x > BARRIER.x - 1.4 && m.x < BARRIER.x + 1.0);
  if (open !== gateOpen) { gateOpen = open; const g = $("gate"); if (g) g.innerHTML = gateSVG(gateOpen); }

  for (const b of [...bursts]) if (now - b.at > 1600) bursts.splice(bursts.indexOf(b), 1);

}

    items.push({ z, depth: depthOf(cx, cy), svg, role: p.role });
  }
  const crane = underway(task) && slot.crane;
  if (crane) items.push({ z: 0, depth: depthOf(...slot.crane.at), svg: "", role: "crane" });

  for (const it of items) {
    if (it.role === "shell" && !cutDone) { body += `<g class="cut">${cutawaySVG(task, slot)}</g>`; cutDone = true; }
    if (it.role === "crane") { body += `<g class="upper" data-crane="${task.id}">${craneSVG(slot.crane)}</g>`; continue; }
    body += `<g class="${it.role === "shell" ? "shell" : it.role === "upper" ? "upper" : "keep"}">${it.svg}</g>`;

/* Containers: a steel box as long as the change, its diff a painted band along its side. */

/* ------------------------------------------------------------------------

const cam = { x: 0, y: 0, s: 1 };
let lastSize = null;
function sceneBounds() {
  const corners = [[0, 0], [N, 0], [N, N], [0, N], [LOT.x + LOT.w, LOT.y], [LOT.x + LOT.w, LOT.y + LOT.d]].map(([x, y]) => PR_(x, y, 0));

}

  cam.y = oy - ((oy - cam.y) * ns) / cam.s;

function toast(words, icon = "check") { pushToast({ words, icon }); }
function answer(itemId, choice) {
  const k = INBOX.findIndex((i) => i.id === itemId);
  if (k < 0) return;
  const item = INBOX[k];
  INBOX.splice(k, 1);
  /* A reply hands the agent a message, so its turn starts again. */
  const t = byId[item.taskId];
  const agent = t.agents.named.find((a) => a.id === item.agentId);
  if (agent) { agent.status = AGENT.RUNNING; agent.at = NOW; t.agents.working += 1; }
  pushToast({ words: `Replied “${choice}”`, detail: byId[item.taskId].name });
  refreshAll();
}
function refreshAll() {
  if (hover.el && !document.contains(hover.el)) hideCard();
  renderAll(); renderSidebar(); renderCensus(); renderKey();
  if (openId) renderInspector();
  applyCamera(true);
}

function taskTime(t) {
  return Math.max(t.createdAt, ...t.agents.named.map((a) => a.at || 0), ...inboxFor(t).map((i) => i.postedAt));
}
function renderSidebar() {
  $("task-list").innerHTML = `<ul class="task-list">${TASKS.slice().sort((a, b) => b.createdAt - a.createdAt).map((t) => {
    const mark = asking(t) ? attentionMark() : running(t) ? workingMark() : "";
    return `<li><button type="button" class="sidebar-plan task-row" data-id="${t.id}" data-card="task:${t.id}" data-card-side="end" aria-current="${openId === t.id}"><span class="sidebar-plan-line"><span class="sidebar-plan-name">${t.name}</span><span class="sidebar-plan-time">${mark}<time>${ago(taskTime(t))}</time></span></span></button></li>`;
  }).join("")}</ul>`;
}
function renderCensus() {
  const q = INBOX.length, r = readyPRs().length;
  const btn = $("needs-you");
  btn.hidden = q + r === 0;
  /* The Factory's own words for it: "2 need you". What they are is the button's card. */
  btn.innerHTML = `${attentionMark()}${q + r} need${q + r === 1 ? "s" : ""} you`;
  btn.dataset.card = "needs";
  $("inbox-count").textContent = q || "";
}
function renderKey() {
  const k = (svg, html) => `<div class="key-row"><svg viewBox="-11 -9 22 18" aria-hidden="true">${svg}</svg><span>${html}</span></div>`;
  const ok = css("--state-complete"), no = css("--danger"), work = css("--state-working"), ask = css("--state-attention");
  $("key").innerHTML =
    k(`<rect x="-8" y="-6" width="5" height="5" rx="1" fill="${work}"/><rect x="-1" y="-6" width="5" height="5" rx="1" fill="${ask}"/>`, "<b>Windows</b> lit by what the task's agents are doing; smoke while one runs") +
    k(`<circle r="4" fill="${ask}"/><circle r="8" fill="none" stroke="${ask}" stroke-width="1.5" opacity="0.6"/>`, "<b>Beacon</b>: a question in the Inbox") +
    k(`<ellipse rx="9" ry="4.5" fill="none" stroke="${css("--voice-developer")}" stroke-width="1.5"/>`, "<b>Rings</b>: on this Mac's call") +
    k(`<line x1="0" y1="8" x2="0" y2="-7" stroke="#e0b42e" stroke-width="2"/><line x1="-8" y1="-7" x2="9" y2="-7" stroke="#e0b42e" stroke-width="2"/>`, "<b>Crane</b>: at work, no pull request yet") +
    k(`<rect x="-10" y="-4" width="20" height="8" fill="${css("--text-tertiary")}"/><rect x="-10" y="-1" width="14" height="2" fill="${ok}"/><rect x="4" y="-1" width="6" height="2" fill="${no}"/>`, "<b>Container</b> per pull request: length is lines changed, linear (150 a tile); the band is its additions and deletions") +
    k(`<rect x="-6" y="-6" width="12" height="12" fill="none" stroke="${css("--text-tertiary")}" stroke-dasharray="2.5 2"/>`, "<b>Dashed</b>: not named in the summary, size unknown") +
    k(`<circle cx="-5" r="3" fill="${no}"/><circle cx="1" r="3" fill="${ask}"/><circle cx="7" r="3" fill="${ok}"/>`, "<b>Gate lanes</b>: checks failing, running, ready. Not a merge queue");
}

/* Hover cards, as tooltip.tsx hangs them: a card after the pointer rests
   --hint-delay, at once while the window is warm from the last one, kept
   180ms after the pointer leaves so it can cross onto the card. */
const HINT_DELAY = 500, WARM_MS = 500, LINGER_MS = 180;
const hover = { el: null, showAt: 0, hideAt: 0, warmUntil: 0 };
function cardHead(glyphHTML, name, sub, corner) {
  return `<div class="card-head">${glyphHTML ? `<span class="card-glyph">${glyphHTML}</span>` : ""}<div class="card-title"><span class="card-name">${name}</span>${sub ? `<span class="card-sub">${sub}</span>` : ""}</div>${corner ? `<span class="card-corner">${corner}</span>` : ""}</div>`;
}
function cardFor(key) {
  const [kind, id] = key.split(":");
  if (kind === "task") {
    const t = byId[id];
    if (!t) return "";
    const asks = inboxFor(t);
    const note = asks.length ? `${t.agents.named.find((a) => a.id === asks[0].agentId)?.model ?? "An agent"} asked: ${asks[0].title}`
      : t.id === callTaskId ? "On this Mac's call" : t.agents.working ? `${t.agents.working} working` : t.agents.total ? "No agent working" : "No agents yet";
    const rows = t.agents.named.map((a) => `<div class="card-line"><span class="summary-glyph">${a.status === AGENT.RUNNING ? workingMark() : harnessMark()}</span>${modelLabel(a)}<span class="end">${a.at ? ago(a.at) : ""}</span></div>`).join("") +
      t.pullRequests.named.map((p) => `<div class="card-line">${prMark(p)}<span>#${p.number}</span><span class="end">${prWords(p)}</span></div>`).join("");
    return `<div class="card">${cardHead(glyph("factory"), t.name, t.repository, ago(taskTime(t)))}<p class="card-note">${note}</p>${rows ? `<hr class="card-rule">${rows}` : ""}</div>`;
  }
  if (kind === "pr") {
    const p = allPRs().find((q) => String(q.number) === id);
    if (!p) return "";
    return `<div class="card">${cardHead(prMark(p), `#${p.number} ${p.title}`, byId[p.taskId].name, lines(p))}<p class="card-note">${prWords(p)[0].toUpperCase()}${prWords(p).slice(1)} · ${linesOf(p)} lines changed</p></div>`;
  }
  if (kind === "unknown") {
    const t = byId[id];
    return `<div class="card">${cardHead(glyph("pr"), "A pull request not named", t.name, "")}<p class="card-note">${t.name} counts ${t.pullRequests.total} and names ${t.pullRequests.named.length}. Its state and size are unknown.</p></div>`;
  }
  if (kind === "agent") {
    const [t, a] = agentOf(id);
    if (!a) return "";
    const word = { running: "Working", starting: "Working", failed: "Failed", cancelled: "Stopped", completed: "" }[a.status];
    const asked = INBOX.find((q) => q.agentId === a.id);
    return `<div class="card">${cardHead(a.status === AGENT.RUNNING ? workingMark() : harnessMark(), t.name, modelLabel(a), [word, a.at ? ago(a.at) : ""].filter(Boolean).join(" · "))}${asked ? `<p class="card-note">Asked: ${asked.title}</p>` : ""}</div>`;
  }
  if (kind === "gate") {
    return `<div class="card">${cardHead(glyph("pr"), "Merge gate", `${awaiting().length} open pull requests`, "")}<p class="card-note">Grouped by their checks. Not GitHub's merge queue; merging happens on GitHub.</p><hr class="card-rule">${LANES.map((l) => `<div class="card-line"><span class="dot" style="--tone:var(${l.tone})"></span>${l.label}<span class="end">${awaiting().filter((p) => p.checks === l.checks).length}</span></div>`).join("")}</div>`;
  }
  if (kind === "shipped") {
    const ship = merged();
    return `<div class="card">${cardHead(glyph("merge"), "Shipped", "A sample, not an all-time total", lines({ additions: ship.reduce((a, p) => a + p.additions, 0), deletions: ship.reduce((a, p) => a + p.deletions, 0) }))}<p class="card-note">${ship.length} merged pull requests the listed tasks' summaries name.</p></div>`;
  }
  if (kind === "needs") {
    const rows = INBOX.map((i) => `<div class="card-line">${attentionMark()}<span>${i.title}</span><span class="end">${ago(i.postedAt)}</span></div>`).join("") +
      readyPRs().map((p) => `<div class="card-line">${prMark(p)}<span>#${p.number} ready to merge</span><span class="end">${byId[p.taskId].name}</span></div>`).join("");
    return `<div class="card">${cardHead(null, `${INBOX.length + readyPRs().length} need you`, "", "")}${rows}</div>`;
  }
  return "";
}
function placeCard(el) {
  const card = $("hovercard");
  const r = el.getBoundingClientRect();
  const w = card.offsetWidth, h = card.offsetHeight;
  let x, y;
  if (el.dataset.cardSide === "end") { x = r.right + 6; y = r.top; if (x + w > innerWidth - 6) x = r.left - 6 - w; }
  else { x = r.left; y = r.bottom + 6; if (y + h > innerHeight - 6) y = r.top - 6 - h; }
  card.style.left = `${Math.max(6, Math.min(innerWidth - w - 6, x))}px`;
  card.style.top = `${Math.max(6, Math.min(innerHeight - h - 6, y))}px`;
}
function showCard(el) {
  const html = cardFor(el.dataset.card);
  if (!html) return;
  const card = $("hovercard");
  card.innerHTML = html;
  card.hidden = false;
  card.style.animation = "none"; void card.offsetWidth; card.style.animation = "";
  placeCard(el);
  el.setAttribute("aria-describedby", "hovercard");
}
function hideCard() {
  clearTimeout(hover.showAt); clearTimeout(hover.hideAt);
  if (hover.el) { hover.el.removeAttribute("aria-describedby"); if (!$("hovercard").hidden) hover.warmUntil = performance.now() + WARM_MS; }
  hover.el = null;
  $("hovercard").hidden = true;
}
document.addEventListener("pointerover", (e) => {
  if (e.target.closest("#hovercard")) { clearTimeout(hover.hideAt); return; }
  const el = e.target.closest("[data-card]");
  if (el === hover.el) { clearTimeout(hover.hideAt); return; }
  if (!el) { if (hover.el) { clearTimeout(hover.hideAt); hover.hideAt = setTimeout(hideCard, LINGER_MS); } return; }
  hideCard();
  hover.el = el;
  const warm = performance.now() < hover.warmUntil;
  hover.showAt = setTimeout(() => showCard(el), warm ? 0 : HINT_DELAY);
});
document.addEventListener("focusin", (e) => {
  const el = e.target.closest?.("[data-card]");
  if (el?.matches(":focus-visible")) { hideCard(); hover.el = el; showCard(el); }
});
for (const ev of ["pointerdown", "keydown", "wheel"]) document.addEventListener(ev, (e) => { if (!e.target.closest?.("#hovercard")) hideCard(); }, { capture: true, passive: true });
function hideCrateCard() { hideCard(); }

/* ------------------------------------------------------------------------
   Wiring.
   ------------------------------------------------------------------------ */
function setTheme(t) {
  theme = t;
  document.documentElement.dataset.theme = t;
  for (const b of document.querySelectorAll("[data-theme-choice]")) b.setAttribute("aria-pressed", String(b.dataset.themeChoice === t));
  renderAll(); renderKey(); renderSidebar(); applyCamera(true);
}
for (const b of document.querySelectorAll("[data-theme-choice]")) b.addEventListener("click", () => setTheme(b.dataset.themeChoice));

const scene = $("scene");
const stage = $("stage");
function activate(target) {
  const crate = target.closest(".crate");
  if (crate) { select(crate.dataset.task, Number(crate.dataset.crate) || undefined); return true; }
  const g = target.closest(".bldg");
  if (g) { select(g.dataset.id); return true; }
  const yard = target.closest(".yard-hit");
  if (yard) { select(yard.dataset.yard); return true; }
  if (target.closest("#new-plot")) { toast("A new task takes the next plot", "plus"); return true; }
  return false;
}
scene.addEventListener("click", (e) => {
  if (dragMoved) return;
  if (!activate(e.target) && openId) closeDetails(true);
});
scene.addEventListener("pointerover", (e) => {
  const crate = e.target.closest(".crate");
  const g = e.target.closest(".bldg");
  const task = crate ? crate.dataset.task : g ? g.dataset.id : null;
  const pr = crate && !crate.dataset.crate.startsWith("u-") ? allPRs().find((q) => String(q.number) === crate.dataset.crate) : null;
  if (task !== hoverTask || pr?.number !== hotPR?.number) { hoverTask = task; if (!shownPR) hotPR = pr; syncMarks(); }
});
scene.addEventListener("pointerleave", () => { hideCrateCard(); hoverTask = null; if (!shownPR) hotPR = null; syncMarks(); });
scene.addEventListener("focusin", (e) => {
  const g = e.target.closest(".bldg");
  focusTask = g?.matches(":focus-visible") ? g.dataset.id : null;
  const crate = e.target.closest(".crate");
  syncMarks();
});
scene.addEventListener("focusout", () => { focusTask = null; hideCrateCard(); syncMarks(); });

scene.addEventListener("keydown", (e) => {
  if ((e.key === "Enter" || e.key === " ") && activate(e.target)) e.preventDefault();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && openId) closeDetails(true);
  if (e.key === "r" && !e.metaKey && !e.target.closest("input, textarea")) turn();
});
$("task-list").addEventListener("click", (e) => { const r = e.target.closest(".task-row"); if (r) select(r.dataset.id); });
$("inspector").addEventListener("click", (e) => {
  if (e.target.closest("#insp-close")) closeDetails(true);
  const row = e.target.closest(".published-row");
  if (row) { const p = allPRs().find((q) => String(q.number) === row.dataset.pr); if (p) select(p.taskId, p.number); }
  const a = e.target.closest("[data-answer]");
  if (a) answer(a.dataset.item, a.dataset.answer);
  if (e.target.closest("#open-task")) toast("Opens the task", "open");
});
$("needs-you").addEventListener("click", () => {
  const list = [...new Set([...INBOX.map((i) => i.taskId), ...readyPRs().map((p) => p.taskId)])];
  if (!list.length) return;
  const next = list[(list.indexOf(openId) + 1) % list.length];
  select(next, readyPRs().find((p) => p.taskId === next)?.number);
});
$("zoom-in").addEventListener("click", () => { zoomBy(1.3); applyCamera(false); });
$("zoom-out").addEventListener("click", () => { zoomBy(1 / 1.3); applyCamera(false); });
$("fit").addEventListener("click", () => { if (openId) closeDetails(true); else fitCampus(false); });
function turn() {
  rot = (rot + 1) % 4;
  renderAll();
  fitCampus(true);
}
$("rotate").addEventListener("click", turn);
$("key-toggle").addEventListener("click", () => {
  const shown = $("key").hasAttribute("data-hidden");
  $("key").toggleAttribute("data-hidden", !shown);
  $("key-toggle").setAttribute("aria-pressed", String(shown));
});

let drag = null, dragMoved = false;
stage.addEventListener("pointerdown", (e) => {
  if (e.target.closest(".map-controls, .key, .toast")) return;
  drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y };
  dragMoved = false;
});
window.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!dragMoved && Math.hypot(dx, dy) < 4) return;
  dragMoved = true;
  hideCrateCard();
  stage.setAttribute("data-dragging", "");
  cam.x = drag.cx + dx; cam.y = drag.cy + dy;
  applyCamera(true);
});
window.addEventListener("pointerup", () => { drag = null; stage.removeAttribute("data-dragging"); setTimeout(() => { dragMoved = false; }, 0); });
stage.addEventListener("wheel", (e) => {
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  zoomBy(Math.exp(-e.deltaY * 0.0022), e.clientX - r.left, e.clientY - r.top);
  hideCrateCard();
  applyCamera(true);
}, { passive: false });
/* When the pane opens or the window changes size, the campus keeps its middle where it was. */
new ResizeObserver(() => {
  const st = stage.getBoundingClientRect();
  if (!lastSize) { lastSize = st; fitCampus(true); return; }
  cam.x += (st.width - lastSize.width) / 2;
  cam.y += (st.height - lastSize.height) / 2;
  lastSize = st;
  applyCamera(true);
}).observe(stage);

const reduced = matchMedia("(prefers-reduced-motion: reduce)");
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  tickMovers(dt);
  if (!reduced.matches && !document.hidden) {
    craneAngle += dt * 0.18;
    for (const cr of document.querySelectorAll("[data-crane]")) cr.innerHTML = craneSVG(slotOf(cr.dataset.crane).crane);
  }
  requestAnimationFrame(frame);
}

/* A link may name a frame; each value is matched to one of the page's own. */
const params = new URLSearchParams(location.search);
const themeParam = params.get("theme");
const initialTheme = themeParam === "light" ? "light" : themeParam === "dark" ? "dark" : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
const openParam = [...TASKS.map((t) => t.id), "gate", "shipped"].find((id) => id === params.get("open"));
const rotParam = ["1", "2", "3"].indexOf(params.get("rot")) + 1;
renderSidebar();
renderCensus();
setTheme(initialTheme);
for (let i = 0; i < rotParam; i++) turn();
fitCampus(true);
if (openParam) select(openParam);
$("sim-toggle").addEventListener("click", () => { sim.on = !sim.on; renderSimStatus(); if (sim.on) schedule(600); else clearTimeout(sim.timer); });
$("sim-restart").addEventListener("click", () => { resetWork(); schedule(1200); });
renderSimStatus();
if (params.get("events") === "off") { sim.on = false; renderSimStatus(); } else schedule(2400);
requestAnimationFrame(frame);
</script>
</body>
</html>
