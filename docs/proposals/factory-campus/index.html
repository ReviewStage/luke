<!doctype html>
<!-- Factory as a campus of buildings: a design exploration, not a feature. One self-contained page that fetches nothing; every task, agent, Inbox item, and pull request on it is illustrative, shaped as the fields the window already holds. Open it in a browser. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luke · Factory as a campus (design exploration)</title>
<style>
/* Tokens, copied from the renderer's base.css, desktop.css, and the generated
   motion tokens so the mockup wears the app's own ground, ink, and timing. */
:root {
  color-scheme: dark;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
  font-synthesis: none;
  -webkit-font-smoothing: antialiased;
  --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  --spring: linear(0, 0.0285, 0.0993, 0.1943, 0.3005, 0.4083, 0.5115, 0.6061, 0.69, 0.7623, 0.8229, 0.8727, 0.9125, 0.9437, 0.9674, 0.9848, 0.9972, 1.0056, 1.0109, 1.0138, 1.015, 1.015, 1.0142, 1.0129, 1.0114, 1.0098, 1);
  --duration-fast: 280ms;
  --motion-exit: cubic-bezier(0.4, 0, 0.6, 1);
  --duration-shape: 460ms;
  --duration-exit: 90ms;
  --duration-quick: 140ms;
  --duration-hover: 70ms;
  --duration-pane: 240ms;
  --motion-pane: cubic-bezier(0.2, 0, 0, 1);
  --row-stagger: 32ms;
  --loop-motion: running;

  --space-2: 2px; --space-4: 4px; --space-6: 6px; --space-8: 8px; --space-12: 12px;
  --space-16: 16px; --space-20: 20px; --space-24: 24px; --space-32: 32px; --space-40: 40px;
  --column-inset: var(--space-12);
  --row-inset: var(--space-8);
  --content-inset: calc(var(--column-inset) + var(--row-inset));
  --glyph-gap: var(--space-8);
  --control-gap: var(--space-8);
  --list-gap: var(--space-2);
  --section-gap: var(--space-16);
  --control-height: 30px;
  --control-radius: 8px;
  --control-glyph: 15px;
  --menu-inset: var(--space-4);
  --menu-row-height: 32px;
  --menu-row-radius: 6px;
  --menu-radius: calc(var(--menu-row-radius) + var(--menu-inset));
  --sidebar-width: 264px;
  --desktop-bar-height: 51px;
  --focus-ring-width: 2px;
  --focus-ring-offset: 1px;
}

/* Dark, the default; data-theme on <html> takes a choice from the page's own switch. */
:root, :root[data-theme="dark"] {
  color-scheme: dark;
  --state-working: #5cd5ff;
  --state-attention: #ffa049;
  --state-complete: #6fdca4;
  --state-merged: #c3a0ff;
  --voice-developer: #7fe0ac;
  --message-sent: #0071e3;
  --danger: #ff7e7e;
  --text-primary: rgba(255, 255, 255, 0.95);
  --text-secondary: rgba(255, 255, 255, 0.56);
  --text-tertiary: rgba(255, 255, 255, 0.5);
  --text-body: rgba(255, 255, 255, 0.86);
  --raised: rgba(255, 255, 255, 0.05);
  --raised-strong: rgba(255, 255, 255, 0.09);
  --selected: rgba(255, 255, 255, 0.2);
  --pressed: rgba(255, 255, 255, 0.26);
  --hairline: rgba(255, 255, 255, 0.08);
  --hairline-strong: rgba(255, 255, 255, 0.12);
  --on-accent: #fff;
  --shadow: rgba(0, 0, 0, 0.5);
  --shadow-deep: rgba(0, 0, 0, 0.6);
  --section-fill: rgba(255, 255, 255, 0.022);
  --desktop-ground: #0c0c0e;
  --desktop-sidebar: #111114;
  --desktop-well: #0f0f12;
  --sidebar-ink: rgba(255, 255, 255, 0.7);
  --surface-popover: #111114;
  --attention-mark-ground: #c4620c;
  --workspace-hue-1: #4f63b8;
  --actor-tile: #2a2a30;
  --focus-ring: var(--message-sent);
  --page-ground: #050506;
  --page-ink: rgba(255, 255, 255, 0.6);
  --stage-sky: radial-gradient(120% 90% at 50% 30%, #15161c 0%, #0c0c0e 70%);
  --label-ground: rgba(17, 17, 20, 0.92);
}

:root[data-theme="light"] {
  color-scheme: light;
  --state-working: #0a72a8;
  --state-attention: #a65400;
  --state-complete: #18794e;
  --state-merged: #8250df;
  --voice-developer: #17784a;
  --danger: #e0383e;
  --text-primary: rgba(0, 0, 0, 0.88);
  --text-secondary: rgba(0, 0, 0, 0.6);
  --text-tertiary: rgba(0, 0, 0, 0.56);
  --text-body: rgba(0, 0, 0, 0.8);
  --raised: rgba(0, 0, 0, 0.035);
  --raised-strong: rgba(0, 0, 0, 0.06);
  --selected: rgba(0, 0, 0, 0.07);
  --pressed: rgba(0, 0, 0, 0.11);
  --hairline: rgba(0, 0, 0, 0.08);
  --hairline-strong: rgba(0, 0, 0, 0.1);
  --shadow: rgba(0, 0, 0, 0.12);
  --shadow-deep: rgba(0, 0, 0, 0.2);
  --section-fill: #fff;
  --desktop-ground: #fcfcfc;
  --desktop-sidebar: #f3f3f4;
  --desktop-well: #f8f8f9;
  --sidebar-ink: rgba(0, 0, 0, 0.68);
  --surface-popover: #fff;
  --attention-mark-ground: #a65400;
  --workspace-hue-1: #4a5fc0;
  --actor-tile: #e8e8ec;
  --page-ground: #e4e4e8;
  --page-ink: rgba(0, 0, 0, 0.6);
  --stage-sky: radial-gradient(120% 90% at 50% 30%, #ffffff 0%, #f4f4f6 70%);
  --label-ground: rgba(255, 255, 255, 0.94);
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --loop-motion: paused;
    --duration-fast: 0ms; --duration-shape: 0ms; --duration-exit: 0ms;
    --duration-quick: 0ms; --duration-hover: 0ms; --duration-pane: 0ms; --row-stagger: 0ms;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  display: flex;
  flex-direction: column;
  background: var(--page-ground);
  color: var(--text-primary);
  font-size: 13px;
  overflow: hidden;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: default; }
svg.glyph { width: 15px; height: 15px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
:focus { outline: none; }
:focus-visible { outline: var(--focus-ring-width) solid var(--focus-ring); outline-offset: var(--focus-ring-offset); }

/* The page around the mockup: what this is, and the appearance switch. */
.show-head {
  display: flex;
  align-items: center;
  gap: var(--space-16);
  padding: var(--space-12) var(--space-24);
  color: var(--page-ink);
  font-size: 12px;
}
.show-head strong { color: var(--text-primary); font-weight: 600; font-size: 13px; }
.show-chip {
  padding: var(--space-2) var(--space-8);
  border: 1px solid var(--hairline-strong);
  border-radius: 999px;
  color: var(--text-secondary);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.02em;
}
.show-chip[data-tone="illustrative"] { color: var(--state-attention); border-color: currentColor; }
.show-head .spacer { flex: 1; }
.segmented {
  display: inline-flex;
  margin: 0;
  border: 0;
  padding: var(--space-2);
  border-radius: var(--control-radius);
  background: var(--raised-strong);
}
.segmented button {
  height: 24px;
  padding: 0 var(--space-12);
  border-radius: 6px;
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 600;
}
.segmented button[aria-pressed="true"] { background: var(--desktop-ground); color: var(--text-primary); box-shadow: 0 1px 2px var(--shadow); }

/* The window. */
.window-wrap { flex: 1; min-height: 0; display: flex; padding: 0 var(--space-24) var(--space-24); }
.window {
  position: relative;
  flex: 1;
  min-width: 0;
  display: grid;
  grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
  border: 1px solid var(--hairline-strong);
  border-radius: 12px;
  overflow: clip;
  background: var(--desktop-ground);
  box-shadow: 0 24px 64px var(--shadow-deep);
}
.traffic { position: absolute; top: 18px; left: 18px; display: flex; gap: 8px; z-index: 5; }
.traffic i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; }
.traffic i:nth-child(2) { background: #febc2e; }
.traffic i:nth-child(3) { background: #28c840; }

/* Sidebar, drawn as desktop-sidebar.tsx draws it. */
.sidebar {
  display: flex;
  min-height: 0;
  flex-direction: column;
  padding: 0 var(--column-inset) var(--column-inset);
  border-right: 1px solid var(--hairline);
  background: var(--desktop-sidebar);
}
.sidebar-top { height: var(--desktop-bar-height); display: flex; align-items: center; justify-content: flex-end; gap: var(--space-2); }
.sidebar-top .icon-button { color: var(--text-tertiary); }
.switcher {
  display: flex; align-items: center; gap: var(--glyph-gap);
  height: 36px; padding: 0 var(--row-inset); margin-bottom: var(--space-8);
  border-radius: 9px; font-size: 14px; font-weight: 650; letter-spacing: -0.01em;
}
.switcher:hover { background: var(--raised); }
.workspace-tile {
  display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 4px;
  background: var(--workspace-hue-1); color: #fff; font-size: 10px; font-weight: 650;
}
.switcher .chev { margin-left: auto; color: var(--text-tertiary); }
.side-row {
  display: flex; align-items: center; gap: var(--glyph-gap);
  height: var(--control-height); margin: 0 0 var(--list-gap); padding: 0 var(--row-inset);
  border-radius: 9px; color: var(--sidebar-ink); font-size: 13px; text-align: left; width: 100%;
  transition: background-color var(--duration-hover) ease, color var(--duration-hover) ease;
}
.side-row:hover { color: var(--text-primary); }
.side-row[aria-current="page"] { background: var(--raised-strong); color: var(--text-primary); }
.side-row .end { margin-left: auto; color: var(--text-tertiary); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.kbd { display: inline-flex; gap: 1px; color: var(--text-tertiary); font-size: 11.5px; }
.sidebar-rule { height: 1px; margin: var(--space-8) var(--row-inset); border: 0; background: var(--hairline); }
.section-head {
  display: flex; align-items: center; height: 28px; padding: 0 var(--row-inset);
  color: var(--text-tertiary); font-size: 11.5px; font-weight: 600;
}
.task-row {
  display: flex; align-items: center; gap: var(--glyph-gap);
  width: 100%; min-height: var(--control-height); padding: var(--space-6) var(--row-inset);
  border-radius: 9px; color: var(--sidebar-ink); text-align: left; font-size: 13px;
}
.task-row:hover { color: var(--text-primary); background: var(--raised); }
.task-row[aria-current="true"] { background: var(--raised-strong); color: var(--text-primary); }
.task-row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; background: var(--tone, var(--text-tertiary)); }
.dot[data-pulse] { box-shadow: 0 0 0 3px color-mix(in srgb, var(--tone) 25%, transparent); }
.sidebar-scroll { flex: 1; min-height: 0; overflow: auto; margin: 0 calc(-1 * var(--space-4)); padding: 0 var(--space-4); }
.sidebar-foot { padding-top: var(--space-8); border-top: 1px solid var(--hairline); }

/* The work column: a toolbar over the campus, and the inspector pane beside it. */
.main { display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; min-height: 0; }
.toolbar {
  display: flex; align-items: center; gap: var(--control-gap);
  min-height: var(--desktop-bar-height); padding: var(--space-8) var(--content-inset);
  border-bottom: 1px solid var(--hairline);
}
.toolbar-title { display: flex; align-items: center; gap: var(--glyph-gap); font-size: 13px; font-weight: 600; }
.toolbar-title .sub { color: var(--text-tertiary); font-weight: 500; }
.toolbar .spacer { flex: 1; }
.toolbar-button, .icon-button, .primary-button {
  --button-fill: transparent;
  display: inline-flex; align-items: center; justify-content: center; gap: var(--glyph-gap);
  height: var(--control-height); padding: 0 var(--space-12);
  border-radius: var(--control-radius); background: var(--button-fill);
  font-size: 12.5px; font-weight: 600; white-space: nowrap;
  transition: background-color var(--duration-hover) ease, color var(--duration-hover) ease, filter var(--duration-hover) ease;
}
.icon-button { width: var(--control-height); padding: 0; color: var(--text-secondary); }
.toolbar-button:hover, .icon-button:hover, .toolbar-button[aria-pressed="true"], .icon-button[aria-pressed="true"] { background: var(--selected); color: var(--text-primary); }
.toolbar-button:active, .icon-button:active { background: var(--pressed); }
.primary-button { --button-fill: var(--message-sent); color: var(--on-accent); }
.primary-button:hover { filter: brightness(1.1); }
.toolbar-button[data-tone="attention"] { color: var(--state-attention); }
.attention-mark {
  display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%;
  background: var(--attention-mark-ground); color: #fff; font-size: 11px; font-weight: 800; line-height: 1;
}

.work { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; min-height: 0; }
.stage {
  position: relative; min-width: 0; min-height: 0; overflow: clip;
  background: var(--stage-sky);
  touch-action: none;
}
.stage svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage[data-dragging] { cursor: grabbing; }
#camera { transform-origin: 0 0; transition: transform var(--duration-shape) var(--spring); }
.stage[data-dragging] #camera, #camera[data-instant] { transition: none; }

/* Buildings: one per task, a floor per agent. */
.bldg { cursor: pointer; transition: opacity var(--duration-fast) ease; }
.bldg:focus-visible, .crate:focus-visible { outline: none; } /* no ring: the plot's or the crate's own outline draws the keyboard's ring */
.scene[data-focused] .bldg:not([data-open]),
.scene[data-focused] .crate:not([data-mine]) { opacity: 0.4; }
.bldg .floor, .bldg .roof { transition: transform var(--duration-shape) var(--spring), opacity var(--duration-fast) ease; }
.bldg .tray { opacity: 0; transition: opacity var(--duration-fast) ease; }
.bldg .solid { transition: opacity var(--duration-fast) ease; }
.bldg[data-open] .floor { transform: translateY(calc(var(--lift) * -1px)); }
.bldg[data-open] .floor .solid { opacity: 0; }
.bldg[data-open] .floor .tray { opacity: 1; }
.bldg[data-open] .roof { transform: translateY(calc(var(--lift) * -1px)); opacity: 0; }
.plot-edge, .crate-edge { fill: none; stroke: var(--text-primary); stroke-width: 1.4; opacity: 0; transition: opacity var(--duration-hover) ease; vector-effect: non-scaling-stroke; }
.plot[data-hover] .plot-edge { opacity: 0.35; }
.plot[data-open] .plot-edge { opacity: 0.5; }
.plot[data-focus] .plot-edge, .crate:focus-visible .crate-edge { opacity: 1; stroke: var(--focus-ring); stroke-width: 2; }
.crate { cursor: pointer; transition: opacity var(--duration-fast) ease; }
.crate[data-hot] .crate-edge { opacity: 0.8; }
.new-plot { cursor: pointer; }
.new-plot .plot-dash { fill: none; stroke: var(--text-tertiary); stroke-width: 1.2; stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; }
.new-plot:hover .plot-dash { stroke: var(--text-primary); }
.new-plot:focus-visible { outline: none; } /* no ring: the dashed edge takes the ring's colour and weight */
.new-plot:focus-visible .plot-dash { stroke: var(--focus-ring); stroke-width: 2; }
.route { fill: none; stroke-width: 1.6; stroke-dasharray: 4 3; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.win-lit { filter: url(#glow); }
:root[data-theme="light"] .win-lit { filter: none; }

/* Loops, only where something is still happening: a question waiting, a
   call live, checks running, an agent at work. Each answers --loop-motion. */
.loop { animation-play-state: var(--loop-motion); transform-box: fill-box; transform-origin: center; }
.beacon-ring { animation: beacon 1.6s ease-out infinite; }
@keyframes beacon { 0% { transform: scale(0.4); opacity: 0.9; } 100% { transform: scale(2.6); opacity: 0; } }
.pulse { animation: blink 1.6s ease-in-out infinite; }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
.wave { animation: wave 2.4s ease-out infinite; }
@keyframes wave { 0% { transform: scale(0.3); opacity: 0; } 15% { opacity: 0.9; } 100% { transform: scale(1.8); opacity: 0; } }
.bubble { animation: bob 2.8s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
.working { animation: working 2.4s ease-in-out infinite; }
@keyframes working { 0%, 100% { opacity: 0.95; } 50% { opacity: 0.6; } }

/* Labels float over the campus at a constant size. */
.tag { pointer-events: none; transition: opacity var(--duration-quick) ease; }
.tag rect.ground { fill: var(--label-ground); stroke: var(--hairline-strong); }
.tag text { font-size: 11.5px; font-weight: 600; fill: var(--text-primary); }
.tag text.meta { font-size: 10.5px; font-weight: 500; fill: var(--text-secondary); }
.tag[data-dim] { opacity: 0.3; }
.tag[data-hide] { opacity: 0; }
.sign text { font-size: 11px; font-weight: 650; fill: var(--text-primary); }
.sign text.meta { font-size: 10px; font-weight: 500; fill: var(--text-secondary); }
.sign rect.ground { fill: var(--label-ground); stroke: var(--hairline-strong); }
.agent-tag text { font-size: 7px; font-weight: 600; fill: var(--text-primary); }
.agent-tag rect { fill: var(--label-ground); stroke: var(--hairline-strong); }
.crate-num { font-size: 7.5px; font-weight: 650; fill: var(--text-primary); paint-order: stroke; stroke: var(--label-ground); stroke-width: 2.4px; stroke-linejoin: round; pointer-events: none; }

/* What floats over the stage: the map's controls, the key, the crate card, and a passing notice. */
.map-controls {
  position: absolute; right: var(--space-16); bottom: var(--space-16);
  display: flex; flex-direction: column; gap: var(--space-2);
  padding: var(--space-4); border: 1px solid var(--hairline-strong); border-radius: var(--menu-radius);
  background: var(--surface-popover); box-shadow: 0 12px 32px var(--shadow);
}
.map-controls hr { width: 100%; height: 1px; margin: var(--space-2) 0; border: 0; background: var(--hairline); }
.key {
  position: absolute; left: var(--space-16); bottom: var(--space-16); width: 268px; max-height: calc(100% - 2 * var(--space-16)); overflow: auto;
  padding: var(--space-8) var(--space-4) var(--space-4);
  border: 1px solid var(--hairline-strong); border-radius: var(--menu-radius);
  background: var(--surface-popover); box-shadow: 0 12px 32px var(--shadow);
  transition: opacity var(--duration-quick) ease, transform var(--duration-shape) var(--spring);
}
.key[data-hidden] { opacity: 0; transform: translateY(8px); pointer-events: none; }
.key-head { display: flex; align-items: center; justify-content: space-between; padding: 0 var(--space-4) var(--space-4) var(--space-8); color: var(--text-tertiary); font-size: 11.5px; font-weight: 600; }
.key-head .icon-button { width: 24px; height: 24px; }
.key-row { display: flex; align-items: flex-start; gap: var(--glyph-gap); padding: var(--space-4) var(--space-8); color: var(--text-secondary); font-size: 11.5px; line-height: 1.35; }
.key-row svg { width: 24px; height: 20px; flex: 0 0 auto; overflow: visible; }
.key-row b { color: var(--text-primary); font-weight: 600; }
.key-scale { display: flex; align-items: flex-end; gap: var(--space-8); padding: var(--space-4) var(--space-8) var(--space-8) 40px; color: var(--text-tertiary); font-size: 10.5px; font-variant-numeric: tabular-nums; }
.key-scale figure { display: flex; flex-direction: column; align-items: center; gap: var(--space-2); margin: 0; }
.crate-card {
  position: absolute; z-index: 2; min-width: 210px; pointer-events: none;
  padding: var(--space-8) var(--space-12); border: 1px solid var(--hairline-strong); border-radius: var(--menu-radius);
  background: var(--surface-popover); box-shadow: 0 12px 32px var(--shadow); font-size: 12px;
  transition: opacity var(--duration-quick) ease;
}
.crate-card[data-hidden] { opacity: 0; }
.crate-card .title { font-weight: 650; margin-bottom: var(--space-4); }
.crate-card .line { color: var(--text-secondary); line-height: 1.5; }
.toast {
  position: absolute; left: 50%; bottom: var(--space-24);
  display: flex; align-items: center; gap: var(--glyph-gap);
  padding: var(--space-8) var(--space-12); border: 1px solid var(--hairline-strong); border-radius: 10px;
  background: var(--surface-popover); box-shadow: 0 12px 32px var(--shadow); font-size: 12.5px; font-weight: 600;
  transform: translateX(-50%); transition: opacity var(--duration-quick) ease, transform var(--duration-shape) var(--spring);
}
.toast[data-hidden] { opacity: 0; transform: translate(-50%, 8px); pointer-events: none; }

/* The inspector: a pane beside the campus, the side panel's well and edge. */
.inspector {
  width: 0; overflow: clip; border-left: 0 solid var(--hairline); background: var(--desktop-well);
  display: flex; flex-direction: column; min-height: 0;
}
.inspector[data-open] { width: 360px; border-left-width: 1px; }
.inspector-body { width: 360px; flex: 1; min-height: 0; overflow: auto; padding: 0 0 var(--space-24); }
.inspector-body > * { animation: arrive var(--duration-shape) var(--spring) backwards; animation-delay: calc(var(--i, 0) * var(--row-stagger)); }
@keyframes arrive { from { opacity: 0; transform: translateY(6px); } }
.insp-head { display: flex; align-items: flex-start; gap: var(--space-12); padding: var(--space-16) var(--space-12) var(--space-12) var(--content-inset); }
.insp-head .titles { flex: 1; min-width: 0; }
.insp-title { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; line-height: 1.3; }
.insp-path { margin-top: var(--space-2); color: var(--text-tertiary); font-family: var(--font-mono); font-size: 11.5px; }
.insp-state {

  font-size: 12.5px; font-weight: 650;
}
.insp-section { display: flex; align-items: baseline; gap: var(--space-6); padding: var(--space-12) var(--content-inset) var(--space-4); color: var(--text-tertiary); font-size: 11.5px; font-weight: 600; }
.insp-section .count { font-variant-numeric: tabular-nums; }
.card {
  margin: 0 var(--column-inset) var(--space-8); padding: var(--space-12);
  border: 1px solid var(--hairline-strong); border-radius: 12px; background: var(--section-fill);
}
.card p { margin: 0 0 var(--space-12); color: var(--text-body); font-size: 13px; line-height: 1.45; }

.card .who .when { margin-left: auto; color: var(--text-tertiary); font-weight: 500; }
.card .note { margin-top: var(--space-8); color: var(--text-tertiary); font-size: 11.5px; }
.choices { display: flex; flex-wrap: wrap; gap: var(--space-6); }
.choice {
  height: 28px; padding: 0 var(--space-12); border: 1px solid var(--hairline-strong); border-radius: 999px;
  font-size: 12.5px; font-weight: 600; transition: background-color var(--duration-hover) ease;
}
.choice:hover { background: var(--selected); }
.row {
  display: flex; align-items: center; gap: var(--glyph-gap);
  min-height: 34px; margin: 0 var(--column-inset); padding: var(--space-4) var(--row-inset);
  border-radius: 9px; font-size: 13px;
}
.row[data-hot] { background: var(--raised-strong); }
.row .meta { margin-left: auto; color: var(--text-tertiary); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row .sub { color: var(--text-secondary); font-size: 12px; }
.row .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row[data-unknown] { color: var(--text-tertiary); font-size: 12px; }
.pr-row { flex-wrap: wrap; row-gap: var(--space-4); }
.pr-row .bar { display: flex; width: 100%; height: 6px; border-radius: 3px; overflow: hidden; background: var(--raised-strong); }
.pr-row .bar i { display: block; height: 100%; }
.chip { padding: 0 var(--space-6); border-radius: 5px; background: color-mix(in srgb, var(--tone) 14%, transparent); color: var(--tone); font-size: 11.5px; font-weight: 650; line-height: 18px; white-space: nowrap; }
.actor {
  display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; flex: 0 0 auto;
  background: var(--actor-tile);
}
.actor svg { width: 14px; height: 14px; }
.actor[data-person] { border-radius: 50%; background: var(--workspace-hue-1); color: #fff; font-size: 10px; font-weight: 650; }
.actor[data-unknown] { background: none; border: 1px dashed var(--text-tertiary); color: var(--text-tertiary); font-size: 11px; font-weight: 650; }
.insp-actions { display: flex; gap: var(--control-gap); padding: var(--space-8) var(--content-inset) var(--space-12); }
.foot { padding: var(--space-8) var(--content-inset); color: var(--text-tertiary); font-size: 11.5px; line-height: 1.45; }
.diffstat { font-family: var(--font-mono); font-size: 11.5px; white-space: nowrap; }
.diffstat .add { color: var(--state-complete); }
.diffstat .del { color: var(--danger); }
.meter { display: inline-flex; align-items: center; gap: 2px; height: 14px; }
.meter i { width: 2px; height: 4px; border-radius: 1px; background: var(--voice-developer); animation: meter 0.9s ease-in-out infinite; animation-play-state: var(--loop-motion); }
.meter i:nth-child(2) { animation-delay: 0.15s; } .meter i:nth-child(3) { animation-delay: 0.3s; } .meter i:nth-child(4) { animation-delay: 0.45s; }
@keyframes meter { 0%, 100% { height: 4px; } 50% { height: 13px; } }

<body>
<header class="show-head">
  <strong>Factory · campus of buildings</strong>
  <span class="show-chip">Design exploration</span>
  <span class="show-chip" data-tone="illustrative">Illustrative data · nothing is live</span>
  <span>Each building is a task and each crate is a pull request. Click either to look inside.</span>
  <span class="spacer"></span>
  <fieldset class="segmented">
    <legend class="sr-only">Appearance</legend>
    <button type="button" data-theme-choice="dark">Night</button>
    <button type="button" data-theme-choice="light">Day</button>
  </fieldset>
</header>

<div class="window-wrap">
<div class="window" id="window">
  <div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div>

  <aside class="sidebar" aria-label="Sidebar">

    <button type="button" class="side-row" data-g-lead="search">Search<span class="end kbd">⌘K</span></button>
    <button type="button" class="side-row" data-g-lead="house">Home</button>
    <button type="button" class="side-row" data-g-lead="inbox">Inbox<span class="end" id="inbox-count"></span></button>
    <button type="button" class="side-row" data-g-lead="factory" aria-current="page">Factory</button>
    <button type="button" class="side-row" data-g-lead="zap">Automations</button>

    <div class="sidebar-scroll">
      <div class="section-head">Tasks</div>
      <nav id="task-list" aria-label="Tasks"></nav>
    </div>
    <div class="sidebar-foot">
      <button type="button" class="side-row" data-g-lead="settings">Settings</button>
    </div>
  </aside>

  <section class="main" aria-label="Factory">
    <div class="toolbar">
      <div class="toolbar-title"><span data-g="factory"></span>Factory <span class="sub" id="census"></span></div>

    <div class="work">

        <svg class="scene" id="scene">
          <title>Campus</title>
          <defs>
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">

          <g id="camera">

            <g id="layer-routes"></g>
            <g id="layer-objects"></g>
            <g id="layer-tags"></g>
          </g>
        </svg>

        </div>
        <div class="toast" id="toast" role="status" aria-live="polite" data-hidden></div>
      </div>
      <aside class="inspector" id="inspector" aria-label="Details">
        <div class="inspector-body" id="inspector-body"></div>
      </aside>
    </div>
  </section>
</div>
</div>

<script>

  zap: '<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>',

  open: '<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
};
const glyph = (name) => `<svg class="glyph" viewBox="0 0 24 24" aria-hidden="true">${GLYPH[name] || ""}</svg>`;
/* An agent's harness mark: Claude's burst, drawn simply, in its own clay. */
const claudeMark = () => {
  let rays = "";
  for (let i = 0; i < 8; i++) {
    const a = (i * Math.PI) / 4;
    rays += `<line x1="12" y1="12" x2="${(12 + Math.cos(a) * 9).toFixed(2)}" y2="${(12 + Math.sin(a) * 9).toFixed(2)}"/>`;
  }
  return `<svg viewBox="0 0 24 24" aria-hidden="true" stroke="#d97757" stroke-width="3.2" stroke-linecap="round">${rays}</svg>`;
};
for (const el of document.querySelectorAll("[data-g]")) el.insertAdjacentHTML("afterbegin", glyph(el.dataset.g));
for (const el of document.querySelectorAll("[data-g-lead]")) el.insertAdjacentHTML("afterbegin", glyph(el.dataset.gLead));

/* ------------------------------------------------------------------------
   The illustrative work, shaped as the window already holds it and nothing
   more: the plan list's TaskSummary (its name, repository, start, and its
   agents' summary: a count of all and of those working, at most three named
   agents, a count of pull requests and at most three named ones, each with
   its state, its checks in one word, and its additions and deletions), the
   Inbox's open items (an agent, a title, when it was posted, the options the
   agent offered), and the task on this Mac's call. Nothing here is read
   from anywhere, and no layout is stored: every position below is worked
   out from this on each draw.
   ------------------------------------------------------------------------ */
const NOW = Date.UTC(2026, 9, 16, 17, 0);
const MIN = 60_000, HOUR = 60 * MIN, DAY = 24 * HOUR;
const AGENT = { STARTING: "starting", RUNNING: "running", COMPLETED: "completed", FAILED: "failed", CANCELLED: "cancelled" };
const PR = { OPEN: "open", DRAFT: "draft", MERGED: "merged", CLOSED: "closed" };
const CHECKS = { PENDING: "pending", PASSING: "passing", FAILING: "failing", NONE: "none" };
const TASKS = [

  {
    id: "empty", name: "Polish empty states", repository: "ReviewStage/luke", createdAt: NOW - 7 * DAY,
    agents: { total: 1, working: 0, named: [{ id: "em-1", model: "Opus", effort: "high", status: AGENT.COMPLETED, at: NOW - 26 * HOUR }] },
    pullRequests: { total: 1, named: [{ number: 3068, title: "Polish empty states", state: PR.MERGED, checks: CHECKS.PASSING, additions: 156, deletions: 47 }] },
  },
  {
    id: "reconnect", name: "Fix reconnect handling", repository: "ReviewStage/luke", createdAt: NOW - 3 * DAY,
    agents: { total: 1, working: 0, named: [{ id: "rc-1", model: "Opus", effort: "high", status: AGENT.COMPLETED, at: NOW - 18 * MIN }] },
    pullRequests: { total: 1, named: [{ number: 3081, title: "Fix reconnect handling", state: PR.OPEN, checks: CHECKS.PASSING, additions: 84, deletions: 31 }] },
  },

    id: "search", name: "Improve search ranking", repository: "ReviewStage/luke", createdAt: NOW - 2 * DAY,

    pullRequests: { total: 1, named: [{ number: 3088, title: "Improve search ranking", state: PR.OPEN, checks: CHECKS.PENDING, additions: 212, deletions: 48 }] },
  },
  {
    id: "shortcuts", name: "Keyboard shortcuts", repository: "ReviewStage/luke", createdAt: NOW - DAY,
    agents: { total: 1, working: 1, named: [{ id: "ks-1", model: "Opus", effort: "high", status: AGENT.RUNNING, at: NOW - 9 * MIN }] },
    pullRequests: { total: 1, named: [{ number: 3086, title: "Keyboard shortcuts sheet", state: PR.OPEN, checks: CHECKS.FAILING, additions: 146, deletions: 9 }] },
  },
  {
    id: "invite", name: "Invite your teammates", repository: "ReviewStage/luke", createdAt: NOW - 5 * HOUR,
    agents: { total: 1, working: 0, named: [{ id: "iv-1", model: "Opus", effort: "high", status: AGENT.COMPLETED, at: NOW - 4 * MIN }] },
    pullRequests: { total: 0, named: [] },
  },
  {
    id: "factory-view", name: "Add another Factory view", repository: "ReviewStage/luke", createdAt: NOW - HOUR,
    agents: { total: 0, working: 0, named: [] },

/* The Inbox's open items, by task: who posted it, what it asks, when, and its options. */
const INBOX = [
  { id: "ib-1", taskId: "invite", agentId: "iv-1", title: "Should an invite link expire?", postedAt: NOW - 4 * MIN, options: ["After 7 days", "After 30 days", "Never"] },
];
/* The task on this Mac's call with Luke. */
const callTaskId = "factory-view";

const byId = Object.fromEntries(TASKS.map((t) => [t.id, t]));
const inboxFor = (t) => INBOX.filter((i) => i.taskId === t.id);
const allPRs = () => TASKS.flatMap((t) => t.pullRequests.named.map((p) => ({ ...p, taskId: t.id })));
const linesOf = (p) => p.additions + p.deletions;
/* Waiting on merge: an open pull request, grouped by its checks. Drafts and closed ones are not waiting on a merge. */
const awaiting = () => allPRs().filter((p) => p.state === PR.OPEN);
const merged = () => allPRs().filter((p) => p.state === PR.MERGED);
const unnamedPRs = (t) => Math.max(0, t.pullRequests.total - t.pullRequests.named.length);
const unnamedAgents = (t) => Math.max(0, t.agents.total - t.agents.named.length);
function ago(at) {
  const d = NOW - at;
  if (d < HOUR) return `${Math.max(1, Math.round(d / MIN))}m`;
  if (d < DAY) return `${Math.round(d / HOUR)}h`;
  return `${Math.round(d / DAY)}d`;
}

/* ------------------------------------------------------------------------
   The campus: world coordinates in tiles, N by N.
   x runs down to the right on screen, y down to the left, z up.
   ------------------------------------------------------------------------ */
const N = 20;
const DX = 22, DY = 11, DZ = 25;
let rot = 0;
function R(x, y) {
  switch (rot) {
    case 1: return [N - y, x];
    case 2: return [N - x, N - y];
    case 3: return [y, N - x];
    default: return [x, y];
  }
}
const P = (x, y, z) => [(x - y) * DX, (x + y) * DY - z * DZ];
const PR_ = (x, y, z) => { const [a, b] = R(x, y); return P(a, b, z); };
const pts = (list) => list.map((p) => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
const poly = (list, fill, extra = "") => `<polygon points="${pts(list)}" fill="${fill}" ${extra}/>`;

let theme = "dark";
const PALETTE = {
  dark: {
    slab: "#18191e", ground: "#15161a", road: "#1f2026", line: "rgba(255,255,255,0.16)",
    pad: "#1d1e24", yard: "#1b1c22", wall: "#3a3c46", glass: "#1f2a36", roof: "#2c2e36",
    metal: "#4b4e5a", floor: "#2a2b33", inner: "#24252c", unlit: "#16171c", shadow: "rgba(0,0,0,0.42)",
    deskTop: "#4a4c57", unknown: "#3b3d45", done: "#cfd3dc", barrier: "#e6e8ee",
  },
  light: {
    slab: "#e7e8ec", ground: "#eeeff2", road: "#d3d4da", line: "rgba(255,255,255,0.9)",
    pad: "#f6f6f8", yard: "#e4e5ea", wall: "#f7f7f9", glass: "#bfd3e6", roof: "#e3e4ea",
    metal: "#c4c7d0", floor: "#ececf0", inner: "#dedfe5", unlit: "#c8d2df", shadow: "rgba(30,30,60,0.16)",
    deskTop: "#d0d2da", unknown: "#d6d7dd", done: "#8c919c", barrier: "#ffffff",
  },
};
const C = () => PALETTE[theme];
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const L = (() => { const v = [0.38, -0.32, 0.87]; const m = Math.hypot(...v); return v.map((c) => c / m); })();
function toRgb(c) {
  if (c.startsWith("#")) { const n = parseInt(c.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  const m = c.match(/[\d.]+/g); return [Number(m[0]), Number(m[1]), Number(m[2])];
}
function shade(color, normal) {
  const d = Math.max(0, normal[0] * L[0] + normal[1] * L[1] + normal[2] * L[2]);
  const f = (theme === "dark" ? 0.62 : 0.8) + (theme === "dark" ? 0.5 : 0.22) * d;
  const [r, g, b] = toRgb(color);
  const c = (v) => Math.max(0, Math.min(255, Math.round(v * f)));
  return `rgb(${c(r)},${c(g)},${c(b)})`;
}
const TOP = [0, 0, 1], FX = [1, 0, 0], FY = [0, 1, 0];

/* A box in world tiles, turned with the campus. */
function turnBox(b) {
  const c = [[b.x, b.y], [b.x + b.w, b.y], [b.x + b.w, b.y + b.d], [b.x, b.y + b.d]].map(([x, y]) => R(x, y));

/* ------------------------------------------------------------------------
   Where things stand: worked out from the work on every draw, never stored.
   Tasks take the district's plots in the order they were started, oldest
   at the back. Pull requests stand in the gate yard while open, grouped by
   their checks, or in the shipped yard once merged.
   ------------------------------------------------------------------------ */
const PLOTS = [[0.8, 0.8], [6.6, 0.8], [0.8, 5.6], [6.6, 5.6], [0.8, 10.4], [6.6, 10.4], [0.8, 15.2], [6.6, 15.2]];
const PLOT_W = 4.6, PLOT_D = 3.8;
const BODY = { dx: 0.5, dy: 0.35, w: 3.4, d: 2.5 };
const FLOOR_H = 0.62;
const LIFT = 58; /* how far apart the floors stand once a building is opened, in the scene's pixels */
function placed() {
  return TASKS.slice().sort((a, b) => a.createdAt - b.createdAt).map((t, i) => ({ task: t, plot: PLOTS[i] }));
}
const YARD = { x: 14.2, y: 0.6, w: 5.4, d: 8.2 };
const BAYS = [
  { checks: CHECKS.FAILING, label: "Checks failing", tone: "--danger", y: 0.8, d: 2.4 },
  { checks: CHECKS.PENDING, label: "Checks running", tone: "--state-attention", y: 3.4, d: 2.4 },
  { checks: CHECKS.NONE, label: "No checks", tone: "--text-tertiary", y: 0, d: 0 },
  { checks: CHECKS.PASSING, label: "Ready to merge", tone: "--state-complete", y: 6.0, d: 2.6 },
];
const GATE_Y = 9.05;
const SHIPPED = { x: 14.2, y: 10.4, w: 5.4, d: 9 };

/* One shared scale for every crate: its volume is proportional to the lines
   it changes (additions + deletions), so an edge grows as the cube root.
   Not linear in an edge: a crate twice as wide changes eight times as much. */
const REF_LINES = 100, REF_EDGE = 0.8;
const edgeFor = (lines) => REF_EDGE * Math.cbrt(lines / REF_LINES);
const UNKNOWN_EDGE = 0.7;

function cratePositions() {
  const list = [];
  for (const bay of BAYS) {
    if (!bay.d) continue;
    const prs = awaiting().filter((p) => p.checks === bay.checks).sort((a, b) => a.number - b.number);
    let x = YARD.x + 1.2;
    for (const p of prs) {
      const e = edgeFor(linesOf(p));
      list.push({ pr: p, x: x + e / 2, y: bay.y + bay.d / 2, e, where: "gate" });
      x += e + 0.7;
    }
  }
  const shipped = merged().sort((a, b) => a.number - b.number);
  shipped.forEach((p, i) => {
    const e = edgeFor(linesOf(p));
    const col = i % 2, row = Math.floor(i / 2);
    list.push({ pr: p, x: SHIPPED.x + 1.5 + col * 2.3, y: SHIPPED.y + 1.6 + row * 2.2, e, where: "shipped" });
  });
  /* Pull requests a task counts but does not name: their state and size are unknown, so they stay at the task's door. */
  for (const { task, plot } of placed()) {
    const n = unnamedPRs(task);
    for (let k = 0; k < n; k++) {
      list.push({ unknown: true, taskId: task.id, k, x: plot[0] + PLOT_W - 0.6 - k * 0.9, y: plot[1] + PLOT_D - 0.5, e: UNKNOWN_EDGE, where: "door" });
    }
  }
  return list;
}

/* ------------------------------------------------------------------------
   What a task and an agent are doing, read from the fields above.
   ------------------------------------------------------------------------ */
function agentTone(task, agent) {
  if (INBOX.some((i) => i.agentId === agent.id)) return "--state-attention";
  if (agent.status === AGENT.RUNNING || agent.status === AGENT.STARTING) return "--state-working";
  if (agent.status === AGENT.FAILED) return "--danger";
  return null;
}
function agentWord(task, agent) {
  if (INBOX.some((i) => i.agentId === agent.id)) return "asked a question";
  return { starting: "starting", running: "running", completed: "turn ended", failed: "failed", cancelled: "stopped" }[agent.status];
}
function taskTone(t) {
  if (inboxFor(t).length) return "--state-attention";
  if (t.id === callTaskId) return "--voice-developer";
  if (t.agents.named.some((a) => a.status === AGENT.FAILED)) return "--danger";
  if (t.agents.working > 0) return "--state-working";
  if (t.pullRequests.named.some((p) => p.state === PR.OPEN && p.checks === CHECKS.PASSING)) return "--state-complete";
  if (t.pullRequests.named.length && t.pullRequests.named.every((p) => p.state === PR.MERGED)) return "--state-merged";
  return "--text-tertiary";
}
function taskMeta(t) {
  const n = inboxFor(t).length;
  if (n) return `${n} question${n > 1 ? "s" : ""} in the Inbox`;
  if (t.id === callTaskId && t.agents.total === 0) return "On this Mac's call · no agents";
  const parts = [];
  if (t.agents.total) parts.push(`${t.agents.total} agent${t.agents.total > 1 ? "s" : ""}`);
  if (t.agents.working) parts.push(`${t.agents.working} running`);
  if (unnamedAgents(t)) parts.push(`${t.agents.named.length} named`);
  return parts.join(" · ") || "No agents";
}

/* ------------------------------------------------------------------------
   Drawing.
   ------------------------------------------------------------------------ */
const $ = (id) => document.getElementById(id);
let openId = null;
let hotPR = null;
let hoverTask = null;

function sign(x, y, z, title, meta, tone, below) {
  const [px, py] = PR_(x, y, z);
  const width = Math.max(textWidth(title, 11, 650), meta ? textWidth(meta, 10, 500) : 0) + (tone ? 30 : 18);
  const h = meta ? 32 : 20;
  /* A sign stands over its point, or, `below`, hangs off to its lower right. */
  const left = below ? 6 : -width / 2;
  const tx = left + (tone ? 21 : 9);

  return `<g class="tag sign" data-anchor="${px.toFixed(1)},${py.toFixed(1)}" transform="translate(${px.toFixed(1)},${py.toFixed(1)})">` +
    `<rect class="ground" x="${left}" y="${top}" width="${width}" height="${h}" rx="7"/>` +
    (tone ? `<circle cx="${left + 12}" cy="${top + 11}" r="3.5" fill="${css(tone)}"/>` : "") +
    `<text x="${tx}" y="${top + 14.5}">${title}</text>` + (meta ? `<text class="meta" x="${tx}" y="${top + 27}">${meta}</text>` : "") + "</g>";

function renderGround() {
  const c = C();
  let s = boxSVG({ x: 0, y: 0, w: N, d: N, z: -0.6, h: 0.6 }, "slab", { topFill: c.ground });
  /* The avenue from the district to the gate, and the lanes between the plots. */
  s += flat(12.3, 0, 1.4, N, c.road, 0.01);
  for (let i = 0.5; i < N; i += 1.2) s += flat(12.96, i, 0.08, 0.6, c.line, 0.02);
  s += flat(0, 4.75, 12.3, 0.7, c.road, 0.01) + flat(0, 9.55, 12.3, 0.7, c.road, 0.01) + flat(0, 14.35, 12.3, 0.7, c.road, 0.01);
  /* The gate yard, its bays painted by checks, and the shipped yard past the gate. */
  s += flat(YARD.x, YARD.y, YARD.w, YARD.d, c.yard, 0.015);
  for (const bay of BAYS) {
    if (!bay.d) continue;
    const tone = css(bay.tone);
    s += flat(YARD.x + 0.2, bay.y, YARD.w - 0.4, bay.d, tone, 0.02, `opacity="${theme === "dark" ? 0.1 : 0.12}"`);
    s += poly([PR_(YARD.x + 0.2, bay.y, 0.025), PR_(YARD.x + YARD.w - 0.2, bay.y, 0.025), PR_(YARD.x + YARD.w - 0.2, bay.y + bay.d, 0.025), PR_(YARD.x + 0.2, bay.y + bay.d, 0.025)], "none", `stroke="${tone}" stroke-opacity="0.55" stroke-width="1.2" stroke-dasharray="6 4"`);
  }

  s += poly([PR_(SHIPPED.x + 0.2, SHIPPED.y + 0.2, 0.025), PR_(SHIPPED.x + SHIPPED.w - 0.2, SHIPPED.y + 0.2, 0.025), PR_(SHIPPED.x + SHIPPED.w - 0.2, SHIPPED.y + SHIPPED.d - 0.2, 0.025), PR_(SHIPPED.x + 0.2, SHIPPED.y + SHIPPED.d - 0.2, 0.025)], "none", `stroke="${css("--state-merged")}" stroke-opacity="0.55" stroke-width="1.2" stroke-dasharray="6 4"`);

function renderPlots() {
  const c = C();
  let s = "";
  for (const { task, plot } of placed()) {
    const [x, y] = plot;
    const edge = [PR_(x, y, 0.1), PR_(x + PLOT_W, y, 0.1), PR_(x + PLOT_W, y + PLOT_D, 0.1), PR_(x, y + PLOT_D, 0.1)];
    s += `<g class="plot" data-plot="${task.id}">${boxSVG({ x, y, w: PLOT_W, d: PLOT_D, z: 0, h: 0.1 }, "pad", { topFill: c.pad })}<polygon class="plot-edge" points="${pts(edge)}"/></g>`;
  }

    `<text x="${mx}" y="${my + 4}" text-anchor="middle" font-size="11" font-weight="600" fill="${css("--text-tertiary")}">+ New task</text></g>`;

function bodyBox(plot, z, h) { return { x: plot[0] + BODY.dx, y: plot[1] + BODY.dy, w: BODY.w, d: BODY.d, z, h }; }

function renderShadows() {
  let s = "";
  for (const { task, plot } of placed()) {
    const h = task.agents.total === 0 ? 0.9 : task.agents.total * FLOOR_H + 0.12;
    s += shadowSVG(bodyBox(plot, 0, h));

/* A figure on a floor: an agent in its harness's clay, a person in their tile's hue. */

    s += `<g class="roof" style="--lift:40">${boxSVG({ ...b, x: b.x - 0.1, y: b.y - 0.1, w: b.w + 0.2, d: b.d + 0.2, z: 0.9, h: 0.12 }, "roof")}</g>`;

  } else {

    /* Split across its width, so its top and its front both show the two shares. */
    const wa = (e * c.pr.additions) / L2, wd = e - wa;
    if (wa > 0) s += boxSVG({ x: b.x, y: b.y, w: wa, d: e, z: 0, h: e }, css("--state-complete"));
    if (wd > 0) s += boxSVG({ x: b.x + wa, y: b.y, w: wd, d: e, z: 0, h: e }, css("--danger"));

}
function gateSVG() {

  s += boxSVG({ x: YARD.x, y: GATE_Y - 0.1, w: 0.9, d: 0.9, z: 1, h: 0.1 }, "roof");
  const [ax, ay] = PR_(YARD.x + 0.95, GATE_Y + 0.35, 0.62);

  s += `<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="${css("--danger")}" stroke-width="3.2" stroke-dasharray="7 7" stroke-linecap="butt"/>`;
  const [px, py] = PR_(YARD.x + YARD.w - 0.1, GATE_Y + 0.35, 0);

function bayLampSVG(bay) {

  return `<line x1="${gx}" y1="${gy}" x2="${px}" y2="${py}" stroke="${C().metal}" stroke-width="1.6"/><circle class="${running ? "loop pulse" : ""}" cx="${px}" cy="${py}" r="4" fill="${col}" filter="url(#glow)"/>`;
}

function renderObjects() {
  const list = [];
  for (const { task, plot } of placed()) {
    const label = `${task.name}: ${taskMeta(task)}`;
    list.push({ depth: depthOf(plot[0] + PLOT_W / 2, plot[1] + PLOT_D / 2),
      svg: `<g class="bldg" data-id="${task.id}" tabindex="0" role="button" aria-label="${label}" ${openId === task.id ? "data-open" : ""}>${buildingSVG(task, plot)}</g>` });
  }
  for (const c of cratePositions()) list.push({ depth: depthOf(c.x, c.y), svg: crateSVG(c) });
  list.push({ depth: depthOf(YARD.x + 0.45, GATE_Y + 0.35), svg: gateSVG() });
  for (const bay of BAYS) if (bay.d) list.push({ depth: depthOf(YARD.x + 0.45, bay.y + 0.35), svg: bayLampSVG(bay) });
  list.sort((a, b) => a.depth - b.depth);
  $("layer-objects").innerHTML = list.map((i) => i.svg).join("");
}

function renderTags() {
  let s = "";
  for (const { task, plot } of placed()) {
    const top = task.agents.total === 0 ? 1.2 : task.agents.total * FLOOR_H + 0.2;
    const fx = inboxFor(task).length || task.id === callTaskId ? 1.2 : 0.25;
    const [x, y] = PR_(plot[0] + BODY.dx + BODY.w / 2, plot[1] + BODY.dy + BODY.d / 2, top + fx);
    const meta = taskMeta(task);
    const width = Math.max(textWidth(task.name, 11.5, 600), textWidth(meta, 10.5, 500)) + 30;
    s += `<g class="tag" data-tag="${task.id}" data-anchor="${x.toFixed(1)},${y.toFixed(1)}" transform="translate(${x.toFixed(1)},${y.toFixed(1)})">` +
      `<rect class="ground" x="${-width / 2}" y="-40" width="${width}" height="34" rx="8"/>` +
      `<line x1="0" y1="-6" x2="0" y2="0" stroke="${css("--hairline-strong")}"/>` +
      `<circle cx="${-width / 2 + 12}" cy="-28" r="3.5" fill="${css(taskTone(task))}"/>` +
      `<text x="${-width / 2 + 21}" y="-24">${task.name}</text>` +
      `<text class="meta" x="${-width / 2 + 21}" y="-11">${meta}</text></g>`;
  }
  for (const bay of BAYS) {
    if (!bay.d) continue;
    const prs = awaiting().filter((p) => p.checks === bay.checks);
    const lines = prs.reduce((a, p) => a + linesOf(p), 0);
    s += sign(YARD.x + YARD.w, bay.y + bay.d / 2, 0.05, `${bay.label} · ${prs.length}${prs.length ? ` · ${lines.toLocaleString()} lines` : ""}`, null, bay.tone);
  }
  const ship = merged();
  const add = ship.reduce((a, p) => a + p.additions, 0), del = ship.reduce((a, p) => a + p.deletions, 0);
  s += sign(SHIPPED.x + SHIPPED.w / 2, SHIPPED.y + SHIPPED.d, 0.05, `Shipped · ${ship.length} merged PRs · +${add} −${del}`, "Sample: merged PRs the listed tasks' summaries name · not all-time", "--state-merged");
  s += sign(YARD.x + YARD.w + 0.1, GATE_Y + 0.35, 0.62, `Merge gate · ${awaiting().length} open PRs behind it`, "Grouped by checks · not a merge queue, no order · merging happens on GitHub", null, true);
  $("layer-tags").innerHTML = s;
  applyTagScale();
}
const canvas = document.createElement("canvas").getContext("2d");
function textWidth(t, size, weight) { canvas.font = `${weight} ${size}px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif`; return canvas.measureText(t).width; }

/* A dashed line on the ground from a task's door to each of its crates, while either is pointed at. */
function renderRoutes() {
  const ids = new Set();
  if (hoverTask) ids.add(hoverTask);
  if (hotPR) ids.add(hotPR.taskId);
  if (openId) ids.add(openId);
  let s = "";
  for (const { task, plot } of placed()) {
    if (!ids.has(task.id)) continue;
    const door = [plot[0] + PLOT_W / 2, plot[1] + PLOT_D];
    for (const c of cratePositions()) {
      if ((c.unknown ? c.taskId : c.pr.taskId) !== task.id || c.unknown) continue;
      const via1 = [13, door[1]], via2 = [13, c.y];
      const line = [door, via1, via2, [c.x, c.y]].map(([x, y]) => PR_(x, y, 0.04));
      s += `<polyline class="route" points="${pts(line)}" stroke="${css(taskTone(task))}"/>`;
    }
  }
  $("layer-routes").innerHTML = s;
}

function renderAll() {
  renderGround(); renderPlots(); renderShadows(); renderObjects(); renderTags(); renderRoutes();
  syncMarks();
}

/* ------------------------------------------------------------------------
   The camera: pan by dragging, zoom with the wheel or the buttons, fly to a
   building when it is opened.
   ------------------------------------------------------------------------ */
const cam = { x: 0, y: 0, s: 1 };
function sceneBounds() {
  const corners = [[0, 0], [N, 0], [N, N], [0, N]].map(([x, y]) => P(x, y, 0));
  const xs = corners.map((c) => c[0]), ys = corners.map((c) => c[1]);
  const tallest = Math.max(...TASKS.map((t) => t.agents.total * FLOOR_H)) + 2;
  /* Room past the right corner for the bays' signs, which hang off the yard's edge. */
  return { x0: Math.min(...xs), x1: Math.max(...xs) + 14 * DX, y0: Math.min(...ys) - tallest * DZ, y1: Math.max(...ys) + 0.6 * DZ };
}
function applyTagScale() {
  const k = 1 / cam.s;
  for (const t of document.querySelectorAll(".tag")) t.setAttribute("transform", `translate(${t.dataset.anchor}) scale(${k.toFixed(4)})`);
}
function applyCamera(instant) {
  const g = $("camera");
  g.toggleAttribute("data-instant", !!instant);
  g.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.s})`;
  applyTagScale();
  if (instant) requestAnimationFrame(() => g.removeAttribute("data-instant"));
}
/* What the key covers at the stage's left while it stands, so the campus is framed beside it. */
const keyInset = () => ($("key").hasAttribute("data-hidden") ? 0 : $("key").offsetWidth + 16);
function baseScale() {
  const st = $("stage").getBoundingClientRect();
  const b = sceneBounds();
  return Math.min((st.width - keyInset() - 80) / (b.x1 - b.x0), (st.height - 80) / (b.y1 - b.y0));
}
function fitCampus(instant) {
  const st = $("stage").getBoundingClientRect();
  const b = sceneBounds();
  cam.s = baseScale();
  cam.x = keyInset() + (st.width - keyInset()) / 2 - ((b.x0 + b.x1) / 2) * cam.s;
  cam.y = st.height / 2 - ((b.y0 + b.y1) / 2) * cam.s + 6;
  applyCamera(instant);
}
let focusCrate = null;
function focusOn(id, instant) {
  const st = $("stage").getBoundingClientRect();
  const crate = focusCrate && cratePositions().find((c) => !c.unknown && c.pr.number === focusCrate);
  if (crate) {
    const [cx, cy] = PR_(crate.x, crate.y, crate.e / 2);
    cam.s = baseScale() * 2.2;
    cam.x = st.width / 2 - cx * cam.s;
    cam.y = st.height / 2 - cy * cam.s;
    applyCamera(instant);
    return;
  }
  const spot = placed().find((p) => p.task.id === id);
  const task = byId[id];
  const floors = Math.max(1, task.agents.total);
  const [px, py] = PR_(spot.plot[0] + PLOT_W / 2, spot.plot[1] + PLOT_D / 2, 0);
  /* Opened, the floors stand LIFT apart; frame them all. */
  const height = floors * (FLOOR_H * DZ + LIFT) + 60;
  cam.s = Math.max(Math.min(baseScale() * 2, (st.height - 140) / height), baseScale() * 1.1);
  cam.x = st.width / 2 - px * cam.s;
  cam.y = st.height / 2 - (py - height / 2 + 30) * cam.s;
  applyCamera(instant);
}
function zoomBy(f, cx, cy) {
  const st = $("stage").getBoundingClientRect();
  const ox = cx ?? st.width / 2, oy = cy ?? st.height / 2;
  const ns = Math.max(0.35, Math.min(5, cam.s * f));
  cam.x = ox - ((ox - cam.x) * ns) / cam.s;
  cam.y = oy - ((oy - cam.y) * ns) / cam.s;
  cam.s = ns;
}

/* ------------------------------------------------------------------------
   Opening a task, the inspector, and the one act it offers: an Inbox reply.
   ------------------------------------------------------------------------ */
function syncMarks() {
  for (const p of document.querySelectorAll(".plot")) {
    const id = p.dataset.plot;
    p.toggleAttribute("data-hover", hoverTask === id);
    p.toggleAttribute("data-open", openId === id);
    p.toggleAttribute("data-focus", focusTask === id);
  }
  for (const g of document.querySelectorAll(".bldg")) g.toggleAttribute("data-open", g.dataset.id === openId);
  for (const c of document.querySelectorAll(".crate")) {
    c.toggleAttribute("data-mine", c.dataset.task === openId);
    c.toggleAttribute("data-hot", (hotPR && c.dataset.crate === String(hotPR.number)) || c.dataset.task === hoverTask);
  }
  for (const t of document.querySelectorAll(".tag[data-tag]")) {
    t.toggleAttribute("data-dim", !!openId && t.dataset.tag !== openId);
    t.toggleAttribute("data-hide", t.dataset.tag === openId);
  }
  for (const r of document.querySelectorAll(".task-row")) r.setAttribute("aria-current", r.dataset.id === openId ? "true" : "false");
  $("scene").toggleAttribute("data-focused", !!openId);
  renderRoutes();
}
let keyAutoHidden = false;
function open(id, prNumber) {
  openId = id;
  focusCrate = prNumber ?? null;
  if (!keyAutoHidden) { keyAutoHidden = true; setKey(false); }
  syncMarks();
  $("inspector").setAttribute("data-open", "");
  renderInspector(prNumber);
  requestAnimationFrame(() => focusOn(id, false));
}
function close() {
  if (!openId) return;
  const id = openId;
  openId = null;
  syncMarks();
  $("inspector").removeAttribute("data-open");
  requestAnimationFrame(() => fitCampus(false));
  document.querySelector(`.bldg[data-id="${id}"]`)?.focus({ preventScroll: true });
}

const STATE_CHIP = {
  open: { [CHECKS.PASSING]: ["Ready to merge", "--state-complete"], [CHECKS.PENDING]: ["Checks running", "--state-attention"], [CHECKS.FAILING]: ["Checks failing", "--danger"], [CHECKS.NONE]: ["No checks", "--text-tertiary"] },
};
function prChip(p) {
  if (p.state === PR.MERGED) return ["Merged", "--state-merged"];
  if (p.state === PR.CLOSED) return ["Closed", "--text-tertiary"];
  if (p.state === PR.DRAFT) return ["Draft", "--text-tertiary"];
  return STATE_CHIP.open[p.checks];
}
function renderInspector(prNumber) {
  const t = byId[openId];

  let i = 0;
  const n = () => `style="--i:${i++}"`;
  let h = `<div class="insp-head" ${n()}><div class="titles"><div class="insp-title">${t.name}</div><div class="insp-path">${t.repository}</div></div>` +
    `<button type="button" class="icon-button" id="insp-close" aria-label="Close">${glyph("x")}</button></div>`;
  if (t.id === callTaskId) {
    h += `<div class="insp-state" style="--tone:var(--voice-developer);--i:${i++}">${glyph("mic")}On this Mac's call<span class="meter" aria-hidden="true"><i></i><i></i><i></i><i></i></span></div>`;
  }
  for (const item of inboxFor(t)) {
    const asker = t.agents.named.find((a) => a.id === item.agentId);
    h += `<div class="card" ${n()}><div class="who"><span class="actor">${claudeMark()}</span>${asker ? asker.model : "An agent"} asks<span class="when">${ago(item.postedAt)} ago</span></div>` +
      `<p>${item.title}</p><div class="choices">${item.options.map((o) => `<button type="button" class="choice" data-answer="${o}" data-item="${item.id}">${o}</button>`).join("")}</div>` +
      `<div class="note">Your pick is the Inbox item's reply.</div></div>`;
  }
  h += `<div class="insp-section" ${n()}>Agents <span class="count">${t.agents.total}</span>${t.agents.working ? `<span>· ${t.agents.working} running</span>` : ""}</div>`;
  if (t.agents.total === 0) h += `<div class="row" data-unknown ${n()}>None yet</div>`;
  for (const a of t.agents.named) {
    const tone = agentTone(t, a);
    h += `<div class="row" ${n()}><span class="actor">${claudeMark()}</span><span class="grow">${a.model} <span class="sub">· ${a.effort}</span></span>` +
      `<span class="meta" style="${tone ? `color:var(${tone})` : ""}">${agentWord(t, a)}${a.at ? ` · ${ago(a.at)}` : ""}</span></div>`;
  }
  if (unnamedAgents(t)) h += `<div class="row" data-unknown ${n()}><span class="actor" data-unknown>+${unnamedAgents(t)}</span><span class="grow">${unnamedAgents(t)} more not named in the summary</span></div>`;
  h += `<div class="insp-section" ${n()}>Pull requests <span class="count">${t.pullRequests.total}</span></div>`;
  if (t.pullRequests.total === 0) h += `<div class="row" data-unknown ${n()}>None yet</div>`;

      `<span class="bar" role="img" aria-label="${p.additions} additions and ${p.deletions} deletions"><i style="width:${(100 * p.additions) / L2}%;background:var(--state-complete)"></i><i style="width:${(100 * p.deletions) / L2}%;background:var(--danger)"></i></span>` +
      `<span class="diffstat"><span class="add">+${p.additions}</span> <span class="del">−${p.deletions}</span> <span style="color:var(--text-tertiary)">· ${L2} lines</span></span></div>`;
  }
  if (unnamedPRs(t)) h += `<div class="row" data-unknown ${n()}><span class="actor" data-unknown>?</span><span class="grow">${unnamedPRs(t)} more not named in the summary · state and size unknown</span></div>`;

let toastTimer = 0;

function answer(itemId, choice) {
  const k = INBOX.findIndex((i) => i.id === itemId);
  if (k < 0) return;
  const item = INBOX[k];
  INBOX.splice(k, 1);
  /* A reply hands the agent a message, so its turn starts again. */
  const agent = byId[item.taskId].agents.named.find((a) => a.id === item.agentId);
  if (agent) { agent.status = AGENT.RUNNING; agent.at = NOW; byId[item.taskId].agents.working += 1; }
  toast(`${glyph("check")}Replied “${choice}”`);

}

    `<div class="key-scale">${ref(50)}${ref(200)}${ref(800)}<span>Volume = lines changed.<br><b style="color:var(--text-secondary)">Not linear</b>: edge ∝ ∛lines.</span></div>` +
    k(`<rect x="-6" y="-6" width="12" height="12" fill="none" stroke="${css("--text-tertiary")}" stroke-dasharray="2.5 2"/><text y="3.5" text-anchor="middle" font-size="9" font-weight="800" fill="${css("--text-secondary")}">?</text>`, "<b>Dashed crate</b> = a PR its summary doesn't name: size unknown, not zero.") +
    k(`<line x1="-9" y1="0" x2="9" y2="0" stroke="${css("--danger")}" stroke-width="3" stroke-dasharray="4 4"/>`, "<b>Gate yard</b> = open PRs by checks. Not a merge queue.") +
    k(`<rect x="-8" y="-5" width="7" height="7" fill="${css("--state-merged")}" opacity="0.8"/><rect x="1" y="-1" width="6" height="6" fill="${css("--state-merged")}" opacity="0.5"/>`, "<b>Shipped yard</b> = merged PRs the summaries name: a sample.");
}

/* The card a crate shows under the pointer or the keyboard: its numbers. */
function showCrateCard(el) {
  const card = $("crate-card");
  const key = el.dataset.crate;
  const stage = $("stage").getBoundingClientRect();
  const r = el.getBoundingClientRect();
  let html;
  if (key.startsWith("u-")) {
    const t = byId[el.dataset.task];
    html = `<div class="title">Pull request not named</div><div class="line">${t.name} counts ${t.pullRequests.total}; its summary names ${t.pullRequests.named.length}.</div><div class="line">State and size unknown.</div>`;
  } else {
    const p = allPRs().find((q) => String(q.number) === key);
    const [word, tone] = prChip(p);
    html = `<div class="title">#${p.number} ${p.title}</div>` +
      `<div class="line"><span class="diffstat"><span class="add">+${p.additions}</span> <span class="del">−${p.deletions}</span></span> · ${linesOf(p)} lines changed</div>` +
      `<div class="line"><span class="chip" style="--tone:var(${tone})">${word}</span> · ${byId[p.taskId].name}</div>`;
  }
  card.innerHTML = html;
  card.removeAttribute("data-hidden");
  const w = card.offsetWidth;
  let left = r.left - stage.left + r.width / 2 - w / 2;
  left = Math.max(8, Math.min(stage.width - w - 8, left));
  card.style.left = `${left}px`;
  card.style.top = `${Math.max(8, r.top - stage.top - card.offsetHeight - 10)}px`;
}
function hideCrateCard() { $("crate-card").setAttribute("data-hidden", ""); }

/* ------------------------------------------------------------------------
   Wiring.
   ------------------------------------------------------------------------ */
function setTheme(t) {
  theme = t;
  document.documentElement.dataset.theme = t;
  for (const b of document.querySelectorAll("[data-theme-choice]")) b.setAttribute("aria-pressed", String(b.dataset.themeChoice === t));
  renderAll(); renderKey(); renderSidebar(); applyCamera(true);
}
for (const b of document.querySelectorAll("[data-theme-choice]")) b.addEventListener("click", () => setTheme(b.dataset.themeChoice));

const scene = $("scene");
function activate(target) {
  const crate = target.closest(".crate");
  if (crate) { open(crate.dataset.task, Number(crate.dataset.crate) || undefined); return true; }
  const g = target.closest(".bldg");
  if (g) { open(g.dataset.id); return true; }
  if (target.closest("#new-plot")) { toast(`${glyph("plus")}A new task takes the next plot`); return true; }
  return false;
}
scene.addEventListener("click", (e) => {
  if (dragMoved) return;
  if (!activate(e.target) && openId) close();
});
scene.addEventListener("pointerover", (e) => {
  const crate = e.target.closest(".crate");
  const g = e.target.closest(".bldg");
  const task = crate ? crate.dataset.task : g ? g.dataset.id : null;
  const pr = crate && !crate.dataset.crate.startsWith("u-") ? allPRs().find((q) => String(q.number) === crate.dataset.crate) : null;
  if (crate) showCrateCard(crate); else hideCrateCard();
  if (task !== hoverTask || pr !== hotPR) { hoverTask = task; hotPR = pr; syncMarks(); }
});
scene.addEventListener("pointerleave", () => { hideCrateCard(); hoverTask = null; hotPR = null; syncMarks(); });
scene.addEventListener("focusin", (e) => {
  const g = e.target.closest(".bldg");
  focusTask = g?.matches(":focus-visible") ? g.dataset.id : null;
  const crate = e.target.closest(".crate");
  if (crate?.matches(":focus-visible")) showCrateCard(crate);
  syncMarks();
});
scene.addEventListener("focusout", () => { focusTask = null; hideCrateCard(); syncMarks(); });
scene.addEventListener("keydown", (e) => {
  if ((e.key === "Enter" || e.key === " ") && activate(e.target)) e.preventDefault();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") close();
  if (e.key === "r" && !e.metaKey && !e.target.closest("input, textarea")) turn();
});
$("task-list").addEventListener("click", (e) => { const r = e.target.closest(".task-row"); if (r) open(r.dataset.id); });
$("inspector").addEventListener("click", (e) => {
  if (e.target.closest("#insp-close")) close();
  const a = e.target.closest("[data-answer]");
  if (a) answer(a.dataset.item, a.dataset.answer);
  if (e.target.closest("#open-task")) toast(`${glyph("open")}Opens the task`);
});
$("needs-you").addEventListener("click", () => {
  const list = [...new Set([...INBOX.map((i) => i.taskId), ...readyPRs().map((p) => p.taskId)])];
  if (!list.length) return;
  const cur = list.indexOf(openId);
  const next = list[(cur + 1) % list.length];
  open(next, readyPRs().find((p) => p.taskId === next)?.number);
});
$("zoom-in").addEventListener("click", () => { zoomBy(1.3); applyCamera(false); });
$("zoom-out").addEventListener("click", () => { zoomBy(1 / 1.3); applyCamera(false); });
$("fit").addEventListener("click", () => { if (openId) close(); else fitCampus(false); });
function turn() {
  rot = (rot + 1) % 4;
  renderAll();
  if (openId) focusOn(openId, true); else fitCampus(true);
}
$("rotate").addEventListener("click", turn);
function setKey(shown) {
  $("key").toggleAttribute("data-hidden", !shown);
  $("key-toggle").setAttribute("aria-pressed", String(shown));
  if (!openId) fitCampus(false);
}
$("key-close").addEventListener("click", () => setKey(false));
$("key-toggle").addEventListener("click", () => setKey($("key").hasAttribute("data-hidden")));

const stage = $("stage");
let drag = null, dragMoved = false;
stage.addEventListener("pointerdown", (e) => {
  if (e.target.closest(".map-controls, .key, .toast")) return;
  drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y };
  dragMoved = false;
});
window.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!dragMoved && Math.hypot(dx, dy) < 4) return;
  dragMoved = true;
  hideCrateCard();
  stage.setAttribute("data-dragging", "");
  cam.x = drag.cx + dx; cam.y = drag.cy + dy;
  applyCamera(true);
});
window.addEventListener("pointerup", () => {
  drag = null;
  stage.removeAttribute("data-dragging");
  setTimeout(() => { dragMoved = false; }, 0);
});
stage.addEventListener("wheel", (e) => {
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  zoomBy(Math.exp(-e.deltaY * 0.0022), e.clientX - r.left, e.clientY - r.top);
  hideCrateCard();
  applyCamera(true);
}, { passive: false });
new ResizeObserver(() => { if (openId) focusOn(openId, true); else fitCampus(true); }).observe(stage);

/* A link may name a frame; each value is matched to one of the page's own, so nothing from the URL reaches the markup. */
const params = new URLSearchParams(location.search);
const themeParam = params.get("theme");
const systemTheme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
const initialTheme = themeParam === "light" ? "light" : themeParam === "dark" ? "dark" : systemTheme;
const openParam = TASKS.find((t) => t.id === params.get("open"))?.id;
const rotParam = ["1", "2", "3"].indexOf(params.get("rot")) + 1;
renderSidebar();
renderCensus();
setTheme(initialTheme);
fitCampus(true);
if (params.get("key") === "off") setKey(false);
for (let i = 0; i < rotParam; i++) turn();
if (openParam) open(openParam);
</script>
</body>
