<style>
:root { color-scheme: light; --ink: #1d1d1f; --muted: #6e6e73; --rule: #e3e3e6; --ground: #f5f5f7; --card: #fff; --yes: #18794e; --no: #b8232a; --accent: #0a72a8; }
:root[data-theme="dark"] { color-scheme: dark; --ink: #ececee; --muted: #9a9aa2; --rule: #2c2c31; --ground: #111113; --card: #18181b; --yes: #4cc38a; --no: #ff8a8f; --accent: #5cb8e6; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
#root { max-width: 1240px; margin: 0 auto; padding: 40px 32px 120px; }
a { color: var(--accent); }
code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; padding: 1px 4px; border-radius: 4px; background: color-mix(in srgb, var(--ink) 7%, transparent); }
h1 { margin: 4px 0 10px; font-size: 30px; letter-spacing: -0.02em; }
h2 { margin: 64px 0 12px; padding-top: 24px; border-top: 1px solid var(--rule); font-size: 22px; letter-spacing: -0.01em; }
h3 { margin: 32px 0 12px; font-size: 15px; }
.eyebrow { margin: 0; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
.lede { max-width: 860px; color: var(--muted); }
.show-head { display: flex; justify-content: space-between; gap: 24px; align-items: flex-start; }
.theme-pick { display: inline-flex; padding: 2px; border: 1px solid var(--rule); border-radius: 8px; background: var(--card); position: sticky; top: 12px; }
.theme-pick button { border: 0; background: none; color: var(--muted); padding: 6px 12px; border-radius: 6px; font: inherit; cursor: pointer; }
.theme-pick button[aria-pressed="true"] { background: color-mix(in srgb, var(--ink) 9%, transparent); color: var(--ink); }
.toc { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 20px 0 0; font-size: 13px; }
figure { margin: 0; }
figcaption { margin-top: 8px; color: var(--muted); font-size: 12.5px; }
iframe { display: block; width: 1180px; height: 720px; border: 1px solid var(--rule); border-radius: 10px; background: var(--card); }
.solo iframe { width: 100%; }
.solo { overflow-x: auto; }
.grid { display: grid; gap: 28px 20px; }
.grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.three { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.two iframe { zoom: 0.51; }
.grid.three iframe { zoom: 0.51; }
.grid figure { cursor: zoom-in; }
.findings, .decisions { max-width: 920px; padding-left: 22px; }
.findings li, .decisions li { margin: 8px 0; }
.you-demo { margin-left: 0; padding: 0 5px; border-radius: 4px; background: color-mix(in srgb, var(--ink) 10%, transparent); font-size: 10.5px; }
.cols { columns: 2; column-gap: 32px; padding-left: 18px; }
.cols li { break-inside: avoid; margin-bottom: 10px; }
.note { color: var(--muted); max-width: 920px; }
table.matches { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; font-size: 13px; }
.matches th, .matches td { text-align: left; vertical-align: top; padding: 9px 12px; border-top: 1px solid var(--rule); }
.matches th { border-top: 0; color: var(--muted); font-weight: 600; font-size: 12px; }
td.yes { color: var(--yes); } td.no { color: var(--no); }
pre.css { padding: 14px 16px; border: 1px solid var(--rule); border-radius: 10px; background: var(--card); font: 12px/1.5 ui-monospace, Menlo, monospace; overflow-x: auto; }
dialog.zoom { width: min(1240px, 96vw); max-height: 94vh; padding: 0; border: 0; border-radius: 12px; background: var(--card); color: var(--ink); }
dialog.zoom::backdrop { background: rgba(0,0,0,.55); }
dialog.zoom iframe { width: 1180px; zoom: 1; margin: 12px auto 0; }
dialog.zoom p { margin: 8px 16px 14px; color: var(--muted); font-size: 12.5px; }
</style>

<script type="module">
const payload = JSON.parse(document.getElementById("show-payload").textContent);
const unzip = async (b64) => {
  const bytes = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  return new Response(stream).arrayBuffer();
};
const blob = async (b64, type) => URL.createObjectURL(new Blob([await unzip(b64)], { type }));
document.getElementById("root").innerHTML = new TextDecoder().decode(await unzip(payload.page));
const [js, light, dark] = await Promise.all([blob(payload.js, "text/javascript"), blob(payload.light, "text/css"), blob(payload.dark, "text/css")]);
const css = { light, dark };
const tag = (name, attributes, inner) => "<" + name + attributes + ">" + inner + "</" + name + ">";
const load = (frame) => {
  const d = frame.dataset;
  const show = { surface: d.surface, version: d.version, theme: d.theme, id: frame.id, page: d.page, query: d.query };
  frame.srcdoc = "<!doctype html>" + tag("html", " data-theme=" + d.theme, tag("head", "", "<meta charset=utf-8><link rel=stylesheet href=" + css[d.theme] + ">" + tag("script", "", "window.SHOW=" + JSON.stringify(show))) + tag("body", "", tag("div", " id=root", "") + tag("script", " src=" + js, "")));
};
window.addEventListener("message", (event) => {
  const { id, height } = event.data ?? {};
  const frame = id && document.getElementById(id);
  if (frame && typeof height === "number") frame.style.height = height + "px";
});
const themed = (theme) => {
  document.documentElement.dataset.theme = theme;
  for (const button of document.querySelectorAll("[data-pick-theme]")) button.setAttribute("aria-pressed", String(button.dataset.pickTheme === theme));
  for (const frame of document.querySelectorAll("iframe[data-surface]")) {
    frame.dataset.theme = theme;
    if (frame.srcdoc) load(frame);
  }
};
for (const button of document.querySelectorAll("[data-pick-theme]")) button.addEventListener("click", () => themed(button.dataset.pickTheme));
themed(matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
let n = 0;
const seen = new IntersectionObserver((entries) => {
  for (const entry of entries) if (entry.isIntersecting) { seen.unobserve(entry.target); load(entry.target); }
}, { rootMargin: "900px" });
for (const frame of document.querySelectorAll("iframe[data-surface]")) {
  frame.id = "f" + n++;
  frame.title = frame.closest("figure")?.querySelector("figcaption")?.textContent ?? "A frame of the show";
  seen.observe(frame);
}
// A small frame opens full size in a dialog on a press.
const zoom = document.createElement("dialog");
zoom.className = "zoom";
document.body.append(zoom);
zoom.addEventListener("click", (event) => { if (event.target === zoom) zoom.close(); });
for (const figure of document.querySelectorAll(".grid figure")) {
  const shield = document.createElement("div");
  shield.style.cssText = "position:absolute;inset:0;";
  figure.style.position = "relative";
  figure.append(shield);
  shield.addEventListener("click", () => {
    const source = figure.querySelector("iframe");
    const copy = document.createElement("iframe");
    Object.assign(copy.dataset, source.dataset);
    copy.id = "z" + n++;
    zoom.replaceChildren(copy, Object.assign(document.createElement("p"), { textContent: figure.querySelector("figcaption")?.textContent ?? "" }));
    load(copy);
    zoom.showModal();
  });
}
</script>
</body>
