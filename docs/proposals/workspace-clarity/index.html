<script type="module">
// Unpacks the payload. A frame (?frame) draws the app in the theme it names; the page draws the show around frames of itself.
const packed = document.getElementById("show-payload").textContent.replace(/\s+/g, "");
const bytes = Uint8Array.from(atob(packed), (character) => character.charCodeAt(0));
const unzipped = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
const { css, chromeCss, app, chrome } = JSON.parse(await new Response(unzipped).text());
const params = new URLSearchParams(location.search);
const frame = params.has("frame");
const theme = frame ? params.get("theme") : new URLSearchParams(location.hash.slice(1)).get("theme");
const themed = (text, chosen) => !chosen ? text : text
  .replace(/\(prefers-color-scheme:\s*light\)/g, chosen === "light" ? " all" : " not all")
  .replace(/\(prefers-color-scheme:\s*dark\)/g, chosen === "dark" ? " all" : " not all");
const style = document.createElement("style");
style.id = "show-style";
style.textContent = themed(css, theme) + (frame ? "" : chromeCss);
document.head.append(style);
document.getElementById(frame ? "show" : "root").remove();
if (!frame) {
  // The page re-themes itself when its theme changes, without reloading.
  addEventListener("hashchange", () => { style.textContent = themed(css, new URLSearchParams(location.hash.slice(1)).get("theme")) + chromeCss; });
}
const script = document.createElement("script");
script.type = "module";
script.textContent = frame ? app : chrome;
document.body.append(script);
</script>
